<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Agenda Toilettage</title>
<meta name="description" content="Agenda de toilettage : rendez-vous, clients, chiens, prestations et remarques, hors connexion.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Toilettage">
<meta name="theme-color" content="#faf6f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16130f" media="(prefers-color-scheme: dark)">
<style>
:root{
  --bg:#faf6f2;--panel:#fff;--panel2:#f3ece5;--line:#e8ddd2;--fg:#2a2420;--muted:#7a6e65;
  --accent:#c0603f;--accent-soft:#f8e3d9;--accent-ink:#fff;--good:#3d8a5c;--bad:#c4473d;
  --shadow:0 1px 2px rgba(60,30,10,.05),0 4px 14px rgba(60,30,10,.05);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#16130f;--panel:#201c18;--panel2:#2b2621;--line:#3a332c;--fg:#f1ebe5;--muted:#a89c91;
  --accent:#e98a68;--accent-soft:#3d2a21;--accent-ink:#22120b;--good:#6cc48f;--bad:#ec7b70;
  --shadow:none;color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
.wrap{max-width:620px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right)) calc(100px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left))}
h1{font-size:1.4rem;margin:0;letter-spacing:-.01em}
h2{font-size:.78rem;margin:18px 0 8px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
textarea{resize:vertical;min-height:72px}
label{display:block;font-size:.85rem;color:var(--muted);margin:12px 0 4px}
.muted{color:var(--muted)}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.btn{color:inherit;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;padding:9px 16px;font-weight:600;font-size:.92rem;background:var(--panel2);border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{color:var(--bad)}
.btn.small{padding:6px 12px;font-size:.85rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
/* Semaine */
.monthbar{display:flex;align-items:center;gap:6px}
.iconbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:1.2rem;background:var(--panel);border:1px solid var(--line)}
.monthlabel{font-weight:700;font-size:1.05rem;text-transform:capitalize;position:relative}
.monthlabel input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:6px 0 4px;touch-action:pan-y}
.day{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;border-radius:14px;font-size:.75rem;color:var(--muted)}
.day b{font-size:1.1rem;color:var(--fg);font-weight:600}
.day .dots{height:6px;display:flex;gap:2px}
.day .dots i{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.day.today b{color:var(--accent)}
.day.sel{background:var(--accent);color:var(--accent-ink)}
.day.sel b{color:var(--accent-ink)}
.day.sel .dots i{background:var(--accent-ink)}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 8px}
.dayhead h3{margin:0;font-size:1rem}
.cap::first-letter{text-transform:uppercase}
/* Rendez-vous */
.appt{display:flex;gap:12px;padding:12px 14px;margin-bottom:10px;width:100%}
.appt .time{min-width:52px;font-weight:700;font-variant-numeric:tabular-nums}
.appt .time small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
.appt .body{flex:1;min-width:0;border-left:3px solid var(--accent);padding-left:12px}
.appt.done .body{border-left-color:var(--good)}
.appt.done{opacity:.72}
.appt .dog{font-weight:700;font-size:1.05rem}
.appt .client{color:var(--muted);font-size:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{font-size:.78rem;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--fg)}
.note{margin-top:6px;font-size:.88rem;color:var(--muted);white-space:pre-wrap;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.note.warn::before{content:"⚠ ";}
.price{font-weight:600;white-space:nowrap}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty .big{font-size:2.4rem;margin-bottom:6px}
/* Clients */
.search{position:relative;margin-bottom:12px}
.client-row{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;border-bottom:1px solid var(--line)}
.client-row:last-child{border-bottom:0}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;font-weight:700;color:var(--accent);flex:none}
.client-row .name{font-weight:600}
.client-row .sub{font-size:.85rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist{padding:10px 14px;border-bottom:1px solid var(--line);width:100%;display:block}
.hist:last-child{border-bottom:0}
.hist .h1{display:flex;justify-content:space-between;gap:8px;font-weight:600}
/* Barre d'onglets */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:10}
.tabs .in{display:flex;width:100%;max-width:620px;align-items:center}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--muted);padding:4px 0;text-align:center}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--accent);font-weight:600}
.fab{width:58px;height:58px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:2rem;font-weight:300;margin:-26px 10px 0;box-shadow:0 6px 18px rgba(192,96,63,.35);flex:none;line-height:1}
/* Feuille modale */
.sheet-bg{position:fixed;inset:0;background:rgba(20,10,5,.4);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--bg);width:100%;max-width:620px;max-height:94vh;max-height:94dvh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:up .2s ease-out}
.sheet header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet header h3{margin:0;font-size:1.05rem;flex:1;text-align:center}
.sheet .content{overflow-y:auto;padding:4px 16px calc(24px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
.linkbtn{color:var(--accent);font-weight:600;padding:4px 2px;min-width:70px}
.linkbtn.right{text-align:right}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
.svc{display:flex;flex-wrap:wrap;gap:7px}
.svc button{padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:.9rem}
.svc button.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{flex:1;text-align:center;padding:8px 4px;border-radius:9px;font-size:.88rem}
.seg button.on{background:var(--panel);box-shadow:var(--shadow);font-weight:600}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.suggest{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-top:4px;overflow:hidden}
.suggest button{display:block;width:100%;padding:10px 12px;border-bottom:1px solid var(--line)}
.suggest button:last-child{border-bottom:0}
.suggest small{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.9rem;z-index:30;animation:fade .2s;max-width:90vw;text-align:center}
.stat{display:flex;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
.stat:last-child{border-bottom:0}
.list-pad{padding:4px 0}
.hidden{display:none!important}
input[type=checkbox]{accent-color:var(--accent)}
.dogpic{border-radius:50%;object-fit:cover;flex:none;display:block;background:var(--panel2)}
.pics{display:flex;flex:none}
.pics img{border:2px solid var(--panel)}
.pics img+img{margin-left:-14px}
.photo-slot{width:72px;height:72px;border-radius:50%;border:1.5px dashed var(--line);display:grid;place-items:center;font-size:1.5rem;color:var(--muted);flex:none;overflow:hidden;background:var(--panel2)}
.photo-slot img{width:100%;height:100%;object-fit:cover}
.viewseg{width:auto;margin-bottom:8px}
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin:6px 0 4px;touch-action:pan-y}
.month .wd{text-align:center;font-size:.72rem;color:var(--muted);padding:4px 0}
.mday{aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:12px;font-size:.95rem;font-variant-numeric:tabular-nums}
.mday.out{color:var(--muted);opacity:.45}
.mday.today{color:var(--accent);font-weight:700}
.mday.sel{background:var(--accent);color:var(--accent-ink)}
.mday .dots{height:5px;display:flex;gap:2px}
.mday .dots i{width:4px;height:4px;border-radius:50%;background:var(--accent)}
.mday.sel .dots i{background:var(--accent-ink)}
.remind{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.remind:last-child{border-bottom:0}
.remind.sent{opacity:.55}
.svc-edit{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line)}
.svc-edit:last-child{border-bottom:0}
.svc-edit span{flex:1}
.svc-edit button{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
</style>
</head><body>
<div class="wrap" id="app"></div>

<nav class="tabs"><div class="in">
  <button class="tab" data-tab="agenda"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Agenda</button>
  <button class="tab" data-tab="upcoming"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>À venir</button>
  <button class="fab" id="fab" aria-label="Nouveau rendez-vous">+</button>
  <button class="tab" data-tab="clients"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="6" cy="9" r="2"/><circle cx="10" cy="5" r="2"/><circle cx="14" cy="5" r="2"/><circle cx="18" cy="9" r="2"/><path d="M12 11c-3 0-6 4-6 7 0 2 2 3 3.5 2.5S11 19.5 12 19.5s1 .5 2.5 1S18 20 18 18c0-3-3-7-6-7z"/></svg>Clients</button>
  <button class="tab" data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>Réglages</button>
</div></nav>

<script>
'use strict';
/* ---------- Données ---------- */
const KEY='toilettage.v1';
const DEFAULT_SMS='Bonjour, petit rappel : rendez-vous toilettage pour {chien} {jour} à {heure}. À bientôt ! {salon}';
const DEFAULT_SERVICES=['Bain','Séchage','Brushing','Démêlage','Coupe ciseaux','Tonte','Épilation','Coupe des griffes','Oreilles','Yeux','Anti-puces','Dents'];
const BREEDS=['Bichon','Bichon maltais','Bouledogue français','Berger allemand','Berger australien','Border collie','Cavalier King Charles','Caniche','Caniche toy','Chihuahua','Cocker','Golden retriever','Husky','Jack Russell','Labrador','Lhassa Apso','Shih Tzu','Spitz nain','Teckel','Westie','Yorkshire','Croisé','Chat'];
const DURATIONS=[[30,'30 min'],[45,'45 min'],[60,'1 h'],[90,'1 h 30'],[120,'2 h'],[150,'2 h 30'],[180,'3 h'],[240,'4 h']];

function load(){
  let s=null;
  try{s=JSON.parse(localStorage.getItem(KEY));}catch(e){}
  if(!s||!Array.isArray(s.appts))s={appts:[]};
  if(!Array.isArray(s.clients))s.clients=[];
  s.settings=Object.assign({services:[...DEFAULT_SERVICES],salon:'',sms:DEFAULT_SMS,remindDays:1},s.settings||{});
  return s;
}
let S=load();
const svcList=()=>S.settings.services;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast('Impossible d’enregistrer sur ce téléphone');}}
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});

/* ---------- Outils ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d);};
const today=()=>iso(new Date());
const norm=s=>String(s||'').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const fmtDay=s=>parse(s).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
const fmtShort=s=>parse(s).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'});
const fmtPrice=n=>(n===''||n==null||isNaN(n))?'':Number(n).toLocaleString('fr-FR',{minimumFractionDigits:Number(n)%1?2:0,maximumFractionDigits:2})+' €';
const endTime=(t,dur)=>{if(!t)return'';const[h,m]=t.split(':').map(Number);const x=h*60+m+(+dur||0);return pad(Math.floor(x/60)%24)+':'+pad(x%60);};
const fmtDur=m=>{m=+m||0;const h=Math.floor(m/60),r=m%60;return h?(h+' h'+(r?' '+pad(r):'')):r+' min';};
const sortAppts=a=>a.sort((x,y)=>(x.date+(x.time||'99')).localeCompare(y.date+(y.time||'99')));
const telHref=p=>'tel:'+String(p).replace(/[^\d+]/g,'');
const isIOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function smsHref(phone,body){const n=String(phone||'').replace(/[^\d+]/g,'');return 'sms:'+n+(body?(isIOS?'&':'?')+'body='+encodeURIComponent(body):'');}
function relDay(d){const t=today();if(d===t)return 'aujourd’hui';if(d===addDays(t,1))return 'demain';return 'le '+fmtDay(d);}
function reminderText(a){
  const h=a.time?a.time.replace(':','h'):'(heure à confirmer)';
  return S.settings.sms.replace(/\{chien\}/g,a.dog||'votre chien').replace(/\{client\}/g,a.client||'').replace(/\{jour\}/g,relDay(a.date)).replace(/\{date\}/g,fmtDay(a.date)).replace(/\{heure\}/g,h).replace(/\{salon\}/g,S.settings.salon||'').replace(/\s+$/,'').replace(/ {2,}/g,' ');
}
function markReminded(id){const a=S.appts.find(x=>x.id===id);if(a){a.reminded=new Date().toISOString();save();}}
function toast(msg){document.querySelectorAll('.toast').forEach(x=>x.remove());const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200);}

/* Répertoire clients reconstruit à partir des rendez-vous */
function directory(){
  const map=new Map();
  const blank=(k,name)=>({key:k,name,phone:'',email:'',address:'',notes:'',rid:null,dogs:new Map(),appts:[]});
  for(const r of S.clients){const k=norm(r.name);if(!k)continue;
    const c=map.get(k)||blank(k,r.name.trim());map.set(k,c);
    Object.assign(c,{rid:r.id,email:r.email||'',address:r.address||'',notes:r.notes||''});
    for(const d of r.dogs||[]){const dk=norm(d.name);if(dk)c.dogs.set(dk,{name:d.name.trim(),breed:d.breed||'',notes:d.notes||'',photo:d.photo||'',last:null});}}
  for(const a of sortAppts([...S.appts])){
    const k=norm(a.client);if(!k)continue;
    let c=map.get(k);
    if(!c){c=blank(k,a.client.trim());map.set(k,c);}
    c.name=a.client.trim();
    if(a.phone)c.phone=a.phone;
    c.appts.push(a);
    const dk=norm(a.dog);
    if(dk){const d=c.dogs.get(dk)||{name:'',breed:'',notes:'',last:null};d.name=a.dog.trim();if(a.breed)d.breed=a.breed;d.last=a;c.dogs.set(dk,d);}
  }
  // La fiche client enregistrée fait foi pour le nom et le téléphone
  for(const r of S.clients){const c=map.get(norm(r.name));if(!c)continue;c.name=r.name.trim();if(r.phone)c.phone=r.phone;}
  return [...map.values()].sort((a,b)=>a.name.localeCompare(b.name,'fr'));
}

/* ---------- État de l'interface ---------- */
let tab='agenda',sel=today(),q='';
let mode='week';try{mode=localStorage.getItem('toilettage.mode')||'week';}catch(e){}

function render(){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  ({agenda:renderAgenda,upcoming:renderUpcoming,clients:renderClients,settings:renderSettings})[tab]();
}

function apptCard(a,showDate){
  const svc=(a.services||[]).map(s=>`<span class="chip">${esc(s)}</span>`).join('');
  return `<button class="card appt${a.done?' done':''}" data-id="${a.id}">
    <div class="time">${esc(a.time||'—')}${a.time&&a.duration?`<small>${endTime(a.time,a.duration)}</small>`:''}</div>
    <div class="body">
      ${showDate?`<div class="muted cap" style="font-size:.8rem">${esc(fmtDay(a.date))}</div>`:''}
      <div style="display:flex;justify-content:space-between;gap:8px"><span class="dog" style="display:flex;align-items:center;gap:7px">${dogImg(dogPhotoId(a.client,a.dog),28)}<span>${esc(a.dog||'Chien ?')}${a.breed?` <span class="muted" style="font-weight:400;font-size:.88rem">· ${esc(a.breed)}</span>`:''}</span></span><span class="price">${a.done?'✓ ':''}${fmtPrice(a.price)}</span></div>
      <div class="client">${esc(a.client||'Client ?')}</div>
      ${svc?`<div class="chips">${svc}</div>`:''}
      ${a.details?`<div class="note">${esc(a.details)}</div>`:''}
      ${a.notes?`<div class="note warn">${esc(a.notes)}</div>`:''}
    </div></button>`;
}

function monthShift(s,n){const d=parse(s);const day=d.getDate();const x=new Date(d.getFullYear(),d.getMonth()+n,1);const last=new Date(x.getFullYear(),x.getMonth()+1,0).getDate();x.setDate(Math.min(day,last));return iso(x);}
function renderAgenda(){
  const d=parse(sel);const dow=(d.getDay()+6)%7;const monday=addDays(sel,-dow);
  const counts={};for(const a of S.appts)counts[a.date]=(counts[a.date]||0)+1;
  const dots=n=>'<span class="dots">'+'<i></i>'.repeat(Math.min(n,4))+'</span>';
  let week='';
  if(mode==='month'){
    const first=iso(new Date(d.getFullYear(),d.getMonth(),1));const start=addDays(first,-((parse(first).getDay()+6)%7));
    week=['lun','mar','mer','jeu','ven','sam','dim'].map(w=>`<div class="wd">${w}</div>`).join('');
    for(let i=0;i<42;i++){const ds=addDays(start,i);const dd=parse(ds);if(i>=35&&dd.getMonth()!==d.getMonth())break;
      week+=`<button class="mday${dd.getMonth()!==d.getMonth()?' out':''}${ds===sel?' sel':''}${ds===today()?' today':''}" data-day="${ds}">${dd.getDate()}${dots(counts[ds]||0)}</button>`;}
  }else for(let i=0;i<7;i++){const ds=addDays(monday,i);const dd=parse(ds);
    week+=`<button class="day${ds===sel?' sel':''}${ds===today()?' today':''}" data-day="${ds}">${dd.toLocaleDateString('fr-FR',{weekday:'short'}).replace('.','')}<b>${dd.getDate()}</b>${dots(counts[ds]||0)}</button>`;}
  const list=sortAppts(S.appts.filter(a=>a.date===sel));
  const total=list.reduce((s,a)=>s+(+a.price||0),0);
  $('#app').innerHTML=`
    <div class="top">
      <div class="monthbar">
        <button class="iconbtn" data-nav="-1" aria-label="Précédent">‹</button>
        <span class="monthlabel">${d.toLocaleDateString('fr-FR',{month:'long',year:'numeric'})} ▾<input type="date" id="pick" value="${sel}" aria-label="Choisir une date"></span>
        <button class="iconbtn" data-nav="1" aria-label="Suivant">›</button>

      <div style="display:flex;gap:6px;align-items:center">${sel!==today()?'<button class="btn small" id="gotoday">Aujourd’hui</button>':''}<button class="iconbtn" id="photo-btn" aria-label="Importer un agenda papier en photo">📷</button></div>
    </div>
    <div class="seg viewseg" id="mode"><button data-mode="week" class="${mode==='week'?'on':''}">Semaine</button><button data-mode="month" class="${mode==='month'?'on':''}">Mois</button></div>
    <div class="${mode==='month'?'month':'week'}" id="week">${week}</div>
    <div class="dayhead"><h3 class="cap">${esc(fmtDay(sel))}</h3><span class="muted" style="font-size:.88rem">${list.length?list.length+' RDV'+(total?' · '+fmtPrice(total):''):''}</span></div>
    ${list.length?list.map(a=>apptCard(a)).join(''):`<div class="empty"><div class="big">🐾</div>Aucun rendez-vous ce jour.<br><br><button class="btn primary" id="addday">+ Ajouter un rendez-vous</button></div>`}`;
  $('#pick').onchange=e=>{if(e.target.value){sel=e.target.value;render();}};
  const gt=$('#gotoday');if(gt)gt.onclick=()=>{sel=today();render();};
  const ad=$('#addday');if(ad)ad.onclick=()=>openForm({date:sel});
  $('#photo-btn').onclick=()=>openPhotoImport();
  $('#mode').onclick=e=>{const b=e.target.closest('[data-mode]');if(!b)return;mode=b.dataset.mode;try{localStorage.setItem('toilettage.mode',mode);}catch(_){}render();};
  // Glisser pour changer de semaine
  const w=$('#week');let x0=null;
  w.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;},{passive:true});
  w.addEventListener('touchend',e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>50){step(dx<0?1:-1);}});
}

function renderUpcoming(){
  const t=today();
  const list=sortAppts(S.appts.filter(a=>a.date>=t));
  let html='<div class="top"><h1>À venir</h1></div>';
  const lim=addDays(t,+S.settings.remindDays||1);
  const toRemind=list.filter(a=>a.date>t&&a.date<=lim&&a.phone&&!a.done);
  if(toRemind.length){
    html+=`<h2>Rappels SMS à envoyer</h2><div class="card list-pad">${toRemind.map(a=>`<div class="remind${a.reminded?' sent':''}">
      <span style="flex:1;min-width:0"><b>${esc(a.dog||'?')}</b> <span class="muted">· ${esc(a.client)}</span><div class="muted" style="font-size:.85rem">${esc(relDay(a.date))}${a.time?' à '+esc(a.time):''}${a.reminded?' · rappel envoyé ✓':''}</div></span>
      <a class="btn small${a.reminded?'':' primary'}" data-remind="${a.id}" href="${smsHref(a.phone,reminderText(a))}">💬 ${a.reminded?'Renvoyer':'Rappel'}</a></div>`).join('')}</div>`;

async function exportData(){
  const name='toilettage-sauvegarde-'+today()+'.json';
  const used=new Set(S.clients.flatMap(c=>[...(c.dogs||[]).map(d=>d.photo),...(c.scans||[])]).filter(id=>id&&PH[id]));
  const photos={};used.forEach(id=>photos[id]=PH[id]);
  const blob=new Blob([JSON.stringify({app:'toilettage',version:1,exported:new Date().toISOString(),...S,photos})],{type:'application/json'});
  const file=new File([blob],name,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:'Sauvegarde toilettage'});return;}catch(e){if(e.name==='AbortError')return;}
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
}
function importData(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);if(!d||!Array.isArray(d.appts))throw 0;
      const ids=new Set(S.appts.map(a=>a.id));const added=d.appts.filter(a=>a&&a.id&&a.date&&!ids.has(a.id));
      const cids=new Set(S.clients.map(c=>c.id));const cnames=new Set(S.clients.map(c=>norm(c.name)));
      const addedC=(Array.isArray(d.clients)?d.clients:[]).filter(c=>c&&c.id&&c.name&&!cids.has(c.id)&&!cnames.has(norm(c.name)));
      if(!confirm(`Restaurer cette sauvegarde ?\n${added.length} nouveaux rendez-vous et ${addedC.length} nouvelles fiches clients.\nCe qui est déjà présent est conservé.`))return;
      S.appts.push(...added);S.clients.push(...addedC);if(d.photos&&typeof d.photos==='object')for(const[id,v]of Object.entries(d.photos))if(!PH[id]&&typeof v==='string'&&v.startsWith('data:image/'))putPhoto(id,v);if(d.settings&&typeof d.settings==='object')S.settings=Object.assign(S.settings,d.settings);save();toast(added.length+' RDV et '+addedC.length+' fiches ajoutés');render();
    }catch(err){alert('Ce fichier n’est pas une sauvegarde valide.');}
  };
  r.readAsText(f);e.target.value='';
}

/* ---------- Feuille modale ---------- */
function openSheet(title,html,{left='Annuler',right='',onRight=null,onClose=null}={}){
  closeSheet();
  const bg=document.createElement('div');bg.className='sheet-bg';bg.id='sheet';
  bg.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header><button class="linkbtn" id="sh-l">${esc(left)}</button><h3>${esc(title)}</h3><button class="linkbtn right" id="sh-r">${esc(right)}</button></header><div class="content">${html}</div></div>`;
  document.body.appendChild(bg);document.body.style.overflow='hidden';
  const close=()=>{closeSheet();onClose&&onClose();};
  bg.addEventListener('click',e=>{if(e.target===bg)close();});
  $('#sh-l').onclick=close;
  if(onRight)$('#sh-r').onclick=onRight;
  return bg;
}
function closeSheet(){const s=$('#sheet');if(s)s.remove();document.body.style.overflow='';}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});

    <label for="f-details">Détails de la prestation</label>
    <textarea id="f-details" placeholder="ex. Coupe courte sur le corps, garder la tête ronde, sabot 6 mm">${esc(a.details)}</textarea>
    <div class="row">

  // Prestations
  const svcBox=$('#svc');
  svcBox.addEventListener('click',e=>{

    }
    const s=b.dataset.s;if(services.has(s)){services.delete(s);b.classList.remove('on');}else{services.add(s);b.classList.add('on');}

    const v=norm(fClient.value);const box=$('#sug-client');

    const m=dir.filter(c=>(norm(c.name).includes(v)||[...c.dogs.values()].some(d=>norm(d.name).includes(v)))&&c.key!==v).slice(0,5);

  function suggestDogs(){
    const c=currentClient();const box=$('#sug-dog');
    if(!c||!c.dogs.size){box.innerHTML='';return;}
    const v=norm(fDog.value);
    const m=[...c.dogs.values()].filter(d=>norm(d.name)!==v);
    box.innerHTML=m.length?`<div class="chips" style="margin-top:8px">${m.map(d=>`<button type="button" class="chip" data-dog="${esc(d.name)}">🐕 ${esc(d.name)}</button>`).join('')}</div>`:'';
  }
  function pickClient(c){
    fClient.value=c.name;if(c.phone&&!$('#f-phone').value)$('#f-phone').value=c.phone;
    $('#sug-client').innerHTML='';
    if(c.dogs.size===1&&!fDog.value)pickDog([...c.dogs.values()][0]);
    suggestDogs();
  }
  function pickDog(d){
    fDog.value=d.name;if(d.breed&&!$('#f-breed').value)$('#f-breed').value=d.breed;
    // Reprendre la dernière prestation si rien n'est encore saisi
    if(!editing&&d.last&&!services.size&&!$('#f-details').value){
      (d.last.services||[]).forEach(s=>{services.add(s);let b=svcBox.querySelector(`[data-s="${CSS.escape(s)}"]`);
        if(!b){b=document.createElement('button');b.type='button';b.dataset.s=s;b.textContent=s;svcBox.insertBefore(b,$('#svc-add'));}b.classList.add('on');});
      $('#f-details').value=d.last.details||'';
      if(!$('#f-price').value&&d.last.price!=='')$('#f-price').value=d.last.price;
      if(!$('#f-notes').value)$('#f-notes').value=d.last.notes||'';
      if(d.last.duration)$('#f-dur').value=d.last.duration;
      toast('Dernière prestation de '+d.name+' reprise');
    }
    if(d.notes&&!$('#f-notes').value)$('#f-notes').value=d.notes;
    suggestDogs();
  }
  fClient.addEventListener('input',()=>{suggestClients();suggestDogs();});
  fClient.addEventListener('blur',()=>setTimeout(()=>{$('#sug-client')&&($('#sug-client').innerHTML='');const c=currentClient();if(c)pickClient(c);},200));
  $('#sug-client').addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(b)pickClient(dir.find(c=>c.key===b.dataset.k));});
  $('#sug-dog').addEventListener('click',e=>{const b=e.target.closest('[data-dog]');if(!b)return;const c=currentClient();pickDog(c.dogs.get(norm(b.dataset.dog)));});
  fDog.addEventListener('input',suggestDogs);
  fDog.addEventListener('blur',()=>{const c=currentClient();const d=c&&c.dogs.get(norm(fDog.value));if(d&&!$('#f-breed').value&&d.breed)$('#f-breed').value=d.breed;});
  suggestDogs();
  if(!editing&&!a.client)setTimeout(()=>{const ft=$('#f-time');if(!a.time&&ft)ft.focus();},250);

  function submit(){
    const v=id=>$(id).value.trim();
    const rec={id:a.id||uid(),date:v('#f-date'),time:v('#f-time'),duration:+$('#f-dur').value,
      client:v('#f-client'),phone:v('#f-phone'),dog:v('#f-dog'),breed:v('#f-breed'),
      services:[...svcBox.querySelectorAll('[data-s].on')].map(b=>b.dataset.s),
      details:v('#f-details'),price:$('#f-price').value===''?'':+$('#f-price').value,notes:v('#f-notes'),done,
      created:a.created||new Date().toISOString(),updated:new Date().toISOString()};
    const kept=S.appts.find(x=>x.id===rec.id);if(kept&&kept.reminded&&kept.date===rec.date&&kept.time===rec.time)rec.reminded=kept.reminded;
    if(!rec.date){toast('Choisissez une date');return;}
    if(!rec.client&&!rec.dog){toast('Indiquez au moins le client ou le chien');$('#f-client').focus();return;}
    const i=S.appts.findIndex(x=>x.id===rec.id);
    if(i>=0)S.appts[i]=rec;else S.appts.push(rec);
    save();closeSheet();
    if(opts.onSaved){opts.onSaved(rec);return;}
    if(tab==='agenda')sel=rec.date;
    toast(editing?'Rendez-vous modifié':'Rendez-vous ajouté');render();
  }
  $('#f-save').onclick=submit;
  if(editing){
    $('#f-del').onclick=()=>{if(!confirm('Supprimer ce rendez-vous ?'))return;S.appts=S.appts.filter(x=>x.id!==a.id);save();closeSheet();toast('Rendez-vous supprimé');render();};
    const fs=$('#f-sms');if(fs)fs.addEventListener('click',()=>{markReminded(a.id);a.reminded=true;});
    $('#f-again').onclick=()=>{const{id,created,updated,date,time,done:_,reminded:__,...rest}=a;openForm({...rest,date:addDays(a.date,42)});toast('Nouveau RDV pré-rempli (dans 6 semaines)');};
  }
}

    ${!isNew&&opts.nAppts?`<p class="muted" style="font-size:.85rem;margin-top:14px">Un changement de nom ou de téléphone s’applique aussi aux ${opts.nAppts} rendez-vous de ce client.</p>`:''}

  function readDogs(){document.querySelectorAll('[data-dog-i]').forEach(row=>{const i=+row.dataset.dogI;

  function drawDogs(){
    $('#cf-dogs').innerHTML=dogs.map((d,i)=>`<div class="card" data-dog-i="${i}" style="padding:4px 12px 12px;margin-top:8px">
      <div style="display:flex;align-items:center;gap:12px;margin-top:12px">
        <button type="button" class="photo-slot" data-setpic="${i}" aria-label="Photo du chien">${PH[d.photo]||pending[d.photo]?`<img src="${PH[d.photo]||pending[d.photo]}" alt="">`:'📷'}</button>
        <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start"><button type="button" class="btn small" data-setpic="${i}">${d.photo?'Changer la photo':'Ajouter une photo'}</button>
        ${d.photo?`<button type="button" class="btn small danger" data-rmpic="${i}">Retirer la photo</button>`:''}</div>
      </div>
      <div class="row"><div><label>Nom du chien</label><input class="dn" value="${esc(d.name)}" autocapitalize="words"></div>
      <div><label>Race</label><input class="db" value="${esc(d.breed)}" list="cf-breeds" autocapitalize="words"></div></div>
      <label>Remarques sur le chien</label><textarea class="dno" style="min-height:56px" placeholder="Âge, caractère, santé, coupe habituelle…">${esc(d.notes)}</textarea>
      ${dogs.length>1?`<button type="button" class="btn small danger" data-rmdog="${i}" style="margin-top:8px">Retirer ce chien</button>`:''}</div>`).join('');
  }

    const sp=e.target.closest('[data-setpic]'),rp=e.target.closest('[data-rmpic]'),b=e.target.closest('[data-rmdog]');

    if(!b)return;readDogs();dogs.splice(+b.dataset.rmdog,1);drawDogs();};
  const del=$('#cf-del');if(del)del.onclick=()=>{if(!confirm('Supprimer la fiche de '+r.name+' ?'))return;const gone=S.clients.find(x=>x.id===r.id);((gone&&gone.scans)||[]).forEach(delPhoto);S.clients=S.clients.filter(x=>x.id!==r.id);oldPics.forEach(delPhoto);save();closeSheet();render();toast('Fiche supprimée');};
  function submit(){

      if(!opts.onSaved)for(const id of oldPics)if(!used.has(id))delPhoto(id);};

    const k=norm(rec.name);

    if(other){alert('Une fiche « '+other.name+' » existe déjà.');return;}
    const i=S.clients.findIndex(x=>x.id===rec.id);
    if(i>=0)S.clients[i]={...S.clients[i],...rec};else S.clients.push({...rec,created:new Date().toISOString()});
    if(opts.oldKey){S.appts.forEach(a=>{if(norm(a.client)===opts.oldKey){a.client=rec.name;if(rec.phone)a.phone=rec.phone;}});}
    keepPics();save();closeSheet();render();openClient(k);toast(isNew?'Fiche client créée':'Fiche client enregistrée');
  }
  $('#cf-save').onclick=submit;
  if(isNew&&!r.name)setTimeout(()=>{const n=$('#cf-name');if(n)n.focus();},250);
}

/* ---------- Photos des chiens (IndexedDB) ---------- */
const PH={};let phDB=null;
function idb(){return new Promise((res,rej)=>{if(phDB)return res(phDB);if(!window.indexedDB)return rej(new Error('indisponible'));
  const r=indexedDB.open('toilettage-photos',1);r.onupgradeneeded=()=>r.result.createObjectStore('p');r.onsuccess=()=>{phDB=r.result;res(phDB);};r.onerror=()=>rej(r.error);});}
async function loadPhotos(){try{const db=await idb();await new Promise(res=>{const rq=db.transaction('p').objectStore('p').openCursor();
  rq.onsuccess=()=>{const c=rq.result;if(c){PH[c.key]=c.value;c.continue();}else res();};rq.onerror=()=>res();});}catch(e){}}
async function putPhoto(id,data){PH[id]=data;try{const db=await idb();db.transaction('p','readwrite').objectStore('p').put(data,id);}catch(e){toast('Photo non enregistrée : stockage indisponible');}}
async function delPhoto(id){if(!id)return;delete PH[id];try{const db=await idb();db.transaction('p','readwrite').objectStore('p').delete(id);}catch(e){}}
function dogImg(id,size){return id&&PH[id]?`<img class="dogpic" src="${PH[id]}" alt="" style="width:${size}px;height:${size}px">`:'';}
function dogPhotoId(client,dog){const r=S.clients.find(x=>norm(x.name)===norm(client));const d=r&&(r.dogs||[]).find(x=>norm(x.name)===norm(dog));return d?d.photo:'';}
function clientAvatar(c){
  const pics=[...c.dogs.values()].map(d=>d.photo).filter(id=>PH[id]).slice(0,3);
  if(!pics.length)return `<span class="avatar">${esc(c.name[0]?.toUpperCase()||'?')}</span>`;
  return `<span class="pics">${pics.map(id=>dogImg(id,pics.length>1?36:44)).join('')}</span>`;
}
/* Photo carrée recadrée au centre, 480 px */
function dogThumb(file){
  return new Promise((resolve,reject)=>{const url=URL.createObjectURL(file);const img=new Image();
    img.onload=()=>{const side=Math.min(img.naturalWidth,img.naturalHeight);const S2=Math.min(480,side);const c=document.createElement('canvas');c.width=c.height=S2;
      c.getContext('2d').drawImage(img,(img.naturalWidth-side)/2,(img.naturalHeight-side)/2,side,side,0,0,S2,S2);URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',0.8));};
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Image illisible'));};img.src=url;});
}
function pickPhoto(cb){const i=document.createElement('input');i.type='file';i.accept='image/*';i.style.display='none';
  i.onchange=()=>{const f=i.files[0];i.remove();if(f)cb(f);};document.body.appendChild(i);i.click();}
/* Ajoute ou remplace la photo d'un chien depuis la fiche client (crée la fiche si besoin) */
async function setDogPhoto(key,dogName,file){
  let data;try{data=await dogThumb(file);}catch(e){toast('Photo illisible');return;}
  const c=directory().find(x=>x.key===key);if(!c)return;
  let r=S.clients.find(x=>norm(x.name)===key);
  if(!r){r={id:uid(),name:c.name,phone:c.phone,email:'',address:'',notes:'',dogs:[...c.dogs.values()].map(d=>({name:d.name,breed:d.breed,notes:d.notes||'',photo:''})),created:new Date().toISOString()};S.clients.push(r);}
  let d=r.dogs.find(x=>norm(x.name)===norm(dogName));if(!d){d={name:dogName,breed:'',notes:'',photo:''};r.dogs.push(d);}
  const old=d.photo;const id=uid();await putPhoto(id,data);d.photo=id;if(old)delPhoto(old);
  save();render();openClient(key);toast('Photo de '+dogName+' enregistrée');
}
function viewDogPhoto(c,d){
  const html=`<img src="${PH[d.photo]}" alt="${esc(d.name)}" style="width:100%;border-radius:16px;margin-top:14px;display:block">
    <div class="actions"><button class="btn" id="vp-change" style="flex:1">📷 Changer</button><button class="btn danger" id="vp-del" style="flex:1">Retirer</button></div>`;
  openSheet(d.name,html,{left:'Retour',onClose:()=>openClient(c.key)});
  $('#vp-change').onclick=()=>pickPhoto(f=>setDogPhoto(c.key,d.name,f));
  $('#vp-del').onclick=()=>{if(!confirm('Retirer la photo de '+d.name+' ?'))return;
    const r=S.clients.find(x=>norm(x.name)===c.key);const rd=r&&r.dogs.find(x=>norm(x.name)===norm(d.name));
    if(rd){delPhoto(rd.photo);rd.photo='';save();}closeSheet();render();openClient(c.key);};
}

function step(n){sel=mode==='month'?monthShift(sel,n):addDays(sel,7*n);render();}

/* ---------- IA : lecture de photos d'agenda et dictée ---------- */
const KEY_API='toilettage.apikey';
const getKey=()=>{try{return localStorage.getItem(KEY_API)||'';}catch(e){return '';}};
const setKey=k=>{try{k?localStorage.setItem(KEY_API,k):localStorage.removeItem(KEY_API);}catch(e){}};

const APPT_SCHEMA={type:'object',additionalProperties:false,required:['appointments'],properties:{appointments:{type:'array',items:{
  type:'object',additionalProperties:false,
  required:['date','time','duration_min','client','phone','dog','breed','services','details','price','notes','uncertain'],
  properties:{
    date:{type:'string',description:'Date au format AAAA-MM-JJ, chaîne vide si inconnue'},
    time:{type:'string',description:'Heure de début HH:MM sur 24 h, chaîne vide si inconnue'},
    duration_min:{type:'integer',description:'Durée en minutes, 0 si inconnue'},
    client:{type:'string'},phone:{type:'string'},dog:{type:'string'},breed:{type:'string'},
    services:{type:'array',items:{type:'string'}},
    details:{type:'string',description:'Précisions sur la prestation'},

  const dir=directory().slice(0,300).map(c=>`- ${c.name}${c.phone?' ('+c.phone+')':''} : ${[...c.dogs.values()].map(d=>d.name+(d.breed?' ['+d.breed+']':'')).join(', ')}`).join('\n');

Prestations habituelles (utilise ces libellés exacts quand ça correspond) : ${svcList().join(', ')}.
${dir?'Clients déjà connus (corrige l’orthographe d’un nom mal lu s’il correspond clairement à l’un d’eux, et reprends son téléphone) :\n'+dir:''}`;

async function askClaude(content,effort,schema=APPT_SCHEMA){
  const key=getKey();if(!key)throw new Error('Aucune clé API : ajoutez-la dans Réglages.');
  if(!navigator.onLine)throw new Error('Pas de connexion internet.');
  let res;
  try{
    res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{
      'content-type':'application/json','x-api-key':key,'anthropic-version':'2026-10-21',
      'anthropic-beta':'server-side-fallback-2026-07-01',
      'anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-opus-5-5',max_tokens:16000,fallbacks:'default',
        output_config:{effort,format:{type:'json_schema',schema}},
        system:'Tu aides une toiletteuse à saisir ses rendez-vous et ses fiches clients. Tu extrais des informations structurées, sans rien inventer : laisse vide ce qui n’est pas indiqué.',
        messages:[{role:'user',content}]})});
  }catch(e){throw new Error('Impossible de joindre le service (connexion ?).');}
  const data=await res.json().catch(()=>({}));
  if(!res.ok){
    if(res.status===401)throw new Error('Clé API refusée : vérifiez-la dans Réglages.');
    if(res.status===429)throw new Error('Trop de demandes, réessayez dans une minute.');
    if(res.status===400&&/credit/i.test(data?.error?.message||''))throw new Error('Crédit Anthropic épuisé : rechargez le compte sur console.anthropic.com.');
    throw new Error('Erreur du service ('+res.status+') : '+(data?.error?.message||''));
  }
  if(data.stop_reason==='refusal')throw new Error('La demande a été refusée par le service.');
  if(data.stop_reason==='max_tokens')throw new Error('Réponse trop longue : essayez avec moins de pages à la fois.');
  const txt=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
  try{return JSON.parse(txt);}catch(e){throw new Error('Réponse illisible, réessayez.');}
}

/* Convertit une proposition de l'IA (ou du lecteur local) en rendez-vous de l'appli */
function fromAI(x,fallbackDate){
  const ok=s=>/^\d{4}-\d{2}-\d{2}$/.test(s||'');
  const tm=/^\d{1,2}:\d{2}$/.test(x.time||'')?x.time.padStart(5,'0'):'';
  const known=new Map(svcList().map(s=>[norm(s),s]));
  return {date:ok(x.date)?x.date:fallbackDate,time:tm,duration:x.duration_min>0?x.duration_min:60,
    client:(x.client||'').trim(),phone:(x.phone||'').trim(),dog:(x.dog||'').trim(),breed:(x.breed||'').trim(),
    services:[...new Set((x.services||[]).map(s=>known.get(norm(s))||s.trim()).filter(Boolean))],
    details:(x.details||'').trim(),price:(x.price==null||isNaN(x.price))?'':+x.price,notes:(x.notes||'').trim(),
    uncertain:(x.uncertain||'').trim(),dateGuessed:!ok(x.date)};
}

/* Image → JPEG base64 redimensionné (≤1568 px) */
function shrinkImage(file){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file);const img=new Image();
    img.onload=()=>{const max=1568;let w=img.naturalWidth,h=img.naturalHeight;const r=Math.min(1,max/Math.max(w,h));w=Math.round(w*r);h=Math.round(h*r);
      const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg',0.85));};
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Image illisible'));};
    img.src=url;
  });
}

/* ---------- Lecture du texte des photos sur le téléphone (Tesseract, hors ligne) ---------- */
let ocrWorker=null;
function loadScript(src){return new Promise((res,rej)=>{if(window.Tesseract)return res();const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Lecture indisponible (chargement impossible)'));document.head.appendChild(s);});}
async function ocrImage(dataUrl,onStatus){
  if(!ocrWorker){
    onStatus&&onStatus('Préparation de la lecture… (la première fois, environ 4 Mo à télécharger)');
    await loadScript('lib/ocr/tesseract.min.js');
    ocrWorker=await Tesseract.createWorker('fra',1,{workerPath:'lib/ocr/worker.min.js',corePath:'lib/ocr/',langPath:'lib/ocr/',gzip:true});
  }
  const r=await ocrWorker.recognize(dataUrl);
  return (r.data.text||'').replace(/\n{2,}/g,'\n').trim();
}
const MONTHS=['janvier','fevrier','mars','avril','mai','juin','juillet','aout','septembre','octobre','novembre','decembre'];
const WDAYS=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
const HAS_TIME=/\b\d{1,2}\s*(?:h|:)\s*\d{0,2}\b/i;
/* Ligne d'en-tête de jour : « Lundi 16 », « 16 novembre », « 16/11 », « Mardi » */
function headerDate(line,ref,prev){
  const t=norm(line);if(HAS_TIME.test(t)&&!/^\s*(lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche)\b/.test(t))return null;
  const R=parse(ref);
  const near=(y,m,d)=>{let dt=new Date(y,m,d);if(iso(dt)<addDays(ref,-200))dt=new Date(y+1,m,d);return iso(dt);};
  let m=t.match(new RegExp('\\b(\\d{1,2}|1er)\\s*('+MONTHS.join('|')+')(?:\\s+(\\d{4}))?'));
  if(m){const d=m[1]==='1er'?1:+m[1];return m[3]?iso(new Date(+m[3],MONTHS.indexOf(m[2]),d)):near(R.getFullYear(),MONTHS.indexOf(m[2]),d);}
  m=t.match(/\b(\d{1,2})\s*[\/.]\s*(\d{1,2})(?:\s*[\/.]\s*(\d{2,4}))?\b/);
  if(m&&+m[2]>=1&&+m[2]<=12&&!HAS_TIME.test(t)){const y=m[3]?(+m[3]<100?2000+ +m[3]:+m[3]):null;return y?iso(new Date(y,+m[2]-1,+m[1])):near(R.getFullYear(),+m[2]-1,+m[1]);}
  m=t.match(/^\s*(lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche)\b\s*(\d{1,2})?\b/);
  if(m){
    if(m[2]){const d=+m[2];let best=null;for(const k of [-1,0,1]){const dt=new Date(R.getFullYear(),R.getMonth()+k,d);if(dt.getDate()!==d)continue;const x=iso(dt);if(!best||Math.abs(parse(x)-R)<Math.abs(parse(best)-R))best=x;}return best;}
    const target=WDAYS.indexOf(m[1]);
    if(prev){let x=addDays(prev,1);for(let i=0;i<7&&parse(x).getDay()!==target;i++)x=addDays(x,1);return x;}
    const monday=addDays(ref,-((R.getDay()+6)%7));return addDays(monday,(target+6)%7);
  }
  return null;
}
/* Texte d'une page d'agenda → rendez-vous */
function parseAgendaText(text,hint){
  const ref=hint||today();let cur=hint||today();let prev=null;const out=[];let last=null;
  for(const line0 of text.split('\n')){const line=line0.trim();if(!line)continue;
    const hd=headerDate(line,ref,prev);
    if(hd&&!HAS_TIME.test(norm(line).replace(/^\s*\w+\s+\d{1,2}\b/,''))){cur=prev=hd;last=null;
      const rest=line.replace(/^\s*\S+\s+\d{1,2}\b\s*/,'');if(HAS_TIME.test(rest)){last=parseDictation(rest,cur,{agenda:true});out.push(last);}
      continue;}
    if(HAS_TIME.test(line)){last=parseDictation(line,cur,{agenda:true});out.push(last);continue;}
    if(last){// ligne de suite : compléter le rendez-vous précédent
      const more=parseDictation(last.details.replace(/^Noté : /,'')+' '+line,cur,{agenda:true});
      for(const k of ['client','phone','dog','breed'])if(!last[k]&&more[k])last[k]=more[k];
      last.services=[...new Set([...last.services,...more.services])];if(last.price===''&&more.price!=='')last.price=more.price;
      if(!last.notes&&more.notes)last.notes=more.notes;
      last.details=last.details+' / '+line;}
  }
  return out;
}
/* Texte d'une fiche client papier → fiche */
function parseClientText(text){
  const c={name:'',phone:'',email:'',address:'',notes:'',dogs:[],visits:[],uncertain:''};
  const dog={name:'',breed:'',notes:''};const notes=[];const dogNotes=[];
  const lab=(l,re)=>{const m=l.match(new RegExp('^\\s*(?:'+re+')\\s*[:.\\-]?\\s*(.*)$','i'));return m?m[1].trim():null;};
  const breeds=[...new Set([...BREEDS,...S.appts.map(a=>a.breed).filter(Boolean)])].sort((a,b)=>b.length-a.length);
  const known=new Map(svcList().map(x=>[norm(x),x]));
  for(const line0 of text.split('\n')){const l=line0.trim();if(!l||/^fiche\s*(client)?$/i.test(norm(l)))continue;let v;
    const em=l.match(/[\w.+-]+@[\w-]+\.[\w.]+/);if(em&&!c.email){c.email=em[0];if(l.replace(em[0],'').replace(/e-?mail|courriel|:/gi,'').trim().length<3)continue;}
    const ph=l.replace(/[.\-]/g,' ').match(/(?:\+33\s?|0)\s?[1-9](?:\s?\d{2}){4}/);
    const dv=l.match(/^\s*(\d{1,2})\s*[\/.]\s*(\d{1,2})\s*[\/.]?\s*(\d{2,4})?\b(.*)$/);
    if(dv&&!ph){const y=dv[3]?(+dv[3]<100?2000+ +dv[3]:+dv[3]):parse(today()).getFullYear();
      const rest=dv[4]||'';const pd=parseDictation(rest,today(),{agenda:true});
      c.visits.push({date:iso(new Date(y,+dv[2]-1,+dv[1])),dog:'',services:pd.services,details:rest.trim(),price:pd.price===''?null:pd.price});continue;}
    if((v=lab(l,'nom du chien|chien(?:ne)?|animal|nom de l.animal'))!==null){if(v)dog.name=cap(v.split(/[,(]/)[0].trim());continue;}
    if((v=lab(l,'race'))!==null){if(v)dog.breed=cap(v);continue;}
    if((v=lab(l,'caract[eè]re|sant[eé]|allergies?|[aâ]ge|coupe|comportement|poids|n[eé]\\s*le|observations?\\s*chien'))!==null){dogNotes.push(l);continue;}
    if((v=lab(l,'t[eé]l[eé]?(?:phone)?|t[eé]l|portable|mobile|fixe'))!==null||ph){if(ph&&!c.phone)c.phone=ph[0].replace(/\s/g,'').replace(/(\d{2})(?=\d)/g,'$1 ').trim();if(!ph&&v)notes.push(l);continue;}
    if((v=lab(l,'adresse|adr'))!==null){c.address=[c.address,v].filter(Boolean).join(', ');continue;}
    if(/\b\d{5}\b/.test(l)||/\b(rue|avenue|av\.?|bd|boulevard|chemin|all[ée]e|impasse|place|route|lotissement|r[ée]sidence|quai)\b/i.test(l)){c.address=[c.address,l].filter(Boolean).join(', ');continue;}
    if((v=lab(l,'nom(?:\\s*du\\s*propri[eé]taire)?|propri[eé]taire|client(?:e)?|ma[iî]tre'))!==null){if(v)c.name=v;continue;}
    if(!c.name&&/^\s*(mme|m\.|mr|madame|monsieur|mlle)\b/i.test(l)){c.name=l;continue;}
    if((v=lab(l,'remarques?|notes?|observations?|infos?'))!==null){if(v)notes.push(v);continue;}
    const br=breeds.find(b=>norm(l).includes(norm(b)));if(br&&!dog.breed){dog.breed=br;const rest=l.replace(new RegExp(br,'i'),'').replace(/[:,\-]/g,' ').trim();if(rest&&!dog.name&&/^[A-ZÀ-Ý][\wà-ÿ'-]+$/.test(rest))dog.name=rest;continue;}
    if(!c.name&&/^[A-ZÀ-Ý][\wà-ÿ'-]+(\s+[A-ZÀ-Ý][\wà-ÿ'-]+)?$/.test(l)){c.name=l;continue;}
    notes.push(l);
  }
  c.name=c.name.replace(/\s+/g,' ').trim();
  const tt={madame:'Mme',mme:'Mme',mademoiselle:'Mlle',mlle:'Mlle',monsieur:'M.',mr:'M.','m.':'M.'};
  c.name=c.name.replace(/^(madame|mme|mademoiselle|mlle|monsieur|mr|m\.)\s*/i,(m,a)=>(tt[a.toLowerCase()]||a)+' ');
  dog.notes=dogNotes.join('\n');
  if(dog.name||dog.breed||dog.notes)c.dogs.push(dog);
  for(const v of c.visits){if(c.dogs.length===1)v.dog=c.dogs[0].name;v.services=v.services.map(x=>known.get(norm(x))||x);}
  c.notes=notes.join('\n');
  if(!c.name)c.uncertain='nom du client non trouvé';
  return c;
}

/* Écran « texte lu » : à corriger avant analyse (photo lue sur le téléphone, ou texte collé) */
function openTextImport(kind,{text='',hint='',scans=[]}={}){
  const isCl=kind==='clients';
  const html=`
    <p style="margin-top:14px">${text?'Voici le texte lu sur la photo. Corrigez ce qui est mal lu, puis touchez « Analyser ».':'Collez ici le texte de '+(isCl?'la fiche':'la page d’agenda')+'.'}</p>
    ${text?'':`<p class="muted" style="font-size:.85rem;margin-top:6px">Astuce : sur iPhone, ouvrez la photo dans Photos et touchez l’icône « Texte en direct » pour copier le texte. Sur Android, utilisez Google Lens (« Texte » puis « Copier »).</p>`}
    <p class="muted" style="font-size:.85rem;margin-top:6px">${isCl?'Une information par ligne aide beaucoup (ex. « Tél : … », « Chien : … », « Race : … »). Séparez plusieurs fiches par une ligne -----.':'Une ligne par jour (« Lundi 16 ») puis une ligne par rendez-vous commençant par l’heure (« 9h30 Mme Martin Filou bain 45 € »).'}</p>
    <textarea id="ti-text" style="min-height:240px;font-size:15px;margin-top:10px">${esc(text)}</textarea>
    ${isCl?'':`<label for="ti-date">Date de la page ou de la semaine (si elle n’est pas écrite)</label><input type="date" id="ti-date" value="${esc(hint)}">`}
    <div class="actions"><button class="btn primary" id="ti-go" style="flex:1">Analyser</button></div>`;
  openSheet(isCl?'Fiche papier : texte':'Agenda : texte',html,{onClose:()=>{scans.forEach(id=>delete SCANP[id]);}});
  if(!text)setTimeout(()=>{const x=$('#ti-text');if(x)x.focus();},250);
  $('#ti-go').onclick=()=>{
    const tx=$('#ti-text').value.trim();if(!tx){toast('Aucun texte');return;}
    if(isCl){
      const parts=tx.split(/^\s*-{3,}.*$/m).map(x=>x.trim()).filter(Boolean);
      const list=parts.map((p,i)=>({...parseClientText(p),scans:parts.length===scans.length?[scans[i]]:(i===0?scans:[])}));
      openClientReview(mergeClients(list));
    }else{
      const h=$('#ti-date').value;const list=parseAgendaText(tx,h);
      if(!list.length){alert('Aucun rendez-vous trouvé : vérifiez que chaque rendez-vous commence par une heure (ex. 9h30).');return;}
      openReview(list,'Agenda papier');
    }
  };
}
function mergeClients(found){
  const merged=[];
  for(const c of found){const m=merged.find(x=>norm(x.name)&&norm(x.name)===norm(c.name));
    if(m){m.phone=m.phone||c.phone;m.email=m.email||c.email;m.address=m.address||c.address;m.notes=[m.notes,c.notes].filter(Boolean).join('\n');
      for(const d of c.dogs)if(!m.dogs.some(x=>norm(x.name)===norm(d.name)))m.dogs.push(d);m.visits.push(...c.visits);m.scans=[...(m.scans||[]),...(c.scans||[])];m.uncertain=[m.uncertain,c.uncertain].filter(Boolean).join(' ; ');}
    else merged.push(c);}
  return merged;
}

async function addScan(key,file){
  let data;try{data=await shrinkImage(file);}catch(e){toast('Photo illisible');return;}
  const c=directory().find(x=>x.key===key);if(!c)return;
  let r=S.clients.find(x=>norm(x.name)===key);
  if(!r){r={id:uid(),name:c.name,phone:c.phone,email:'',address:'',notes:'',dogs:[...c.dogs.values()].map(d=>({name:d.name,breed:d.breed,notes:d.notes||'',photo:d.photo||''})),created:new Date().toISOString()};S.clients.push(r);}
  const id=uid();await putPhoto(id,data);r.scans=[...(r.scans||[]),id];save();render();openClient(key);toast('Photo de la fiche ajoutée');
}

/* Écran de vérification avant import */
let reviewItems=[],reviewTitle='';
function openReview(items,title){
  if(items){reviewItems=items.map(x=>({...x,_id:uid(),_on:true,_saved:false}));reviewTitle=title;
    for(const r of reviewItems){if(S.appts.some(a=>a.date===r.date&&a.time===r.time&&norm(a.dog)===norm(r.dog)&&norm(a.client)===norm(r.client))){r._on=false;r._dup=true;}}}
  const left=reviewItems.filter(r=>!r._saved);
  if(!left.length){closeSheet();render();toast('Import terminé');return;}
  const html=`
    <p class="muted" style="font-size:.9rem;margin-top:12px">${left.length} rendez-vous trouvés. Vérifiez-les : touchez « Corriger » pour modifier, décochez ceux à ne pas ajouter.</p>
    ${left.map(r=>`<div class="card" style="padding:12px 14px;margin-top:10px;display:flex;gap:12px;align-items:flex-start">
      <input type="checkbox" data-rv="${r._id}" ${r._on?'checked':''} style="width:22px;height:22px;flex:none;margin-top:2px" aria-label="Ajouter ce rendez-vous">
      <div style="flex:1;min-width:0">
        <div class="cap" style="font-weight:600">${esc(fmtDay(r.date))}${r.time?' · '+esc(r.time):''}${r.dateGuessed?' <span class="muted" style="font-weight:400">(date à vérifier)</span>':''}</div>
        <div><b>${esc(r.dog||'Chien ?')}</b>${r.breed?' <span class="muted">· '+esc(r.breed)+'</span>':''} — ${esc(r.client||'Client ?')}${r.phone?' <span class="muted">· '+esc(r.phone)+'</span>':''}</div>
        ${r.services.length?`<div class="chips">${r.services.map(s=>`<span class="chip">${esc(s)}</span>`).join('')}</div>`:''}
        ${r.details?`<div class="note">${esc(r.details)}</div>`:''}${r.notes?`<div class="note warn">${esc(r.notes)}</div>`:''}
        ${r.price!==''?`<div class="price" style="margin-top:4px">${fmtPrice(r.price)}</div>`:''}
        ${r._dup?'<div class="muted" style="font-size:.82rem;margin-top:4px">Déjà présent dans l’agenda</div>':''}
        ${r.uncertain?`<div style="font-size:.82rem;margin-top:4px;color:var(--bad)">À vérifier : ${esc(r.uncertain)}</div>`:''}
        <button class="btn small" data-rvedit="${r._id}" style="margin-top:8px">✎ Corriger</button>
      </div></div>`).join('')}
    <div class="actions"><button class="btn primary" id="rv-go" style="flex:1"></button></div>`;
  openSheet(reviewTitle,html,{left:'Annuler',onClose:()=>{reviewItems=[];}});
  const upd=()=>{const n=reviewItems.filter(r=>!r._saved&&r._on).length;$('#rv-go').textContent=n?`Ajouter ${n} rendez-vous`:'Rien à ajouter';$('#rv-go').disabled=!n;};
  document.querySelectorAll('[data-rv]').forEach(c=>c.onchange=()=>{reviewItems.find(r=>r._id===c.dataset.rv)._on=c.checked;upd();});
  document.querySelectorAll('[data-rvedit]').forEach(b=>b.onclick=()=>{
    const r=reviewItems.find(x=>x._id===b.dataset.rvedit);
    const{_id,_on,_saved,_dup,uncertain,dateGuessed,...init}=r;
    openForm(init,{fromImport:true,banner:uncertain?'À vérifier : '+uncertain:'',
      onSaved:()=>{r._saved=true;openReview();toast('Rendez-vous ajouté');},onCancel:()=>openReview()});
  });
  $('#rv-go').onclick=()=>{
    const now=new Date().toISOString();let n=0;
    for(const r of reviewItems){if(r._saved||!r._on)continue;
      const{_id,_on,_saved,_dup,uncertain,dateGuessed,...rec}=r;
      S.appts.push({...rec,id:uid(),done:false,created:now,updated:now});n++;}
    save();reviewItems=[];closeSheet();
    render();toast(n+' rendez-vous ajoutés');
  };
  upd();
}

/* ---------- Dictée vocale ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let recog=null;
function openVoice(date){
  const html=`
    <p style="margin-top:14px">Touchez le micro et parlez naturellement, par exemple :</p>
    <p class="muted" style="font-size:.9rem;font-style:italic;margin-top:6px">« Demain à 14 h 30, madame Martin, 06 12 34 56 78, son caniche Filou, bain et coupe ciseaux, tête bien ronde, 45 euros. Remarque : a peur du séchoir. »</p>
    <div style="text-align:center;margin:18px 0 8px">
      <button id="mic" aria-label="Démarrer la dictée" style="width:92px;height:92px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:2.4rem;display:inline-grid;place-items:center;box-shadow:0 6px 18px rgba(192,96,63,.35)">🎤</button>
      <div id="mic-state" class="muted" style="margin-top:8px;font-size:.9rem">${SR?'Touchez pour parler':'Dictée intégrée indisponible ici : touchez la zone de texte puis le micro 🎤 du clavier.'}</div>
    </div>
    <label for="v-text">Texte dicté (modifiable)</label>
    <textarea id="v-text" style="min-height:120px" placeholder="Le texte apparaît ici…"></textarea>
    <div class="actions"><button class="btn primary" id="v-go" style="flex:1">Remplir la fiche</button></div>
    <p class="muted" style="font-size:.82rem;margin-top:8px">${getKey()?'Le texte sera compris par l’IA (Claude). Vous pourrez tout vérifier avant d’enregistrer.':'Sans clé API, l’application reconnaît les éléments simples (date, heure, prix, prestations, clients déjà connus). Vous pourrez tout vérifier avant d’enregistrer.'} Plusieurs rendez-vous peuvent être dictés à la suite.</p>`;
  openSheet('Dictée vocale',html,{onClose:stopRecog});
  const mic=$('#mic'),stateEl=$('#mic-state'),ta=$('#v-text');
  if(!SR)mic.onclick=()=>ta.focus();
  else mic.onclick=()=>{
    if(recog){stopRecog();return;}
    recog=new SR();recog.lang='fr-FR';recog.continuous=true;recog.interimResults=true;
    const base=ta.value?ta.value.trim()+' ':'';
    recog.onresult=e=>{let fin='',tmp='';for(let i=0;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)fin+=r[0].transcript+' ';else tmp+=r[0].transcript;}ta.value=(base+fin+tmp).replace(/\s+/g,' ');};
    recog.onerror=e=>{stateEl.textContent=e.error==='not-allowed'||e.error==='service-not-allowed'?'Micro refusé : autorisez-le dans les réglages du téléphone, ou utilisez le micro du clavier.':'Erreur de dictée ('+e.error+')';};
    recog.onend=()=>{recog=null;if($('#mic')){$('#mic').textContent='🎤';$('#mic').style.background='var(--accent)';if(!/Erreur|refusé/.test(stateEl.textContent))stateEl.textContent='Touchez pour reprendre';}};
    try{recog.start();mic.textContent='■';mic.style.background='var(--bad)';stateEl.textContent='J’écoute… touchez ■ pour terminer';}catch(err){recog=null;stateEl.textContent='Impossible de démarrer la dictée.';}
  };
  $('#v-go').onclick=async()=>{
    stopRecog();const text=ta.value.trim();if(!text){toast('Dictez ou écrivez d’abord');return;}
    let items;
    if(getKey()){
      const b=$('#v-go');b.disabled=true;b.textContent='Analyse en cours…';
      try{items=(await askClaude([{type:'text',text:aiContext()+`\nDate par défaut si aucune date n’est dite : ${date} (${fmtDay(date)}).\nVoici une dictée vocale (la transcription peut contenir des erreurs, des chiffres écrits en lettres, des mots mal reconnus) décrivant un ou plusieurs rendez-vous. Extrais-les.\n\nDictée : « ${text} »`}],'medium')).appointments.map(x=>fromAI(x,date));}
      catch(err){toast('IA indisponible : lecture simple utilisée');items=[parseDictation(text,date)];}
    }else items=[parseDictation(text,date)];
    items=items.filter(x=>x.client||x.dog||x.time||x.services.length);
    if(!items.length)items=[parseDictation(text,date)];
    if(items.length===1){const{uncertain,dateGuessed,...init}=items[0];closeSheet();openForm(init,{fromImport:true,banner:'Fiche remplie à partir de la dictée : vérifiez puis enregistrez.'+(uncertain?' À vérifier : '+uncertain:'')});}
    else openReview(items,'Dictée');
  };
}
function stopRecog(){if(recog){try{recog.stop();}catch(e){}recog=null;}}

/* Lecture simple (sans IA) d'une phrase dictée en français */
const NUMS={un:1,une:1,deux:2,trois:3,quatre:4,cinq:5,six:6,sept:7,huit:8,neuf:9,dix:10,onze:11,douze:12,treize:13,quatorze:14,quinze:15,seize:16,'dix-sept':17,'dix-huit':18,'dix-neuf':19,vingt:20,trente:30,quarante:40,cinquante:50,soixante:60};
const SYN={'griffe':'Coupe des griffes','ongle':'Coupe des griffes','tondre':'Tonte','tonte':'Tonte','tondu':'Tonte','shampo':'Bain','lavage':'Bain','laver':'Bain','bain':'Bain','ciseau':'Coupe ciseaux','coupe':'Coupe ciseaux','epil':'Épilation','trimming':'Épilation','demel':'Démêlage','noeud':'Démêlage','brush':'Brushing','sech':'Séchage','oreille':'Oreilles','yeux':'Yeux','puce':'Anti-puces','dent':'Dents'};
function parseDictation(text,defDate,opt={}){
  const raw=text.trim();
  let t=' '+norm(raw).replace(/[’']/g,"'")+' ';
  for(const[w,n]of Object.entries(NUMS).sort((x,y)=>y[0].length-x[0].length))t=t.replace(new RegExp('\\b'+w+'\\b','g'),String(n));
  const out={date:defDate,time:'',duration_min:0,client:'',phone:'',dog:'',breed:'',services:[],details:'',price:null,notes:'',uncertain:''};
  const T=today();
  // Date
  if(opt.agenda){}
  else if(/apres[- ]demain/.test(t))out.date=addDays(T,2);
  else if(/\bdemain\b/.test(t))out.date=addDays(T,1);
  else if(/aujourd'?hui|ce matin|cet apres-midi|ce soir/.test(t))out.date=T;
  else{
    const days=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
    const months=['janvier','fevrier','mars','avril','mai','juin','juillet','aout','septembre','octobre','novembre','decembre'];
    const m=t.match(new RegExp('\\b(\\d{1,2}|1er|premier)\\s+('+months.join('|')+')(?:\\s+(\\d{4}))?'));
    const m2=t.match(/\ble\s+(\d{1,2})\s*\/\s*(\d{1,2})(?:\s*\/\s*(\d{2,4}))?/);
    if(m){const d=/^(1er|premier)$/.test(m[1])?1:+m[1];const mo=months.indexOf(m[2]);let y=m[3]?+m[3]:parse(T).getFullYear();let dt=new Date(y,mo,d);if(!m[3]&&iso(dt)<addDays(T,-60))dt=new Date(y+1,mo,d);out.date=iso(dt);}
    else if(m2){let y=m2[3]?(+m2[3]<100?2000+ +m2[3]:+m2[3]):parse(T).getFullYear();out.date=iso(new Date(y,+m2[2]-1,+m2[1]));}
    else{const dm=t.match(new RegExp('\\b('+days.join('|')+')\\b'));
      if(dm){const target=days.indexOf(dm[1]);const cur=parse(T).getDay();let diff=(target-cur+7)%7;if(diff===0&&!/\bce\s/.test(t))diff=7;if(/prochain|suivant/.test(t))diff=diff||7;out.date=addDays(T,diff);}
      else{const dd=t.match(/\ble\s+(\d{1,2})\b(?!\s*(?:h|heure|euro|€|min))/);if(dd){const d=+dd[1];const x=parse(T);let dt=new Date(x.getFullYear(),x.getMonth(),d);if(iso(dt)<T)dt=new Date(x.getFullYear(),x.getMonth()+1,d);out.date=iso(dt);}}}
  }
  // Durée
  const du=t.match(/(?:duree|pendant|prevoir)\s*(?:de\s*)?(\d{1,2})\s*(?:h|heures?)\s*(\d{2}|et demie?)?|(?:duree|pendant|prevoir)\s*(?:de\s*)?(\d{2,3})\s*min/);
  if(du){t=t.replace(du[0],' ');out.duration_min=du[3]?+du[3]:(+du[1]*60+(/demi/.test(du[2]||'')?30:+(du[2]||0)));}
  // Heure
  const h=t.match(/\b(\d{1,2})\s*(?:heures?|h|:)\s*(\d{2}|et quart|et demie?|moins le quart)?/);
  if(h&&+h[1]<24){let H=+h[1],M=0;const x=h[2]||'';if(/^\d+$/.test(x))M=+x;else if(/quart/.test(x)&&/moins/.test(x)){H-=1;M=45;}else if(/quart/.test(x))M=15;else if(/demi/.test(x))M=30;
    if(H<8&&!/matin/.test(t))H+=12;out.time=pad(H)+':'+pad(M);}
  else if(/\bmidi\b/.test(t))out.time='12:00';
  // Prix
  const pr=t.match(/(\d+(?:[.,]\d{1,2})?)\s*(?:€|euros?)/);if(pr)out.price=+pr[1].replace(',','.');
  // Téléphone
  const ph=raw.replace(/[.\-]/g,' ').match(/(?:\+33\s?|0)\s?[1-9](?:\s?\d{2}){4}/);if(ph)out.phone=ph[0].replace(/\s/g,'').replace(/(\d{2})(?=\d)/g,'$1 ').trim();
  // Clients et chiens connus
  const dir=directory();
  for(const c of dir){for(const d of c.dogs.values()){if(d.name&&new RegExp('\\b'+norm(d.name).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b').test(t)){out.dog=d.name;if(!out.breed)out.breed=d.breed;if(!out.client){out.client=c.name;if(!out.phone)out.phone=c.phone;}}}}
  for(const c of dir){const n=norm(c.name).replace(/^(mme|mr|m\.|madame|monsieur)\s+/,'');if(n.length>2&&t.includes(' '+n)){out.client=c.name;if(!out.phone)out.phone=c.phone;}}
  if(!out.client){const cm=raw.match(opt.agenda?/\b(madame|monsieur|mademoiselle|mme|m\.|mr)\s+([A-Za-zÀ-ÿ'-]+)/i:/\b(madame|monsieur|mademoiselle|mme|m\.|mr)\s+([A-Za-zÀ-ÿ'-]+(?:\s+[A-ZÀ-Ý][A-Za-zÀ-ÿ'-]+)?)/i);
    if(cm){const tt={madame:'Mme',mme:'Mme',mademoiselle:'Mlle',monsieur:'M.','m.':'M.',mr:'M.'}[cm[1].toLowerCase()]||cm[1];out.client=tt+' '+cap(cm[2]);}
    else{const cc=raw.match(/\bclient(?:e)?\s*:?\s+([A-Za-zÀ-ÿ'-]+(?:\s+[A-Za-zÀ-ÿ'-]+)?)/i);if(cc)out.client=cap(cc[1]);}}
  if(!out.dog){const dm=raw.match(/\b(?:chien(?:ne)?|toutou|chiot|il s'appelle|elle s'appelle|nommée?)\s+(?:s'appelle\s+)?([A-Za-zÀ-ÿ'-]+)/i);
    if(dm&&!/^(de|du|la|le|est|a|qui)$/i.test(dm[1]))out.dog=cap(dm[1]);}
  if(!out.dog&&opt.agenda){
    // Agenda : le premier mot en majuscule qui n'est ni le client, ni une race, ni une prestation est le chien
    const skip=new Set([...norm(out.client).split(/\s+/),'mme','mr','m','madame','monsieur','mlle','tel','rdv']);
    const bad=w=>skip.has(norm(w))||BREEDS.some(b=>norm(b).split(' ').includes(norm(w)))||svcList().some(x=>norm(x).split(' ').includes(norm(w)))||Object.keys(SYN).some(k=>norm(w).startsWith(k));
    const words=raw.replace(/\b\d{1,2}\s*(?:h|:)\s*\d{0,2}\b/gi,' ').match(/[A-ZÀ-Ý][a-zà-ÿ'-]{1,}/g)||[];
    const w=words.find(x=>!bad(x));if(w)out.dog=w;}
  // Race
  const breeds=[...new Set([...BREEDS,...S.appts.map(a=>a.breed).filter(Boolean)])].sort((a,b)=>b.length-a.length);
  for(const b of breeds){if(t.includes(' '+norm(b))){out.breed=b;break;}}
  if(!out.breed){const AL={golden:'Golden retriever',labra:'Labrador',york:'Yorkshire',jack:'Jack Russell',cavalier:'Cavalier King Charles',bouledogue:'Bouledogue français',bouldog:'Bouledogue français',bichon:'Bichon',shih:'Shih Tzu',lhassa:'Lhassa Apso',spitz:'Spitz nain',chihua:'Chihuahua',westie:'Westie',caniche:'Caniche',cocker:'Cocker',husky:'Husky',teckel:'Teckel',border:'Border collie','berger australien':'Berger australien','berger allemand':'Berger allemand',aussie:'Berger australien',malinois:'Malinois',croise:'Croisé'};
    for(const[k,v]of Object.entries(AL))if(t.includes(' '+k)){out.breed=v;break;}}
  // Prestations
  const svcs=new Set();
  for(const s of svcList())if(t.includes(norm(s)))svcs.add(s);
  for(const[k,v]of Object.entries(SYN))if(t.includes(k)&&svcList().includes(v)&&!(v==='Coupe ciseaux'&&/griffe|ongle/.test(t)&&!/coupe\s+(au\s+)?ciseau|coupe\s+(de\s+)?poil|coupe\s+et/.test(t)))svcs.add(v);
  out.services=[...svcs];
  // Remarques / détails
  const rm=raw.match(/\b(?:remarques?|attention|à noter|note)\s*:?\s*(.+)$/i);
  if(rm){out.notes=rm[1].trim();}
  const dt=raw.match(/\b(?:détails?|précisions?)\s*:?\s*(.+?)(?=\b(?:remarques?|attention|à noter)\b|$)/i);
  if(dt)out.details=dt[1].trim().replace(/[.,;]$/,'');
  else out.details=(opt.agenda?'Noté : ':'Dictée : ')+(rm?raw.slice(0,rm.index).trim():raw);
  out.uncertain='';
  return fromAI(out,defDate);
}
function cap(s){return String(s).replace(/(^|[\s-])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase());}

/* ---------- Événements globaux ---------- */
document.addEventListener('click',e=>{
  const ap=e.target.closest('[data-id]');
  if(ap){const a=S.appts.find(x=>x.id===ap.dataset.id);if(a)openForm(a);return;}
  const day=e.target.closest('[data-day]');if(day){sel=day.dataset.day;render();return;}
  const nav=e.target.closest('[data-nav]');if(nav){step(+nav.dataset.nav);return;}
  const rm=e.target.closest('[data-remind]');if(rm){markReminded(rm.dataset.remind);setTimeout(render,600);return;}
  const cl=e.target.closest('[data-client]');if(cl){openClient(cl.dataset.client);return;}
  const tb=e.target.closest('[data-tab]');if(tb){tab=tb.dataset.tab;closeSheet();render();window.scrollTo(0,0);}
});
$('#fab').onclick=()=>openForm({date:tab==='agenda'?sel:today()});

render();
loadPhotos().then(()=>{if(Object.keys(PH).length)render();});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
