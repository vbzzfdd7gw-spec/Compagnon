<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Agenda Toilettage</title>
<meta name="description" content="Agenda de toilettage : rendez-vous, clients, chiens, prestations et remarques, hors connexion.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Toilettage">
<meta name="theme-color" content="#f4f8fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f151b" media="(prefers-color-scheme: dark)">
<style>
:root{
  --bg:#f4f8fb;--panel:#fff;--panel2:#eaf1f7;--line:#d9e3ec;--fg:#1d2733;--muted:#637282;
  --accent:#5ab4ea;--accent-text:#1a72ad;--accent-soft:#dcf0fc;--accent-ink:#0b2b44;--good:#3d8a5c;--bad:#c4473d;
  --shadow:0 1px 2px rgba(20,45,70,.05),0 4px 14px rgba(20,45,70,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f151b;--panel:#17202a;--panel2:#202b37;--line:#2c3a48;--fg:#e8eef4;--muted:#93a3b3;
  --accent:#7cc6f2;--accent-text:#8fd0f6;--accent-soft:#16364d;--accent-ink:#08243a;--good:#6cc48f;--bad:#ec7b70;
  --shadow:none;color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f151b;--panel:#17202a;--panel2:#202b37;--line:#2c3a48;--fg:#e8eef4;--muted:#93a3b3;
  --accent:#7cc6f2;--accent-text:#8fd0f6;--accent-soft:#16364d;--accent-ink:#08243a;--good:#6cc48f;--bad:#ec7b70;
  --shadow:none;color-scheme:dark;
}
*{box-sizing:border-box}
html{font-size:16px}
html.fs-1{font-size:18px}
html.fs-2{font-size:20px}
/* Onglets : taille fixe pour qu'ils tiennent toujours sur une ligne */
html.fs-1 .tab,html.fs-2 .tab{font-size:11px}
@media (max-width:360px){html.fs-1 .tab,html.fs-2 .tab{font-size:9px}}
/* Grands textes sur écran étroit : les champs côte à côte passent l'un sous l'autre */
@media (max-width:400px){html.fs-2 .row{flex-direction:column;gap:0}}
@media (max-width:340px){html.fs-1 .row{flex-direction:column;gap:0}}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
.wrap{max-width:620px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right)) calc(100px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left))}
h1{font-size:1.4rem;margin:0;letter-spacing:-.01em}
h2{font-size:.78rem;margin:18px 0 8px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;font-size:max(16px,1rem);color:var(--fg);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
input,select{min-height:2.9em}
/* iPhone (Safari) : les champs date et heure gardent sinon leur propre largeur et débordent sur le champ voisin */
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;display:block;width:100%;min-width:0;max-width:100%;text-align:left;line-height:1.4}
input[type=date]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value{text-align:left;margin:0;min-height:1.4em}
input[type=date]::-webkit-calendar-picker-indicator,input[type=time]::-webkit-calendar-picker-indicator{margin:0}
textarea{resize:vertical;min-height:72px}
label{display:block;font-size:.85rem;color:var(--muted);margin:12px 0 4px}
.muted{color:var(--muted)}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.btn{color:inherit;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;padding:9px 16px;font-weight:600;font-size:.92rem;background:var(--panel2);border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{color:var(--bad)}
.btn.small{padding:6px 12px;font-size:.85rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
/* Semaine */
.monthbar{display:flex;align-items:center;gap:6px}
.iconbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:1.2rem;background:var(--panel);border:1px solid var(--line)}
.monthlabel{font-weight:700;font-size:1.05rem;text-transform:capitalize;position:relative}
.monthlabel input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:6px 0 4px;touch-action:pan-y}
.day{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;border-radius:14px;font-size:.75rem;color:var(--muted)}
.day b{font-size:1.1rem;color:var(--fg);font-weight:600}
.day .dots{height:6px;display:flex;gap:2px}
.day .dots i{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.day.today b{color:var(--accent-text)}
.day.sel{background:var(--accent);color:var(--accent-ink)}
.day.sel b{color:var(--accent-ink)}
.day.sel .dots i{background:var(--accent-ink)}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 8px}
.dayhead h3{margin:0;font-size:1rem}
.cap::first-letter{text-transform:uppercase}
/* Rendez-vous */
.appt{display:flex;gap:12px;padding:12px 14px;margin-bottom:10px;width:100%}
.appt .time{min-width:52px;font-weight:700;font-variant-numeric:tabular-nums}
.appt .time small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
.appt .body{flex:1;min-width:0;border-left:3px solid var(--accent);padding-left:12px}
.appt.done .body{border-left-color:var(--good)}
.appt.done>*{opacity:.72}
.appt .dog{font-weight:700;font-size:1.05rem}
.appt .client{color:var(--muted);font-size:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{font-size:.78rem;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--fg)}
.note{margin-top:6px;font-size:.88rem;color:var(--muted);white-space:pre-wrap;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.note.warn::before{content:"⚠ ";}
.price{font-weight:600;white-space:nowrap}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty .big{font-size:2.4rem;margin-bottom:6px}
/* Clients */
.search{position:relative;margin-bottom:12px}
.client-row{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;border-bottom:1px solid var(--line)}
.client-row:last-child{border-bottom:0}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;font-weight:700;color:var(--accent-text);flex:none}
.client-row .name{font-weight:600}
.client-row .sub{font-size:.85rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist{padding:10px 14px;border-bottom:1px solid var(--line);width:100%;display:block}
.hist:last-child{border-bottom:0}
.hist .h1{display:flex;justify-content:space-between;gap:8px;font-weight:600}
/* Barre d'onglets */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:10}
.tabs .in{display:flex;width:100%;max-width:620px;align-items:center}
.tab{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;white-space:nowrap;color:var(--muted);padding:4px 0;text-align:center}
.tab svg{width:23px;height:23px}
@media (max-width:360px){.tab{font-size:9px;letter-spacing:-.2px}.tab svg{width:21px;height:21px}.fab{width:50px;height:50px;margin:-22px 2px 0;font-size:1.8rem}}
.tab.on{color:var(--accent-text);font-weight:600}
.fab{width:58px;height:58px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:2rem;font-weight:300;margin:-26px 4px 0;box-shadow:0 6px 18px rgba(58,150,214,.35);flex:none;line-height:1}
/* Feuille modale */
.sheet-bg{position:fixed;inset:0;background:rgba(20,10,5,.4);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--bg);width:100%;max-width:620px;max-height:94vh;max-height:94dvh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:up .2s ease-out}
.sheet header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet header h3{margin:0;font-size:1.05rem;flex:1;text-align:center}
.sheet .content{overflow-y:auto;padding:4px 16px calc(24px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
.linkbtn{color:var(--accent-text);font-weight:600;padding:4px 2px;min-width:70px}
.linkbtn.right{text-align:right}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
.svc{display:flex;flex-wrap:wrap;gap:7px}
.svc button{padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:.9rem}
.svc button.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{flex:1;text-align:center;padding:8px 4px;border-radius:9px;font-size:.88rem}
.seg button.on{background:var(--panel);box-shadow:var(--shadow);font-weight:600}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.suggest{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-top:4px;overflow:hidden}
.suggest button{display:block;width:100%;padding:10px 12px;border-bottom:1px solid var(--line)}
.suggest button:last-child{border-bottom:0}
.suggest small{color:var(--muted)}
.upd-bar{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 8px);z-index:40;display:flex;align-items:center;gap:10px;background:var(--fg);color:var(--bg);padding:8px 8px 8px 14px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.25);font-size:.9rem;width:min(520px,calc(100vw - 24px));animation:fade .2s}
.upd-bar span{flex:1;min-width:0}
.upd-bar button{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:6px 12px;font-weight:600;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.9rem;z-index:30;animation:fade .2s;max-width:90vw;text-align:center}
.stat{display:flex;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
.stat:last-child{border-bottom:0}
.list-pad{padding:4px 0}
.hidden{display:none!important}
input[type=checkbox]{accent-color:var(--accent-text)}
.swipe{position:relative;margin-bottom:10px;border-radius:16px;overflow:hidden}
.swipe .del{visibility:hidden;position:absolute;inset:0;background:#c4473d;border-radius:16px;display:flex;justify-content:flex-end;align-items:stretch}
.swipe.active .del{visibility:visible}
.swipe .del button{width:104px;color:#fff;font-weight:600;font-size:.9rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.swipe .del button span{font-size:1.3rem}
.swipe .appt,.swipe .client-row{margin-bottom:0;position:relative;transition:transform .22s ease;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.swipe .appt.dragging,.swipe .client-row.dragging{transition:none}
.swipe.row-sw{margin:0;border-radius:0}
.swipe.row-sw .del{border-radius:0}
.swipe.row-sw .client-row,.swipe.row-sw .sale-row{background:var(--panel);border-bottom:0}
.swipe .sale-row{position:relative;transition:transform .22s ease;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.swipe .sale-row.dragging{transition:none}
.swipe.row-sw:not(:last-child){border-bottom:1px solid var(--line)}
.swipe-hint{font-size:.8rem;color:var(--muted);margin:-4px 0 6px}
.presets{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.presets::-webkit-scrollbar{display:none}
.presets button{flex:none;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:.86rem}
.presets button.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.hero{padding:16px;margin-top:12px}
.hero .lbl{font-size:.85rem;color:var(--muted)}
.hero .big{font-size:2.3rem;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.tile{padding:10px 12px}
.tile .v{font-size:clamp(1rem,4.6vw,1.25rem);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:380px){.tile{padding:9px 9px}.tab{font-size:.62rem}}
.tile .l{font-size:.75rem;color:var(--muted);line-height:1.2}
.rank{padding:10px 14px;border-bottom:1px solid var(--line)}
.rank:last-child{border-bottom:0}
.rank .r1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.rank .r1 b{font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:6px;border-radius:3px;background:var(--panel2);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.drow{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);width:100%}
.drow:last-child{border-bottom:0}
.drow .dd{font-size:.8rem;color:var(--muted);min-width:46px;font-variant-numeric:tabular-nums}
.drow .mid{flex:1;min-width:0}
.drow .mid .s{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drow .amt{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
details.blk>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:.78rem;margin:18px 0 8px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
details.blk>summary::-webkit-details-marker{display:none}
details.blk>summary::after{content:'▾';font-size:1rem}
details.blk[open]>summary::after{content:'▴'}
.dogpic{border-radius:50%;object-fit:cover;flex:none;display:block;background:var(--panel2)}
.pics{display:flex;flex:none}
.pics img{border:2px solid var(--panel)}
.pics img+img{margin-left:-14px}
.photo-slot{width:72px;height:72px;border-radius:50%;border:1.5px dashed var(--line);display:grid;place-items:center;font-size:1.5rem;color:var(--muted);flex:none;overflow:hidden;background:var(--panel2)}
.photo-slot img{width:100%;height:100%;object-fit:cover}
.viewseg{width:auto;margin-bottom:8px}
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin:6px 0 4px;touch-action:pan-y}
.month .wd{text-align:center;font-size:.72rem;color:var(--muted);padding:4px 0}
.mday{aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:12px;font-size:.95rem;font-variant-numeric:tabular-nums}
.mday.out{color:var(--muted);opacity:.45}
.mday.today{color:var(--accent-text);font-weight:700}
.mday.sel{background:var(--accent);color:var(--accent-ink)}
.mday .dots{height:5px;display:flex;gap:2px}
.mday .dots i{width:4px;height:4px;border-radius:50%;background:var(--accent)}
.mday.sel .dots i{background:var(--accent-ink)}
.remind{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.remind:last-child{border-bottom:0}
.remind.sent{opacity:.55}
.svc-edit{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line)}
.svc-edit:last-child{border-bottom:0}
.svc-edit span{flex:1}
.svc-edit button{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
</style>
</head><body>
<div class="wrap" id="app"></div>

<nav class="tabs"><div class="in">
  <button class="tab" data-tab="agenda"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Agenda</button>
  <button class="tab" data-tab="upcoming"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>À venir</button>
  <button class="fab" id="fab" aria-label="Nouveau rendez-vous">+</button>
  <button class="tab" data-tab="clients"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="6" cy="9" r="2"/><circle cx="10" cy="5" r="2"/><circle cx="14" cy="5" r="2"/><circle cx="18" cy="9" r="2"/><path d="M12 11c-3 0-6 4-6 7 0 2 2 3 3.5 2.5S11 19.5 12 19.5s1 .5 2.5 1S18 20 18 18c0-3-3-7-6-7z"/></svg>Clients</button>
  <button class="tab" data-tab="sales"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 016 0v2"/></svg>Ventes</button>
  <button class="tab" data-tab="compta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M14.5 8.5a3 3 0 100 5M9 10h4M9 12h4"/></svg>Compta</button>
  <button class="tab" data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>Réglages</button>
</div></nav>

<script>
'use strict';
/* ---------- Données ---------- */
const KEY='toilettage.v1';
/* Version de l'application (à augmenter à chaque mise à jour, comme dans sw.js) */
const APP_VERSION='26',APP_DATE='15 novembre 2026';
/* Taille du texte (propre à chaque téléphone) */
const FS_KEY='toilettage.fs';
function applyFs(v){document.documentElement.classList.remove('fs-1','fs-2');if(v==='1'||v==='2')document.documentElement.classList.add('fs-'+v);}
let fsLevel='0';try{fsLevel=localStorage.getItem(FS_KEY)||'0';}catch(e){}applyFs(fsLevel);
/* Thème clair / sombre (propre à chaque téléphone) */
const TH_KEY='toilettage.theme';
function applyTheme(v){
  const r=document.documentElement;if(v==='light'||v==='dark')r.setAttribute('data-theme',v);else r.removeAttribute('data-theme');
  document.querySelectorAll('meta[name="theme-color"]').forEach(m=>m.remove());
  const add=(c,media)=>{const m=document.createElement('meta');m.name='theme-color';m.content=c;if(media)m.media=media;document.head.appendChild(m);};

const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d);};

const norm=s=>String(s||'').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const fmtDay=s=>parse(s).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
const fmtShort=s=>parse(s).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'});

const endTime=(t,dur)=>{if(!t)return'';const[h,m]=t.split(':').map(Number);const x=h*60+m+(+dur||0);return pad(Math.floor(x/60)%24)+':'+pad(x%60);};

/* Répertoire clients reconstruit à partir des rendez-vous */
function directory(){
  const map=new Map();
  const blank=(k,name)=>({key:k,name,phone:'',email:'',address:'',notes:'',rid:null,dogs:new Map(),appts:[]});
  const gone=new Map(S.clients.filter(r=>r.deleted).map(r=>[norm(r.name),r.deletedAt||'']));
  for(const r of S.clients){const k=norm(r.name);if(!k||r.deleted)continue;
    const c=map.get(k)||blank(k,r.name.trim());map.set(k,c);
    Object.assign(c,{rid:r.id,email:r.email||'',address:r.address||'',notes:r.notes||''});
    for(const d of r.dogs||[]){const dk=norm(d.name);if(dk)c.dogs.set(dk,{name:d.name.trim(),breed:d.breed||'',notes:d.notes||'',photo:d.photo||'',last:null});}}
  for(const a of sortAppts([...S.appts])){
    const k=norm(a.client);if(!k)continue;
    if(gone.has(k)&&!((a.created||'')>gone.get(k)))continue;
    let c=map.get(k);
    if(!c){c=blank(k,a.client.trim());map.set(k,c);}
    c.name=a.client.trim();
    if(a.phone)c.phone=a.phone;
    c.appts.push(a);
    const dk=norm(a.dog);
    if(dk){const d=c.dogs.get(dk)||{name:'',breed:'',notes:'',last:null};d.name=a.dog.trim();if(a.breed)d.breed=a.breed;d.last=a;c.dogs.set(dk,d);}
  }
  // La fiche client enregistrée fait foi pour le nom et le téléphone
  for(const r of S.clients){if(r.deleted)continue;const c=map.get(norm(r.name));if(!c)continue;c.name=r.name.trim();if(r.phone)c.phone=r.phone;}
  return [...map.values()].sort((a,b)=>a.name.localeCompare(b.name,'fr'));
}

/* ---------- Suppression d'un client ---------- */
function askDeleteClient(key,onNo){
  const c=directory().find(x=>x.key===key);if(!c){onNo&&onNo();return;}
  const T=today();const past=c.appts.filter(a=>a.date<T||a.done),next=c.appts.filter(a=>!(a.date<T||a.done));
  const dogs=[...c.dogs.values()].map(d=>d.name).filter(Boolean);
  const pl=(n,w)=>n+' '+w+(n>1?'s':'');
  const html=`
    <p style="margin-top:14px;font-size:1.05rem">Supprimer <b>${esc(c.name)}</b>${dogs.length?' ('+esc(dogs.join(', '))+')':''} ?</p>
    <div class="card list-pad" style="margin-top:10px">
      <div class="stat"><span>Rendez-vous à venir</span><b>${next.length}</b></div>
      <div class="stat"><span>Rendez-vous passés</span><b>${past.length}</b></div>
    </div>
    <div class="actions" style="flex-direction:column;align-items:stretch">
      <button class="btn danger" id="dc-one" style="background:var(--bad);color:#fff;border-color:transparent">🗑 Supprimer la fiche${next.length?' et '+pl(next.length,'RDV')+' à venir':''}</button>
      ${past.length?`<p class="muted" style="font-size:.84rem;margin:0 4px 6px">${past.length>1?'Les '+past.length+' rendez-vous passés restent comptés':'Le rendez-vous passé reste compté'} dans la Compta, mais le client n’apparaît plus dans la liste.</p>
      <button class="btn danger" id="dc-all">Tout supprimer, y compris ${past.length>1?'les '+past.length+' RDV passés':'le RDV passé'}</button>
      <p class="muted" style="font-size:.84rem;margin:0 4px">⚠ ${past.length>1?'Leurs montants disparaîtront':'Son montant disparaîtra'} aussi de la Compta.</p>`:''}
      <button class="btn" id="dc-no">Annuler</button>
    </div>`;
  openSheet('Supprimer le client',html,{onClose:onNo});
  const finish=msg=>{save();closeSheet();swOpen=null;render();toast(msg);};
  const dropRecord=()=>{const r=S.clients.find(x=>!x.deleted&&norm(x.name)===key);
    if(r){(r.dogs||[]).forEach(d=>d.photo&&delPhoto(d.photo));(r.scans||[]).forEach(delPhoto);}
    S.clients=S.clients.filter(x=>norm(x.name)!==key);};
  $('#dc-no').onclick=()=>{closeSheet();onNo&&onNo();};
  $('#dc-one').onclick=()=>{
    const ids=new Set(next.map(a=>a.id));S.appts=S.appts.filter(a=>!ids.has(a.id));
    dropRecord();
    if(past.length)S.clients.push({id:uid(),name:c.name,deleted:true,deletedAt:new Date().toISOString(),dogs:[]});
    finish('Client supprimé');};
  const all=$('#dc-all');if(all)all.onclick=()=>{
    if(!confirm('Supprimer définitivement '+c.name+' et '+(c.appts.length>1?'ses '+c.appts.length+' rendez-vous':'son rendez-vous')+' ?\nLa Compta sera modifiée.'))return;
    const ids=new Set(c.appts.map(a=>a.id));S.appts=S.appts.filter(a=>!ids.has(a.id));
    dropRecord();finish('Client et rendez-vous supprimés');};
}

/* ---------- Glisser pour supprimer ---------- */
const SW_OPEN=104;let swOpen=null;
function closeSw(w){if(!w)return;w.classList.remove('open');setTimeout(()=>{if(!w.classList.contains('open'))w.classList.remove('active');},240);const c=w.querySelector('.appt, .client-row, .sale-row');if(c){c.classList.remove('dragging');c.style.transform='';}if(swOpen===w)swOpen=null;}
function askDelete(id,onNo){
  const a=S.appts.find(x=>x.id===id);if(!a){onNo&&onNo();return;}
  const what=[a.dog,a.client&&'('+a.client+')'].filter(Boolean).join(' ')||'ce rendez-vous';
  if(!confirm('Supprimer le rendez-vous de '+what+'\n'+fmtDay(a.date)+(a.time?' à '+a.time:'')+' ?')){onNo&&onNo();return;}
  S.appts=S.appts.filter(x=>x.id!==id);save();swOpen=null;render();toast('Rendez-vous supprimé');
}
function bindSwipes(root){
  root.querySelectorAll('.swipe').forEach(w=>{
    const card=w.querySelector('.appt, .client-row, .sale-row');let x0=0,y0=0,dx=0,drag=false,decided=false,start=0,pid=null;
    const set=(v,anim)=>{card.classList.toggle('dragging',!anim);card.style.transform=v?`translateX(${v}px)`:'';};
    card.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;
      x0=e.clientX;y0=e.clientY;dx=0;drag=false;decided=false;start=w.classList.contains('open')?-SW_OPEN:0;pid=e.pointerId;});
    card.addEventListener('pointermove',e=>{if(pid!==e.pointerId)return;const mx=e.clientX-x0,my=e.clientY-y0;
      if(!decided){if(Math.abs(mx)<8&&Math.abs(my)<8)return;decided=true;drag=Math.abs(mx)>Math.abs(my)*1.2;
        if(drag){w.classList.add('active');try{card.setPointerCapture(pid);}catch(_){}if(swOpen&&swOpen!==w)closeSw(swOpen);}}
      if(!drag)return;dx=Math.max(Math.min(0,start+mx),-w.offsetWidth);set(dx,false);e.preventDefault();});
    const end=e=>{if(pid!==e.pointerId)return;pid=null;if(!drag)return;
      card.dataset.swiped='1';setTimeout(()=>{delete card.dataset.swiped;},80);
      if(dx<-w.offsetWidth*0.55){set(-w.offsetWidth,true);setTimeout(()=>({client:askDeleteClient,sale:askDeleteSale}[w.dataset.kind]||askDelete)(w.dataset.sw,()=>closeSw(w)),180);}
      else if(dx<-50){w.classList.add('open');set(-SW_OPEN,true);swOpen=w;}
      else closeSw(w);};
    card.addEventListener('pointerup',end);card.addEventListener('pointercancel',end);
  });
}

async function exportData(){
  const name='toilettage-sauvegarde-'+today()+'.json';
  const used=new Set(S.clients.flatMap(c=>[...(c.dogs||[]).map(d=>d.photo),...(c.scans||[])]).filter(id=>id&&PH[id]));
  const photos={};used.forEach(id=>photos[id]=PH[id]);
  const blob=new Blob([JSON.stringify({app:'toilettage',version:1,exported:new Date().toISOString(),...S,photos})],{type:'application/json'});
  const file=new File([blob],name,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:'Sauvegarde toilettage'});return;}catch(e){if(e.name==='AbortError')return;}
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
}
function importData(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);if(!d||!Array.isArray(d.appts))throw 0;
      const ids=new Set(S.appts.map(a=>a.id));const added=d.appts.filter(a=>a&&a.id&&a.date&&!ids.has(a.id));
      const cids=new Set(S.clients.map(c=>c.id));const cnames=new Set(S.clients.map(c=>norm(c.name)));
      const addedC=(Array.isArray(d.clients)?d.clients:[]).filter(c=>c&&c.id&&c.name&&!cids.has(c.id)&&!cnames.has(norm(c.name)));
      const sids=new Set(S.sales.map(v=>v.id));const addedS=(Array.isArray(d.sales)?d.sales:[]).filter(v=>v&&v.id&&v.date&&!sids.has(v.id));
      if(!confirm(`Restaurer cette sauvegarde ?\n${added.length} nouveaux rendez-vous, ${addedC.length} nouvelles fiches clients et ${addedS.length} ventes.\nCe qui est déjà présent est conservé.`))return;
      S.appts.push(...added);S.clients.push(...addedC);S.sales.push(...addedS);if(d.photos&&typeof d.photos==='object')for(const[id,v]of Object.entries(d.photos))if(!PH[id]&&typeof v==='string'&&v.startsWith('data:image/'))putPhoto(id,v);if(d.settings&&typeof d.settings==='object')S.settings=Object.assign(S.settings,d.settings);save();toast(added.length+' RDV et '+addedC.length+' fiches ajoutés');render();
    }catch(err){alert('Ce fichier n’est pas une sauvegarde valide.');}
  };
  r.readAsText(f);e.target.value='';
}

    ${!editing&&!opts.fromImport?`<div class="actions" style="margin-top:12px"><button type="button" class="btn" id="f-voice" style="flex:1">🎤 Remplir à la voix</button></div>`:''}
    ${opts.banner?`<p class="muted" style="font-size:.85rem;margin-top:12px">${esc(opts.banner)}</p>`:''}
    <div class="row">
      <div><label for="f-date">Date</label><input type="date" id="f-date" value="${esc(a.date)}" required></div>
      <div><label for="f-time">Heure</label><input type="time" id="f-time" value="${esc(a.time)}" step="300"></div>
    </div>
    <label for="f-dur">Durée</label>
    <select id="f-dur">${durOpts.map(([v,l])=>`<option value="${v}"${v==a.duration?' selected':''}>${l}</option>`).join('')}</select>

    <h2>Client</h2>
    <label for="f-client">Nom du client</label>
    <input id="f-client" value="${esc(a.client)}" autocomplete="off" autocapitalize="words" placeholder="ex. Mme Martin">
    <div id="sug-client"></div>
    <label for="f-phone">Téléphone</label>
    <input id="f-phone" type="tel" value="${esc(a.phone)}" autocomplete="off" placeholder="06 12 34 56 78">

    <h2>Chien</h2>
    <div class="row">
      <div><label for="f-dog">Nom du chien</label><input id="f-dog" value="${esc(a.dog)}" autocomplete="off" autocapitalize="words" placeholder="ex. Filou"></div>
      <div><label for="f-breed">Race</label><input id="f-breed" value="${esc(a.breed)}" list="breeds" autocomplete="off" autocapitalize="words" placeholder="ex. Caniche"></div>
    </div>
    <div id="sug-dog"></div>
    <datalist id="breeds">${breeds.map(b=>`<option value="${esc(b)}">`).join('')}</datalist>

    <h2>Prestation</h2>
    <div class="svc" id="svc">${allSvc.map(s=>`<button type="button" data-s="${esc(s)}" class="${services.has(s)?'on':''}">${esc(s)}</button>`).join('')}<button type="button" id="svc-add">+ Autre</button></div>
    <label for="f-details">Détails de la prestation</label>
    <textarea id="f-details" placeholder="ex. Coupe courte sur le corps, garder la tête ronde, sabot 6 mm">${esc(a.details)}</textarea>
    <div class="row">
      <div><label for="f-price">Prix (€)</label><input id="f-price" type="number" inputmode="decimal" min="0" step="0.5" value="${esc(a.price)}" placeholder="0"></div>
      <div><label>Statut</label><div class="seg" id="f-done"><button type="button" data-v="0" class="${a.done?'':'on'}">Prévu</button><button type="button" data-v="1" class="${a.done?'on':''}">Fait ✓</button></div></div>
    </div>
    <label>Paiement</label>
    <div class="seg" id="f-pay"><button type="button" data-v="cash" class="${a.pay==='cash'?'on':''}">💶 Espèces</button><button type="button" data-v="card" class="${a.pay==='card'?'on':''}">💳 Carte</button><button type="button" data-v="" class="${PAY[a.pay]?'':'on'}">Pas encore</button></div>

    <h2>Remarques</h2>
    <textarea id="f-notes" placeholder="Comportement, santé, allergies, peur du séchoir, mord…">${esc(a.notes)}</textarea>

    <div class="actions">
      <button class="btn primary" id="f-save" style="flex:1">${editing?'Enregistrer':'Ajouter le rendez-vous'}</button>
    </div>
    ${editing?`<div class="actions">
      ${a.phone?`<a class="btn" href="${telHref(a.phone)}">📞 Appeler</a><a class="btn" id="f-sms" href="${smsHref(a.phone,reminderText(a))}">💬 Rappel SMS${a.reminded?' ✓':''}</a>`:''}
      <button class="btn" id="f-again">↻ Reprendre RDV</button>
      <button class="btn danger" id="f-del">Supprimer</button>
    </div>`:''}`;
  openSheet(editing?'Rendez-vous':'Nouveau rendez-vous',html,{right:'OK',onRight:submit,onClose:opts.onCancel});
  const fv=$('#f-voice');if(fv)fv.onclick=()=>openVoice($('#f-date').value||a.date);
  let done=!!a.done;let pay=PAY[a.pay]?a.pay:'';

  // Prestations
  const svcBox=$('#svc');
  svcBox.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.id==='svc-add'){
      const n=(prompt('Nom de la prestation :')||'').trim();if(!n)return;
      if(![...svcBox.querySelectorAll('[data-s]')].some(x=>x.dataset.s===n)){const nb=document.createElement('button');nb.type='button';nb.dataset.s=n;nb.textContent=n;svcBox.insertBefore(nb,b);}
      services.add(n);svcBox.querySelector(`[data-s="${CSS.escape(n)}"]`).classList.add('on');return;
    }
    const s=b.dataset.s;if(services.has(s)){services.delete(s);b.classList.remove('on');}else{services.add(s);b.classList.add('on');}
  });
  $('#f-pay').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;pay=b.dataset.v;[...$('#f-pay').children].forEach(x=>x.classList.toggle('on',x===b));
    if(pay&&!done){done=true;[...$('#f-done').children].forEach(x=>x.classList.toggle('on',x.dataset.v==='1'));}});
  $('#f-done').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;done=b.dataset.v==='1';[...$('#f-done').children].forEach(x=>x.classList.toggle('on',x===b));});

  // Suggestions clients / chiens
  const dir=directory();
  const fClient=$('#f-client'),fDog=$('#f-dog');
  function currentClient(){return dir.find(c=>c.key===norm(fClient.value));}
  function suggestClients(){
    const v=norm(fClient.value);const box=$('#sug-client');
    if(!v){box.innerHTML='';return;}
    const m=dir.filter(c=>(norm(c.name).includes(v)||[...c.dogs.values()].some(d=>norm(d.name).includes(v)))&&c.key!==v).slice(0,5);
    box.innerHTML=m.length?`<div class="suggest">${m.map(c=>`<button type="button" data-k="${esc(c.key)}">${esc(c.name)} <small>· ${esc([...c.dogs.values()].map(d=>d.name).join(', '))}</small></button>`).join('')}</div>`:'';
  }
  function suggestDogs(){
    const c=currentClient();const box=$('#sug-dog');
    if(!c||!c.dogs.size){box.innerHTML='';return;}
    const v=norm(fDog.value);
    const m=[...c.dogs.values()].filter(d=>norm(d.name)!==v);
    box.innerHTML=m.length?`<div class="chips" style="margin-top:8px">${m.map(d=>`<button type="button" class="chip" data-dog="${esc(d.name)}">🐕 ${esc(d.name)}</button>`).join('')}</div>`:'';
  }
  function pickClient(c){
    fClient.value=c.name;if(c.phone&&!$('#f-phone').value)$('#f-phone').value=c.phone;
    $('#sug-client').innerHTML='';
    if(c.dogs.size===1&&!fDog.value)pickDog([...c.dogs.values()][0]);
    suggestDogs();
  }
  function pickDog(d){
    fDog.value=d.name;if(d.breed&&!$('#f-breed').value)$('#f-breed').value=d.breed;
    // Reprendre la dernière prestation si rien n'est encore saisi
    if(!editing&&d.last&&!services.size&&!$('#f-details').value){
      (d.last.services||[]).forEach(s=>{services.add(s);let b=svcBox.querySelector(`[data-s="${CSS.escape(s)}"]`);
        if(!b){b=document.createElement('button');b.type='button';b.dataset.s=s;b.textContent=s;svcBox.insertBefore(b,$('#svc-add'));}b.classList.add('on');});
      $('#f-details').value=d.last.details||'';
      if(!$('#f-price').value&&d.last.price!=='')$('#f-price').value=d.last.price;
      if(!$('#f-notes').value)$('#f-notes').value=d.last.notes||'';
      if(d.last.duration)$('#f-dur').value=d.last.duration;
      toast('Dernière prestation de '+d.name+' reprise');
    }
    if(d.notes&&!$('#f-notes').value)$('#f-notes').value=d.notes;
    suggestDogs();
  }
  fClient.addEventListener('input',()=>{suggestClients();suggestDogs();});
  fClient.addEventListener('blur',()=>setTimeout(()=>{$('#sug-client')&&($('#sug-client').innerHTML='');const c=currentClient();if(c)pickClient(c);},200));
  $('#sug-client').addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(b)pickClient(dir.find(c=>c.key===b.dataset.k));});
  $('#sug-dog').addEventListener('click',e=>{const b=e.target.closest('[data-dog]');if(!b)return;const c=currentClient();pickDog(c.dogs.get(norm(b.dataset.dog)));});
  fDog.addEventListener('input',suggestDogs);
  fDog.addEventListener('blur',()=>{const c=currentClient();const d=c&&c.dogs.get(norm(fDog.value));if(d&&!$('#f-breed').value&&d.breed)$('#f-breed').value=d.breed;});
  suggestDogs();
  if(!editing&&!a.client)setTimeout(()=>{const ft=$('#f-time');if(!a.time&&ft)ft.focus();},250);

  function submit(){
    const v=id=>$(id).value.trim();
    const rec={id:a.id||uid(),date:v('#f-date'),time:v('#f-time'),duration:+$('#f-dur').value,
      client:v('#f-client'),phone:v('#f-phone'),dog:v('#f-dog'),breed:v('#f-breed'),
      services:[...svcBox.querySelectorAll('[data-s].on')].map(b=>b.dataset.s),
      details:v('#f-details'),price:$('#f-price').value===''?'':+$('#f-price').value,notes:v('#f-notes'),done,pay,
      created:a.created||new Date().toISOString(),updated:new Date().toISOString()};
    const kept=S.appts.find(x=>x.id===rec.id);if(kept&&kept.reminded&&kept.date===rec.date&&kept.time===rec.time)rec.reminded=kept.reminded;
    if(!rec.date){toast('Choisissez une date');return;}
    if(!rec.client&&!rec.dog){toast('Indiquez au moins le client ou le chien');$('#f-client').focus();return;}
    const i=S.appts.findIndex(x=>x.id===rec.id);
    if(i>=0)S.appts[i]=rec;else S.appts.push(rec);
    save();closeSheet();
    if(opts.onSaved){opts.onSaved(rec);return;}
    if(tab==='agenda')sel=rec.date;
    toast(editing?'Rendez-vous modifié':'Rendez-vous ajouté');render();
  }
  $('#f-save').onclick=submit;
  if(editing){
    $('#f-del').onclick=()=>{if(!confirm('Supprimer ce rendez-vous ?'))return;S.appts=S.appts.filter(x=>x.id!==a.id);save();closeSheet();toast('Rendez-vous supprimé');render();};
    const fs=$('#f-sms');if(fs)fs.addEventListener('click',()=>{markReminded(a.id);a.reminded=true;});
    $('#f-again').onclick=()=>{const{id,created,updated,date,time,done:_,reminded:__,pay:___,...rest}=a;openForm({...rest,date:addDays(a.date,42)});toast('Nouveau RDV pré-rempli (dans 6 semaines)');};
  }
}

/* ---------- Fiche client ---------- */

  const c=directory().find(x=>x.key===key);if(!c)return;
  const hist=[...c.appts].reverse();
  const lastNote=hist.find(a=>a.notes);
  const t=today();const next=c.appts.find(a=>a.date>=t);
  const html=`
    <div style="text-align:center;margin:14px 0 6px"><div class="avatar" style="width:64px;height:64px;font-size:1.6rem;margin:0 auto 8px">${esc(c.name[0]?.toUpperCase()||'?')}</div>
      <div style="font-weight:700;font-size:1.2rem">${esc(c.name)}</div>
      ${c.phone?`<div class="muted">${esc(c.phone)}</div>`:''}
      ${c.email?`<div class="muted" style="font-size:.9rem">${esc(c.email)}</div>`:''}
      ${c.address?`<div class="muted" style="font-size:.9rem">${esc(c.address)}</div>`:''}</div>
    <div class="actions" style="justify-content:center;margin-top:10px">
      ${c.phone?`<a class="btn" href="${telHref(c.phone)}">📞 Appeler</a><a class="btn" href="${smsHref(c.phone)}">💬 SMS</a>`:''}
      <button class="btn" id="c-edit">✎ Modifier</button>
      <button class="btn danger" id="c-del">🗑 Supprimer</button>
    </div>
    <div class="actions" style="justify-content:center;margin-top:8px"><button class="btn small primary" id="c-rdv">+ Rendez-vous</button></div>
    ${c.notes?`<h2>Remarques sur le client</h2><div class="card" style="padding:12px 14px;white-space:pre-wrap">${esc(c.notes)}</div>`:''}
    ${next?`<h2>Prochain rendez-vous</h2>${apptCard(next,true)}`:''}
    ${lastNote?`<h2>Dernière remarque</h2><div class="card" style="padding:12px 14px;white-space:pre-wrap">⚠ ${esc(lastNote.notes)}<div class="muted" style="font-size:.8rem;margin-top:4px">${esc(fmtShort(lastNote.date))}</div></div>`:''}
    ${(()=>{const r=S.clients.find(x=>x.id===c.rid);const sc=(r&&r.scans||[]).filter(id=>PH[id]);
      return `<h2>Fiche papier</h2><div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">${sc.map(id=>`<button data-scan="${id}" aria-label="Voir la fiche papier"><img src="${PH[id]}" alt="" style="width:64px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block"></button>`).join('')}
      <button class="btn small" id="c-scan">📎 ${sc.length?'Ajouter':'Ajouter une photo de la fiche papier'}</button></div>`;})()}
    <h2>Chiens</h2>
    <div class="card list-pad">${[...c.dogs.values()].map(d=>`<div class="client-row"><button class="photo-slot" style="width:56px;height:56px" data-dogpic="${esc(d.name)}" aria-label="${PH[d.photo]?'Voir la photo de':'Ajouter une photo de'} ${esc(d.name)}">${PH[d.photo]?`<img src="${PH[d.photo]}" alt="">`:'📷'}</button><span style="flex:1;min-width:0"><div class="name">${esc(d.name)}</div><div class="sub">${esc(d.breed||'Race non précisée')}</div>${d.notes?`<div class="sub" style="white-space:normal">⚠ ${esc(d.notes)}</div>`:''}</span><button class="btn small primary" data-newdog="${esc(d.name)}">+ RDV</button></div>`).join('')||'<div class="client-row muted">Aucun chien renseigné</div>'}</div>
    <h2>Historique (${hist.length})</h2>
    ${hist.length?'':'<p class="muted">Aucune visite enregistrée.</p>'}
    <div class="card list-pad${hist.length?'':' hidden'}">${hist.map(a=>`<button class="hist" data-id="${a.id}">
      <div class="h1"><span>${esc(fmtShort(a.date))}${a.time?' · '+esc(a.time):''} — ${esc(a.dog||'')}</span><span class="price">${fmtPrice(a.price)}</span></div>
      ${(a.services||[]).length?`<div class="chips">${a.services.map(s=>`<span class="chip">${esc(s)}</span>`).join('')}</div>`:''}

    openClientForm({id:c.rid,name:c.name,phone:c.phone,email:c.email,address:c.address,notes:c.notes,

  };
}

/* ---------- Formulaire fiche client ---------- */
/* Civilité (Mme / M.) séparée du nom */
const CIV_RE=/^\s*(madame|mademoiselle|mme|mlle|monsieur|mr\.?|m\.)\s+/i;
function splitCiv(name){const m=String(name||'').match(CIV_RE);if(!m)return {civ:'',nom:String(name||'').trim()};
  return {civ:/^m(\.|r\.?|onsieur)$/i.test(m[1])?'M.':'Mme',nom:String(name).replace(CIV_RE,'').trim()};}
function openClientForm(init,opts={}){
  const r=Object.assign({name:'',phone:'',email:'',address:'',notes:'',dogs:[]},init);
  let dogs=(r.dogs&&r.dogs.length?r.dogs:[{name:'',breed:'',notes:''}]).map(d=>({...d}));
  const pending={};const oldPics=new Set((r.dogs||[]).map(d=>d.photo).filter(Boolean));
  const isNew=!opts.oldKey;
  const breeds=[...new Set([...BREEDS,...S.appts.map(x=>x.breed).filter(Boolean)])].sort((x,y)=>x.localeCompare(y,'fr'));
  const html=`
    ${isNew&&!opts.onSaved&&!opts.fromVoice?`<div class="actions" style="margin-top:12px"><button type="button" class="btn" id="cf-voice" style="flex:1">🎤 Remplir à la voix</button></div>`:''}
    ${opts.banner?`<p style="font-size:.85rem;margin-top:12px;color:${opts.bannerMuted?'var(--muted)':'var(--bad)'}">${esc(opts.banner)}</p>`:''}
    <h2>Propriétaire</h2>
    ${(()=>{const sc=splitCiv(r.name);return `<label>Civilité</label>
    <div style="display:flex;gap:18px;align-items:center" id="cf-civ">
      <label style="display:flex;align-items:center;gap:8px;margin:0;color:var(--fg);font-size:1rem"><input type="checkbox" data-civ="Mme" ${sc.civ==='Mme'?'checked':''} style="width:22px;height:22px;min-height:0"> Madame (Mme)</label>
      <label style="display:flex;align-items:center;gap:8px;margin:0;color:var(--fg);font-size:1rem"><input type="checkbox" data-civ="M." ${sc.civ==='M.'?'checked':''} style="width:22px;height:22px;min-height:0"> Monsieur (M.)</label>
    </div>
    <label for="cf-name">Nom</label><input id="cf-name" value="${esc(sc.nom)}" autocapitalize="words" placeholder="ex. Martin">`;})()}
    <label for="cf-phone">Téléphone</label><input id="cf-phone" type="tel" value="${esc(r.phone)}" placeholder="06 12 34 56 78">
    <label for="cf-email">E-mail</label><input id="cf-email" type="email" value="${esc(r.email)}" autocapitalize="off">
    <label for="cf-address">Adresse</label><input id="cf-address" value="${esc(r.address)}">
    <label for="cf-notes">Remarques sur le client</label><textarea id="cf-notes" placeholder="Préférences, paiement, disponibilités…">${esc(r.notes)}</textarea>
    <h2>Chiens</h2><div id="cf-dogs"></div>
    <button type="button" class="btn small" id="cf-adddog" style="margin-top:8px">+ Ajouter un chien</button>
    <datalist id="cf-breeds">${breeds.map(b=>`<option value="${esc(b)}">`).join('')}</datalist>
    ${!isNew&&opts.nAppts?`<p class="muted" style="font-size:.85rem;margin-top:14px">Un changement de nom ou de téléphone s’applique aussi aux ${opts.nAppts} rendez-vous de ce client.</p>`:''}
    <div class="actions"><button class="btn primary" id="cf-save" style="flex:1">${opts.onSaved?'Valider':'Enregistrer la fiche'}</button></div>
    ${!isNew&&r.id&&!opts.nAppts?'<div class="actions"><button class="btn danger" id="cf-del">Supprimer la fiche</button></div>':''}`;
  openSheet(isNew&&!opts.onSaved?'Nouveau client':'Fiche client',html,{right:'OK',onRight:submit,onClose:opts.onCancel});
  const cfv=$('#cf-voice');if(cfv)cfv.onclick=()=>openVoice(today(),'client');
  function readDogs(){document.querySelectorAll('[data-dog-i]').forEach(row=>{const i=+row.dataset.dogI;
    dogs[i]={name:row.querySelector('.dn').value.trim(),breed:row.querySelector('.db').value.trim(),notes:row.querySelector('.dno').value.trim(),photo:dogs[i].photo||''};});}
  function drawDogs(){
    $('#cf-dogs').innerHTML=dogs.map((d,i)=>`<div class="card" data-dog-i="${i}" style="padding:4px 12px 12px;margin-top:8px">
      <div style="display:flex;align-items:center;gap:12px;margin-top:12px">
        <button type="button" class="photo-slot" data-setpic="${i}" aria-label="Photo du chien">${PH[d.photo]||pending[d.photo]?`<img src="${PH[d.photo]||pending[d.photo]}" alt="">`:'📷'}</button>
        <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start"><button type="button" class="btn small" data-setpic="${i}">${d.photo?'Changer la photo':'Ajouter une photo'}</button>
        ${d.photo?`<button type="button" class="btn small danger" data-rmpic="${i}">Retirer la photo</button>`:''}</div>
      </div>
      <div class="row"><div><label>Nom du chien</label><input class="dn" value="${esc(d.name)}" autocapitalize="words"></div>
      <div><label>Race</label><input class="db" value="${esc(d.breed)}" list="cf-breeds" autocapitalize="words"></div></div>
      <label>Remarques sur le chien</label><textarea class="dno" style="min-height:56px" placeholder="Âge, caractère, santé, coupe habituelle…">${esc(d.notes)}</textarea>
      ${dogs.length>1?`<button type="button" class="btn small danger" data-rmdog="${i}" style="margin-top:8px">Retirer ce chien</button>`:''}</div>`).join('');
  }
  drawDogs();
  $('#cf-adddog').onclick=()=>{readDogs();dogs.push({name:'',breed:'',notes:''});drawDogs();const l=document.querySelectorAll('.dn');l[l.length-1].focus();};
  $('#cf-dogs').onclick=e=>{
    const sp=e.target.closest('[data-setpic]'),rp=e.target.closest('[data-rmpic]'),b=e.target.closest('[data-rmdog]');

  }

  if(isNew&&!r.name)setTimeout(()=>{const n=$('#cf-name');if(n)n.focus();},250);

/* ---------- Comptabilité ---------- */
let CP=(()=>{try{return JSON.parse(localStorage.getItem('toilettage.compta'))||{};}catch(e){return {};}})();
CP=Object.assign({preset:'month',from:'',to:'',mode:'done'},CP,{payf:''});
const saveCP=()=>{try{const{payf,...k}=CP;localStorage.setItem('toilettage.compta',JSON.stringify(k));}catch(e){}};
function presetRange(k){
  const t=parse(today()),y=t.getFullYear(),m=t.getMonth();
  if(k==='month')return [iso(new Date(y,m,1)),iso(new Date(y,m+1,0))];
  if(k==='lastmonth')return [iso(new Date(y,m-1,1)),iso(new Date(y,m,0))];
  if(k==='week'){const mo=addDays(today(),-((t.getDay()+6)%7));return [mo,addDays(mo,6)];}
  if(k==='year')return [y+'-01-01',y+'-12-31'];
  if(k==='lastyear')return [(y-1)+'-01-01',(y-1)+'-12-31'];
  if(k==='quarter'){const q=Math.floor(m/3)*3;return [iso(new Date(y,q,1)),iso(new Date(y,q+3,0))];}
  return [CP.from||iso(new Date(y,m,1)),CP.to||today()];
}
const svcOrder=x=>{const i=svcList().indexOf(x);return i<0?99:i;};
const saleTotal=v=>Math.round((+v.qty||1)*(+v.price||0)*100)/100;
const cardFee=price=>Math.round(((+S.settings.feeFixed||0)+(+S.settings.feePct||0)*(+price||0)/100)*100)/100;
function comptaData(){
  const [from,to]=CP.preset==='custom'?[CP.from,CP.to]:presetRange(CP.preset);
  const T=today();
  const list=sortAppts(S.appts.filter(a=>a.date>=from&&a.date<=to&&(CP.mode==='all'||a.done||a.date<T)));
  const priced=list.filter(a=>a.price!==''&&a.price!=null&&!isNaN(a.price));
  let total=priced.reduce((s,a)=>s+ +a.price,0);
  const dogs=new Map(),forms=new Map(),svcCount=new Map(),months=new Map();
  const pays={card:{n:0,total:0},cash:{n:0,total:0},none:{n:0,total:0}};let fees=0,feesIfCard=0;
  for(const a of list){
    const p=priced.includes(a)?+a.price:0;
    const dk=norm(a.client)+'|'+norm(a.dog);
    const d=dogs.get(dk)||{dog:a.dog||'Chien ?',client:a.client||'',n:0,total:0,photo:dogPhotoId(a.client,a.dog)};d.n++;d.total+=p;dogs.set(dk,d);
    const sv=[...(a.services||[])].sort((x,y)=>svcOrder(x)-svcOrder(y));
    const fk=sv.length?sv.join(' + '):'Prestation non précisée';
    const f=forms.get(fk)||{label:fk,n:0,total:0,priced:0};f.n++;f.total+=p;if(priced.includes(a))f.priced++;forms.set(fk,f);
    for(const x of sv)svcCount.set(x,(svcCount.get(x)||0)+1);
    const pk=PAY[a.pay]?a.pay:'none';pays[pk].n++;pays[pk].total+=p;
    if(priced.includes(a)){if(pk==='card')fees+=cardFee(a.price);else if(pk==='none')feesIfCard+=cardFee(a.price);}
    const mk=a.date.slice(0,7);const mo=months.get(mk)||{key:mk,n:0,total:0};mo.n++;mo.total+=p;months.set(mk,mo);
  }
  // Ventes de produits
  const sales=S.sales.filter(v=>v.date>=from&&v.date<=to&&(CP.mode==='all'||v.date<=T)).sort((a,b)=>a.date.localeCompare(b.date));
  const prods=new Map();let salesTotal=0,salesQty=0;
  for(const v of sales){const amt=saleTotal(v);salesTotal+=amt;salesQty+=(+v.qty||1);
    const pk=PAY[v.pay]?v.pay:'none';pays[pk].ns=(pays[pk].ns||0)+1;pays[pk].total+=amt;
    if(pk==='card')fees+=cardFee(amt);else if(pk==='none')feesIfCard+=cardFee(amt);
    const k=norm(v.product)||'?';const pr=prods.get(k)||{label:v.product||'Produit',qty:0,total:0,n:0};pr.qty+=(+v.qty||1);pr.total+=amt;pr.n++;prods.set(k,pr);
    const mk=v.date.slice(0,7);const mo=months.get(mk)||{key:mk,n:0,total:0};mo.ns=(mo.ns||0)+1;mo.total+=amt;months.set(mk,mo);}
  salesTotal=Math.round(salesTotal*100)/100;
  const rdvTotal=total;total=Math.round((rdvTotal+salesTotal)*100)/100;
  fees=Math.round(fees*100)/100;feesIfCard=Math.round(feesIfCard*100)/100;
  return {sales,salesTotal,salesQty,salesCount:sales.length,prods:[...prods.values()].sort((a,b)=>b.total-a.total),rdvTotal,
    fees,feesIfCard,net:Math.round((total-fees)*100)/100,pays,from,to,list,priced,total,count:list.length,noPrice:list.length-priced.length,
    avg:priced.length?rdvTotal/priced.length:0,dogs:[...dogs.values()].sort((a,b)=>b.total-a.total||b.n-a.n),
    forms:[...forms.values()].sort((a,b)=>b.total-a.total||b.n-a.n),svc:[...svcCount.entries()].sort((a,b)=>b[1]-a[1]),
    months:[...months.values()].sort((a,b)=>a.key.localeCompare(b.key)),planned:S.appts.filter(a=>a.date>=from&&a.date<=to&&!a.done&&a.date>=T).length};
}

async function exportCompta(D){

/* Applique un document reçu de l'autre téléphone */
function applyRemote(kind,doc){
  const id=doc.id,d=doc.data();
  if(kind==='photos'){
    if(d.deleted){if(PH[id])delPhoto(id,true);delete SY.p[id];}
    else if(d.data&&PH[id]!==d.data){putPhoto(id,d.data,true);SY.p[id]=1;return true;}
    else SY.p[id]=1;
    return !!d.deleted;
  }
  if(kind==='meta'){if(!d.json)return false;const h=hashStr(d.json);if(SY.s===h)return false;const rs=JSON.parse(d.json);if(rs.feeV!==2){delete rs.feeFixed;delete rs.feePct;delete rs.feeV;}S.settings=Object.assign(S.settings,rs);SY.s=h;return true;}
  const arr={appts:S.appts,clients:S.clients,sales:S.sales}[kind],map={appts:SY.a,clients:SY.c,sales:SY.v}[kind];
  const i=arr.findIndex(x=>x.id===id);
  if(d.deleted){delete map[id];if(i>=0){arr.splice(i,1);return true;}return false;}
  if(!d.json)return false;
  const h=hashStr(d.json);
  if(i>=0&&hashStr(JSON.stringify(arr[i]))===h){map[id]=h;return false;}
  const rec=JSON.parse(d.json);
  if(i>=0)arr[i]=rec;else arr.push(rec);
  map[id]=h;return true;
}

async function startSync(){
  if(syncLive)return;syncLive=true;
  setSync('Synchronisation…');
  try{
    if(SY.uid!==fuser.uid){
      // Première connexion de ce téléphone à ce compte : on fusionne tout
      SY={uid:fuser.uid,email:fuser.email,t:{},a:{},c:{},v:{},s:'',p:{}};
      const b=base();
      const [ra,rc,rp,rm,rv]=await Promise.all([b.collection('appts').get(),b.collection('clients').get(),b.collection('photos').get(),b.collection('meta').get(),b.collection('sales').get()]);
      const keepNewer=(arr,doc)=>{const d=doc.data();if(d.deleted||!d.json)return false;const loc=arr.find(x=>x.id===doc.id);if(!loc)return false;
        const r=JSON.parse(d.json);return (loc.updated||'')>(r.updated||'');};
      ra.forEach(doc=>{if(!keepNewer(S.appts,doc))applyRemote('appts',doc);});
      rc.forEach(doc=>{if(!keepNewer(S.clients,doc))applyRemote('clients',doc);});
      rv.forEach(doc=>{if(!keepNewer(S.sales,doc))applyRemote('sales',doc);});
      rp.forEach(doc=>applyRemote('photos',doc));
      if(rm.size)rm.forEach(doc=>applyRemote('meta',doc));
      for(const [k,snap] of [['sales',rv],['appts',ra],['clients',rc],['photos',rp],['meta',rm]]){let mx=0;snap.forEach(doc=>{const t=doc.data()._t;if(t&&t.toMillis()>mx)mx=t.toMillis();});SY.t[k]=mx;}
      saveSY();saveLocal();render();
      // Envoie ce qui n'existe que sur ce téléphone (rendez-vous, fiches, photos)
      for(const id of Object.keys(PH))if(!SY.p[id])photoPush(id,PH[id]);
    }
    SY.email=fuser.email;SY.v=SY.v||{};SY.t=SY.t||{};saveSY();
    await doPush();
    // Écoute les changements de l'autre téléphone
    for(const kind of ['appts','clients','sales','photos','meta']){
      const since=firebase.firestore.Timestamp.fromMillis(SY.t[kind]||0);
      unsubs.push(base().collection(kind).where('_t','>',since).onSnapshot({includeMetadataChanges:false},qs=>{
        let changed=false,mx=SY.t[kind]||0;
        qs.docChanges().forEach(ch=>{if(ch.doc.metadata.hasPendingWrites)return;const t=ch.doc.data()._t;if(t&&t.toMillis()>mx)mx=t.toMillis();
          if(applyRemote(kind,ch.doc))changed=true;});
        SY.t[kind]=mx;saveSY();
        if(changed){saveLocal();laterRender();}
        if(!qs.metadata.fromCache)setSync('À jour ✓ '+new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}));
      },syncErr));
    }
  }catch(e){syncLive=false;syncErr(e);}
}
function stopSync(){unsubs.forEach(u=>{try{u();}catch(e){}});unsubs=[];syncLive=false;}
function syncPush(){if(!fuser||!syncLive)return;clearTimeout(pushTimer);pushTimer=setTimeout(doPush,600);}
async function doPush(){
  if(!fuser)return;
  if(pushing){pushAgain=true;return;}
  pushing=true;
  try{
    const b=base();const ops=[];const after=[];
    for(const [kind,arr,map] of [['appts',S.appts,SY.a],['clients',S.clients,SY.c],['sales',S.sales,SY.v||(SY.v={})]]){
      const seen=new Set();
      for(const r of arr){seen.add(r.id);const j=JSON.stringify(r);const h=hashStr(j);
        if(map[r.id]!==h){ops.push([b.collection(kind).doc(r.id),{json:j,deleted:false,_t:TS()}]);after.push(()=>map[r.id]=h);}}
      for(const id of Object.keys(map))if(!seen.has(id)){ops.push([b.collection(kind).doc(id),{json:'',deleted:true,_t:TS()}]);after.push(()=>delete map[id]);}
    }
    const sj=JSON.stringify(S.settings);const sh=hashStr(sj);
    if(SY.s!==sh){ops.push([b.collection('meta').doc('settings'),{json:sj,_t:TS()}]);after.push(()=>SY.s=sh);}
    if(ops.length){
      setSync('Envoi des changements…');
      for(let i=0;i<ops.length;i+=400){const batch=fdb.batch();ops.slice(i,i+400).forEach(([ref,data])=>batch.set(ref,data));await batch.commit();}
      after.forEach(f=>f());saveSY();
      setSync('À jour ✓ '+new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}));
    }
  }catch(e){syncErr(e);}
  finally{pushing=false;if(pushAgain){pushAgain=false;syncPush();}}
}

  const t=today();
  const dir=directory().slice(0,300).map(c=>`- ${c.name}${c.phone?' ('+c.phone+')':''} : ${[...c.dogs.values()].map(d=>d.name+(d.breed?' ['+d.breed+']':'')).join(', ')}`).join('\n');
  return `Nous sommes le ${fmtDay(t)} (${t}). Salon de toilettage canin en France.
Prestations habituelles (utilise ces libellés exacts quand ça correspond) : ${svcList().join(', ')}.
${dir?'Clients déjà connus (corrige l’orthographe d’un nom mal lu s’il correspond clairement à l’un d’eux, et reprends son téléphone) :\n'+dir:''}`;

async function askClaude(content,effort,schema=APPT_SCHEMA){
  const key=getKey();if(!key)throw new Error('Aucune clé API : ajoutez-la dans Réglages.');
  if(!navigator.onLine)throw new Error('Pas de connexion internet.');
  let res;
  try{
    res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{
      'content-type':'application/json','x-api-key':key,'anthropic-version':'2026-10-21',
      'anthropic-beta':'server-side-fallback-2026-07-01',
      'anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-opus-5-5',max_tokens:16000,fallbacks:'default',
        output_config:{effort,format:{type:'json_schema',schema}},
        system:'Tu aides une toiletteuse à saisir ses rendez-vous et ses fiches clients. Tu extrais des informations structurées, sans rien inventer : laisse vide ce qui n’est pas indiqué.',
        messages:[{role:'user',content}]})});
  }catch(e){throw new Error('Impossible de joindre le service (connexion ?).');}
  const data=await res.json().catch(()=>({}));
  if(!res.ok){
    if(res.status===401)throw new Error('Clé API refusée : vérifiez-la dans Réglages.');
    if(res.status===429)throw new Error('Trop de demandes, réessayez dans une minute.');
    if(res.status===400&&/credit/i.test(data?.error?.message||''))throw new Error('Crédit Anthropic épuisé : rechargez le compte sur console.anthropic.com.');
    throw new Error('Erreur du service ('+res.status+') : '+(data?.error?.message||''));
  }
  if(data.stop_reason==='refusal')throw new Error('La demande a été refusée par le service.');
  if(data.stop_reason==='max_tokens')throw new Error('Réponse trop longue : essayez avec moins de pages à la fois.');
  const txt=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
  try{return JSON.parse(txt);}catch(e){throw new Error('Réponse illisible, réessayez.');}
}

/* Convertit une proposition de l'IA (ou du lecteur local) en rendez-vous de l'appli */
function fromAI(x,fallbackDate){
  const ok=s=>/^\d{4}-\d{2}-\d{2}$/.test(s||'');
  const tm=/^\d{1,2}:\d{2}$/.test(x.time||'')?x.time.padStart(5,'0'):'';
  const known=new Map(svcList().map(s=>[norm(s),s]));
  return {date:ok(x.date)?x.date:fallbackDate,time:tm,duration:x.duration_min>0?x.duration_min:60,
    client:(x.client||'').trim(),phone:(x.phone||'').trim(),dog:(x.dog||'').trim(),breed:(x.breed||'').trim(),
    services:[...new Set((x.services||[]).map(s=>known.get(norm(s))||s.trim()).filter(Boolean))],
    details:(x.details||'').trim(),price:(x.price==null||isNaN(x.price))?'':+x.price,notes:(x.notes||'').trim(),
    uncertain:(x.uncertain||'').trim(),dateGuessed:!ok(x.date),...(PAY[x.pay]?{pay:x.pay,done:true}:{})};
}

/* Image → JPEG base64 redimensionné (≤1568 px) */
function shrinkImage(file){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file);const img=new Image();
    img.onload=()=>{const max=1568;let w=img.naturalWidth,h=img.naturalHeight;const r=Math.min(1,max/Math.max(w,h));w=Math.round(w*r);h=Math.round(h*r);
      const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg',0.85));};
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Image illisible'));};
    img.src=url;
  });
}

/* ---------- Lecture du texte des photos sur le téléphone (Tesseract, hors ligne) ---------- */
let ocrWorker=null;
function loadScript(src){return new Promise((res,rej)=>{if(window.Tesseract)return res();const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Lecture indisponible (chargement impossible)'));document.head.appendChild(s);});}
async function ocrImage(dataUrl,onStatus){
  if(!ocrWorker){
    onStatus&&onStatus('Préparation de la lecture… (la première fois, environ 4 Mo à télécharger)');
    await loadScript('lib/ocr/tesseract.min.js');
    ocrWorker=await Tesseract.createWorker('fra',1,{workerPath:'lib/ocr/worker.min.js',corePath:'lib/ocr/',langPath:'lib/ocr/',gzip:true});
  }
  const r=await ocrWorker.recognize(dataUrl);
  return (r.data.text||'').replace(/\n{2,}/g,'\n').trim();
}
const MONTHS=['janvier','fevrier','mars','avril','mai','juin','juillet','aout','septembre','octobre','novembre','decembre'];
const WDAYS=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
const HAS_TIME=/\b\d{1,2}\s*(?:h|:)\s*\d{0,2}\b/i;
/* Ligne d'en-tête de jour : « Lundi 16 », « 16 novembre », « 16/11 », « Mardi » */
function headerDate(line,ref,prev){
  const t=norm(line);if(HAS_TIME.test(t)&&!/^\s*(lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche)\b/.test(t))return null;
  const R=parse(ref);
  const near=(y,m,d)=>{let dt=new Date(y,m,d);if(iso(dt)<addDays(ref,-200))dt=new Date(y+1,m,d);return iso(dt);};
  let m=t.match(new RegExp('\\b(\\d{1,2}|1er)\\s*('+MONTHS.join('|')+')(?:\\s+(\\d{4}))?'));
  if(m){const d=m[1]==='1er'?1:+m[1];return m[3]?iso(new Date(+m[3],MONTHS.indexOf(m[2]),d)):near(R.getFullYear(),MONTHS.indexOf(m[2]),d);}
  m=t.match(/\b(\d{1,2})\s*[\/.]\s*(\d{1,2})(?:\s*[\/.]\s*(\d{2,4}))?\b/);
  if(m&&+m[2]>=1&&+m[2]<=12&&!HAS_TIME.test(t)){const y=m[3]?(+m[3]<100?2000+ +m[3]:+m[3]):null;return y?iso(new Date(y,+m[2]-1,+m[1])):near(R.getFullYear(),+m[2]-1,+m[1]);}
  m=t.match(/^\s*(lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche)\b\s*(\d{1,2})?\b/);
  if(m){
    if(m[2]){const d=+m[2];let best=null;for(const k of [-1,0,1]){const dt=new Date(R.getFullYear(),R.getMonth()+k,d);if(dt.getDate()!==d)continue;const x=iso(dt);if(!best||Math.abs(parse(x)-R)<Math.abs(parse(best)-R))best=x;}return best;}
    const target=WDAYS.indexOf(m[1]);
    if(prev){let x=addDays(prev,1);for(let i=0;i<7&&parse(x).getDay()!==target;i++)x=addDays(x,1);return x;}
    const monday=addDays(ref,-((R.getDay()+6)%7));return addDays(monday,(target+6)%7);
  }
  return null;
}
/* Texte d'une page d'agenda → rendez-vous */
function parseAgendaText(text,hint){
  const ref=hint||today();let cur=hint||today();let prev=null;const out=[];let last=null;
  for(const line0 of text.split('\n')){const line=line0.trim();if(!line)continue;
    const hd=headerDate(line,ref,prev);
    if(hd&&!HAS_TIME.test(norm(line).replace(/^\s*\w+\s+\d{1,2}\b/,''))){cur=prev=hd;last=null;
      const rest=line.replace(/^\s*\S+\s+\d{1,2}\b\s*/,'');if(HAS_TIME.test(rest)){last=parseDictation(rest,cur,{agenda:true});out.push(last);}
      continue;}
    if(HAS_TIME.test(line)){last=parseDictation(line,cur,{agenda:true});out.push(last);continue;}
    if(last){// ligne de suite : compléter le rendez-vous précédent
      const more=parseDictation(last.details.replace(/^Noté : /,'')+' '+line,cur,{agenda:true});
      for(const k of ['client','phone','dog','breed'])if(!last[k]&&more[k])last[k]=more[k];
      last.services=[...new Set([...last.services,...more.services])];if(last.price===''&&more.price!=='')last.price=more.price;
      if(!last.notes&&more.notes)last.notes=more.notes;
      last.details=last.details+' / '+line;}
  }
  return out;
}
/* Texte d'une fiche client papier → fiche */
function parseClientText(text){
  const c={name:'',phone:'',email:'',address:'',notes:'',dogs:[],visits:[],uncertain:''};
  const dog={name:'',breed:'',notes:''};const notes=[];const dogNotes=[];
  const lab=(l,re)=>{const m=l.match(new RegExp('^\\s*(?:'+re+')\\s*[:.\\-]?\\s*(.*)$','i'));return m?m[1].trim():null;};
  const breeds=[...new Set([...BREEDS,...S.appts.map(a=>a.breed).filter(Boolean)])].sort((a,b)=>b.length-a.length);
  const known=new Map(svcList().map(x=>[norm(x),x]));
  for(const line0 of text.split('\n')){const l=line0.trim();if(!l||/^fiche\s*(client)?$/i.test(norm(l)))continue;let v;
    const em=l.match(/[\w.+-]+@[\w-]+\.[\w.]+/);if(em&&!c.email){c.email=em[0];if(l.replace(em[0],'').replace(/e-?mail|courriel|:/gi,'').trim().length<3)continue;}
    const ph=l.replace(/[.\-]/g,' ').match(/(?:\+33\s?|0)\s?[1-9](?:\s?\d{2}){4}/);
    const dv=l.match(/^\s*(\d{1,2})\s*[\/.]\s*(\d{1,2})\s*[\/.]?\s*(\d{2,4})?\b(.*)$/);
    if(dv&&!ph){const y=dv[3]?(+dv[3]<100?2000+ +dv[3]:+dv[3]):parse(today()).getFullYear();
      const rest=dv[4]||'';const pd=parseDictation(rest,today(),{agenda:true});
      c.visits.push({date:iso(new Date(y,+dv[2]-1,+dv[1])),dog:'',services:pd.services,details:rest.trim(),price:pd.price===''?null:pd.price});continue;}
    if((v=lab(l,'nom du chien|chien(?:ne)?|animal|nom de l.animal'))!==null){if(v)dog.name=cap(v.split(/[,(]/)[0].trim());continue;}
    if((v=lab(l,'race'))!==null){if(v)dog.breed=cap(v);continue;}
    if((v=lab(l,'caract[eè]re|sant[eé]|allergies?|[aâ]ge|coupe|comportement|poids|n[eé]\\s*le|observations?\\s*chien'))!==null){dogNotes.push(l);continue;}
    if((v=lab(l,'t[eé]l[eé]?(?:phone)?|t[eé]l|portable|mobile|fixe'))!==null||ph){if(ph&&!c.phone)c.phone=ph[0].replace(/\s/g,'').replace(/(\d{2})(?=\d)/g,'$1 ').trim();if(!ph&&v)notes.push(l);continue;}
    if((v=lab(l,'adresse|adr'))!==null){c.address=[c.address,v].filter(Boolean).join(', ');continue;}
    if(/\b\d{5}\b/.test(l)||/\b(rue|avenue|av\.?|bd|boulevard|chemin|all[ée]e|impasse|place|route|lotissement|r[ée]sidence|quai)\b/i.test(l)){c.address=[c.address,l].filter(Boolean).join(', ');continue;}
    if((v=lab(l,'nom(?:\\s*du\\s*propri[eé]taire)?|propri[eé]taire|client(?:e)?|ma[iî]tre'))!==null){if(v)c.name=v;continue;}
    if(!c.name&&/^\s*(mme|m\.|mr|madame|monsieur|mlle)\b/i.test(l)){c.name=l;continue;}
    if((v=lab(l,'remarques?|notes?|observations?|infos?'))!==null){if(v)notes.push(v);continue;}
    const br=breeds.find(b=>norm(l).includes(norm(b)));if(br&&!dog.breed){dog.breed=br;const rest=l.replace(new RegExp(br,'i'),'').replace(/[:,\-]/g,' ').trim();if(rest&&!dog.name&&/^[A-ZÀ-Ý][\wà-ÿ'-]+$/.test(rest))dog.name=rest;continue;}
    if(!c.name&&/^[A-ZÀ-Ý][\wà-ÿ'-]+(\s+[A-ZÀ-Ý][\wà-ÿ'-]+)?$/.test(l)){c.name=l;continue;}
    notes.push(l);
  }
  c.name=c.name.replace(/\s+/g,' ').trim();
  const tt={madame:'Mme',mme:'Mme',mademoiselle:'Mlle',mlle:'Mlle',monsieur:'M.',mr:'M.','m.':'M.'};
  c.name=c.name.replace(/^(madame|mme|mademoiselle|mlle|monsieur|mr|m\.)\s*/i,(m,a)=>(tt[a.toLowerCase()]||a)+' ');
  dog.notes=dogNotes.join('\n');
  if(dog.name||dog.breed||dog.notes)c.dogs.push(dog);
  for(const v of c.visits){if(c.dogs.length===1)v.dog=c.dogs[0].name;v.services=v.services.map(x=>known.get(norm(x))||x);}
  c.notes=notes.join('\n');
  if(!c.name)c.uncertain='nom du client non trouvé';
  return c;
}

}
function mergeClients(found){
  const merged=[];
  for(const c of found){const m=merged.find(x=>norm(x.name)&&norm(x.name)===norm(c.name));
    if(m){m.phone=m.phone||c.phone;m.email=m.email||c.email;m.address=m.address||c.address;m.notes=[m.notes,c.notes].filter(Boolean).join('\n');
      for(const d of c.dogs)if(!m.dogs.some(x=>norm(x.name)===norm(d.name)))m.dogs.push(d);m.visits.push(...c.visits);m.scans=[...(m.scans||[]),...(c.scans||[])];m.uncertain=[m.uncertain,c.uncertain].filter(Boolean).join(' ; ');}
    else merged.push(c);}
  return merged;
}

async function voiceClient(text){

Dictée : « ${text} »`}],'medium',CLIENT_SCHEMA)).clients||[]).filter(c=>c.name||c.dogs.length);}

}
function parseClientDictation(text){
  const raw=text.trim();
  const c={name:'',phone:'',email:'',address:'',notes:'',dogs:[],visits:[],uncertain:''};
  let rest=raw;
  // E-mail dicté : « martin arobase gmail point com »
  const em=raw.replace(/\s*(?:arobase|arrobase|@)\s*/gi,'@').replace(/(@[\w-]+)\s*(?:point|\.)\s*(\w{2,4})\b/gi,'$1.$2').match(/[\w.+-]+@[\w-]+\.[\w.]+/);
  if(em){c.email=em[0].toLowerCase();rest=rest.replace(/\S+\s*(?:arobase|arrobase|@)\s*\S+(?:\s*(?:point|\.)\s*\w{2,4})?/i,' ');}
  // Adresse : « 12 rue Victor Hugo à Lyon », « 3 bis avenue … 69003 Lyon »
  const ad=raw.match(/\b\d{1,4}\s*(?:bis|ter)?\s*,?\s*(?:rue|avenue|av\.?|boulevard|bd|chemin|all[ée]e|impasse|place|route|quai|lotissement|r[ée]sidence)\b[^,.;]*?(?=(?:[,.;]|\s+(?:son|sa|ses|il|elle|le chien|la chienne|chien|t[ée]l|remarque|attention)\b|$))/i);
  if(ad){c.address=ad[0].replace(/\s+à\s+/i,' ').replace(/\s+/g,' ').trim();rest=rest.replace(ad[0],' ');}
  const d=parseDictation(rest.replace(/\b(?:elle|il)\s+habite\b/gi,' '),today(),{agenda:true,noKnown:true});
  c.name=splitCiv(d.client||'').nom;c.phone=d.phone||'';
  // Chiens : « Filou et Lola », sinon le chien trouvé
  const dogs=[];
  if(d.dog){dogs.push({name:d.dog,breed:d.breed||'',notes:''});
    const more=raw.match(new RegExp(d.dog.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\s+et\\s+([A-ZÀ-Ý][\\wà-ÿ\'-]+)'));if(more)dogs.push({name:more[1],breed:'',notes:''});}
  else if(d.breed)dogs.push({name:'',breed:d.breed,notes:''});
  // Âge du chien
  const age=raw.match(/\b(\d{1,2})\s*ans\b/i);
  if(age&&dogs[0])dogs[0].notes=age[1]+' ans';
  if(d.notes){if(dogs[0])dogs[0].notes=[dogs[0].notes,d.notes].filter(Boolean).join(', ');else c.notes=d.notes;}
  c.dogs=dogs;
  if(!c.name)c.uncertain='nom du client non reconnu';
  return c;
}
function stopRecog(hard){if(recog){const r=recog;recog=null;if(hard){r.onresult=null;try{r.abort();}catch(e){}}else{try{r.stop();}catch(e){}}const m=$('#mic');if(m){m.textContent='🎤';m.style.background='var(--accent)';}}}

/* Lecture simple (sans IA) d'une phrase dictée en français */
const NUMS={un:1,une:1,deux:2,trois:3,quatre:4,cinq:5,six:6,sept:7,huit:8,neuf:9,dix:10,onze:11,douze:12,treize:13,quatorze:14,quinze:15,seize:16,'dix-sept':17,'dix-huit':18,'dix-neuf':19,vingt:20,trente:30,quarante:40,cinquante:50,soixante:60};
const SYN={'griffe':'Coupe des griffes','ongle':'Coupe des griffes','tondre':'Tonte','tonte':'Tonte','tondu':'Tonte','shampo':'Bain','lavage':'Bain','laver':'Bain','bain':'Bain','ciseau':'Coupe ciseaux','coupe':'Coupe ciseaux','epil':'Épilation','trimming':'Épilation','demel':'Démêlage','noeud':'Démêlage','brush':'Brushing','sech':'Séchage','oreille':'Oreilles','yeux':'Yeux','puce':'Anti-puces','dent':'Dents'};
function parseDictation(text,defDate,opt={}){
  const raw=text.trim();
  let t=' '+norm(raw).replace(/[’']/g,"'")+' ';
  for(const[w,n]of Object.entries(NUMS).sort((x,y)=>y[0].length-x[0].length))t=t.replace(new RegExp('\\b'+w+'\\b','g'),String(n));
  const out={date:defDate,time:'',duration_min:0,client:'',phone:'',dog:'',breed:'',services:[],details:'',price:null,notes:'',uncertain:''};
  const T=today();
  // Date
  if(opt.agenda){}
  else if(/apres[- ]demain/.test(t))out.date=addDays(T,2);
  else if(/\bdemain\b/.test(t))out.date=addDays(T,1);
  else if(/aujourd'?hui|ce matin|cet apres-midi|ce soir/.test(t))out.date=T;
  else{
    const days=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
    const months=['janvier','fevrier','mars','avril','mai','juin','juillet','aout','septembre','octobre','novembre','decembre'];
    const m=t.match(new RegExp('\\b(\\d{1,2}|1er|premier)\\s+('+months.join('|')+')(?:\\s+(\\d{4}))?'));
    const m2=t.match(/\ble\s+(\d{1,2})\s*\/\s*(\d{1,2})(?:\s*\/\s*(\d{2,4}))?/);
    if(m){const d=/^(1er|premier)$/.test(m[1])?1:+m[1];const mo=months.indexOf(m[2]);let y=m[3]?+m[3]:parse(T).getFullYear();let dt=new Date(y,mo,d);if(!m[3]&&iso(dt)<addDays(T,-60))dt=new Date(y+1,mo,d);out.date=iso(dt);}
    else if(m2){let y=m2[3]?(+m2[3]<100?2000+ +m2[3]:+m2[3]):parse(T).getFullYear();out.date=iso(new Date(y,+m2[2]-1,+m2[1]));}
    else{const dm=t.match(new RegExp('\\b('+days.join('|')+')\\b'));
      if(dm){const target=days.indexOf(dm[1]);const cur=parse(T).getDay();let diff=(target-cur+7)%7;if(diff===0&&!/\bce\s/.test(t))diff=7;if(/prochain|suivant/.test(t))diff=diff||7;out.date=addDays(T,diff);}
      else{const dd=t.match(/\ble\s+(\d{1,2})\b(?!\s*(?:h|heure|euro|€|min))/);if(dd){const d=+dd[1];const x=parse(T);let dt=new Date(x.getFullYear(),x.getMonth(),d);if(iso(dt)<T)dt=new Date(x.getFullYear(),x.getMonth()+1,d);out.date=iso(dt);}}}
  }
  // Durée
  const du=t.match(/(?:duree|pendant|prevoir)\s*(?:de\s*)?(\d{1,2})\s*(?:h|heures?)\s*(\d{2}|et demie?)?|(?:duree|pendant|prevoir)\s*(?:de\s*)?(\d{2,3})\s*min/);
  if(du){t=t.replace(du[0],' ');out.duration_min=du[3]?+du[3]:(+du[1]*60+(/demi/.test(du[2]||'')?30:+(du[2]||0)));}
  // Heure
  const h=t.match(/\b(\d{1,2})\s*(?:heures?|h|:)\s*(\d{2}|et quart|et demie?|moins le quart)?/);
  if(h&&+h[1]<24){let H=+h[1],M=0;const x=h[2]||'';if(/^\d+$/.test(x))M=+x;else if(/quart/.test(x)&&/moins/.test(x)){H-=1;M=45;}else if(/quart/.test(x))M=15;else if(/demi/.test(x))M=30;
    if(H<8&&!/matin/.test(t))H+=12;out.time=pad(H)+':'+pad(M);}
  else if(/\bmidi\b/.test(t))out.time='12:00';
  // Prix
  const pr=t.match(/(\d+(?:[.,]\d{1,2})?)\s*(?:€|euros?)/);if(pr)out.price=+pr[1].replace(',','.');
  // Téléphone
  const ph=raw.replace(/[.\-]/g,' ').match(/(?:\+33\s?|0)\s?[1-9](?:\s?\d{2}){4}/);if(ph)out.phone=ph[0].replace(/\s/g,'').replace(/(\d{2})(?=\d)/g,'$1 ').trim();
  // Clients et chiens connus (pas pour la création d'une nouvelle fiche)
  const dir=opt.noKnown?[]:directory();
  for(const c of dir){for(const d of c.dogs.values()){if(d.name&&new RegExp('\\b'+norm(d.name).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b').test(t)){out.dog=d.name;if(!out.breed)out.breed=d.breed;if(!out.client){out.client=c.name;if(!out.phone)out.phone=c.phone;}}}}
  for(const c of dir){const n=norm(c.name).replace(/^(mme|mr|m\.|madame|monsieur)\s+/,'');if(n.length>2&&t.includes(' '+n)){out.client=c.name;if(!out.phone)out.phone=c.phone;}}
  if(!out.client){const cm=raw.match(opt.agenda?/\b(madame|monsieur|mademoiselle|mme|m\.|mr)\s+([A-Za-zÀ-ÿ'-]+)/i:/\b(madame|monsieur|mademoiselle|mme|m\.|mr)\s+([A-Za-zÀ-ÿ'-]+(?:\s+[A-ZÀ-Ý][A-Za-zÀ-ÿ'-]+)?)/i);
    if(cm){const tt={madame:'Mme',mme:'Mme',mademoiselle:'Mlle',monsieur:'M.','m.':'M.',mr:'M.'}[cm[1].toLowerCase()]||cm[1];out.client=tt+' '+cap(cm[2]);}
    else{const cc=raw.match(/\bclient(?:e)?\s*:?\s+([A-Za-zÀ-ÿ'-]+(?:\s+[A-Za-zÀ-ÿ'-]+)?)/i);if(cc)out.client=cap(cc[1]);}}
  if(!out.dog){const dm=raw.replace(/’/g,"'").match(/\b(?:chien(?:ne)?|toutou|chiot|s'appelle|nommée?|nom du chien\s*:?)\s+(?:s'appelle\s+|qui s'appelle\s+)?([A-Za-zÀ-ÿ-]+)/i);
    if(dm&&!/^(de|du|la|le|est|a|qui)$/i.test(dm[1]))out.dog=cap(dm[1]);}
  if(!out.dog&&opt.agenda){
    // Agenda : le premier mot en majuscule qui n'est ni le client, ni une race, ni une prestation est le chien
    const skip=new Set([...norm(out.client).split(/\s+/),'mme','mr','m','madame','monsieur','mlle','tel','rdv','son','sa','ses','il','elle','nouvelle','nouveau','client','cliente','chien','chienne','le','la','les','un','une','remarque','attention','telephone','adresse','mail','email','rue','avenue','boulevard','chemin','place','route','habite','lyon','paris']);
    const bad=w=>skip.has(norm(w))||BREEDS.some(b=>norm(b).split(' ').includes(norm(w)))||svcList().some(x=>norm(x).split(' ').includes(norm(w)))||Object.keys(SYN).some(k=>norm(w).startsWith(k));
    const words=raw.replace(/\b\d{1,2}\s*(?:h|:)\s*\d{0,2}\b/gi,' ').match(/[A-ZÀ-Ý][a-zà-ÿ'-]{1,}/g)||[];
    const w=words.find(x=>!bad(x));if(w)out.dog=w;}
  // Race
  const breeds=[...new Set([...BREEDS,...S.appts.map(a=>a.breed).filter(Boolean)])].sort((a,b)=>b.length-a.length);
  for(const b of breeds){if(t.includes(' '+norm(b))){out.breed=b;break;}}
  if(!out.breed){const AL={golden:'Golden retriever',labra:'Labrador',york:'Yorkshire',jack:'Jack Russell',cavalier:'Cavalier King Charles',bouledogue:'Bouledogue français',bouldog:'Bouledogue français',bichon:'Bichon',shih:'Shih Tzu',lhassa:'Lhassa Apso',spitz:'Spitz nain',chihua:'Chihuahua',westie:'Westie',caniche:'Caniche',cocker:'Cocker',husky:'Husky',teckel:'Teckel',border:'Border collie','berger australien':'Berger australien','berger allemand':'Berger allemand',aussie:'Berger australien',malinois:'Malinois',croise:'Croisé'};
    for(const[k,v]of Object.entries(AL))if(t.includes(' '+k)){out.breed=v;break;}}
  // Prestations
  const svcs=new Set();
  for(const s of svcList())if(t.includes(norm(s)))svcs.add(s);
  for(const[k,v]of Object.entries(SYN))if(t.includes(k)&&svcList().includes(v)&&!(v==='Coupe ciseaux'&&/griffe|ongle/.test(t)&&!/coupe\s+(au\s+)?ciseau|coupe\s+(de\s+)?poil|coupe\s+et/.test(t)))svcs.add(v);
  out.services=[...svcs];
  if(/\b(especes|liquide|cash|en liquide)\b/.test(t))out.pay='cash';else if(/\b(carte bleue|carte bancaire|par carte|en carte|cb)\b/.test(t))out.pay='card';
  // Remarques / détails
  const rm=raw.match(/\b(?:remarques?|attention|à noter|note)\s*:?\s*(.+)$/i);
  if(rm){out.notes=rm[1].trim();}
  const dt=raw.match(/\b(?:détails?|précisions?)\s*:?\s*(.+?)(?=\b(?:remarques?|attention|à noter)\b|$)/i);
  if(dt)out.details=dt[1].trim().replace(/[.,;]$/,'');
  else out.details=(opt.agenda?'Noté : ':'Dictée : ')+(rm?raw.slice(0,rm.index).trim():raw);
  out.uncertain='';
  return fromAI(out,defDate);
}
function cap(s){return String(s).replace(/(^|[\s-])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase());}

/* ---------- Mises à jour ---------- */
// Renvoie la nouvelle version si elle existe, false si à jour, null si impossible de vérifier
async function checkUpdate(install){
  if(!location.protocol.startsWith('http'))return false;
  let latest;
  try{const r=await fetch('index.html?v='+Date.now(),{cache:'no-store'});if(!r.ok)return null;
    const m=(await r.text()).match(/APP_VERSION='([^']+)'/);if(!m)return null;latest=m[1];}catch(e){return null;}
  if(latest===APP_VERSION)return false;
  if(install)installUpdate();else showUpdateBar(latest);
  return latest;
}
async function installUpdate(){
  try{const reg=await navigator.serviceWorker?.getRegistration();if(reg)await reg.update();}catch(e){}
  try{const ks=await caches.keys();await Promise.all(ks.filter(k=>k.startsWith('tg-')&&k!=='tg-lib').map(k=>caches.delete(k)));}catch(e){}
  location.replace(location.pathname+'?maj='+Date.now());
}
function showUpdateBar(v){
  if($('#upd-bar'))return;
  const d=document.createElement('div');d.className='upd-bar';d.id='upd-bar';d.setAttribute('role','status');
  d.innerHTML='<span>✨ Nouvelle version disponible</span><button>Mettre à jour</button>';
  d.querySelector('button').onclick=installUpdate;document.body.appendChild(d);
}
if(/[?&]maj=/.test(location.search))history.replaceState(null,'',location.pathname);
let lastUpdCheck=0;
function autoCheck(){if(Date.now()-lastUpdCheck<10*60*1000)return;lastUpdCheck=Date.now();checkUpdate(false);}
setTimeout(autoCheck,4000);
// Sur iPhone, l'appli reste souvent ouverte en arrière-plan : on vérifie aussi quand elle revient au premier plan
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')autoCheck();});
