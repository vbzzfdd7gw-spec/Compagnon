  <section class="card">
    <h2>Intensité</h2>
    <div class="presets">${Object.entries(PRESETS).map(([k,p])=>`<button data-a="preset" data-k="${k}" class="${curPreset&&curPreset[0]===k?"on":""}">${p.nom}<small>${p.d}</small></button>`).join("")}</div>
    <h2 style="margin-top:4px">Thèmes</h2>
    <div class="chips">${Object.entries(CATS).map(([k,c])=>`<button class="chip ${S.cats.includes(k)?"on":""}" style="--c:${c.c}" data-a="cat" data-k="${k}" aria-pressed="${S.cats.includes(k)}">${c.emo} ${c.nom} <span class="n">${Q[k].length}</span></button>`).join("")}</div>
  </section>
  <section class="card">
    <h2>Tes propres questions <span class="count">(${S.custom.length})</span></h2>
    <form class="row" data-f="custom"><input id="ctext" placeholder="Je n'ai jamais…" maxlength="160" autocomplete="off"><button class="btn" type="submit">+</button></form>
    ${S.custom.length?`<div class="custom-list">${S.custom.map((t,i)=>`<div><span>${esc(t)}</span><button class="chip" data-a="delc" data-i="${i}" aria-label="Supprimer">×</button></div>`).join("")}</div>`:`<p class="hint">Ajoutez vos private jokes : elles se mélangent au paquet.</p>`}
  </section>
  <button class="btn primary big" data-a="start" ${n?"":"disabled"}>${n?`Jouer · ${n} cartes`:"Choisis au moins un thème"}</button>
  ${S.deck.length && S.idx>=0 && S.idx<S.deck.length?`<button class="btn big" data-a="resume">Reprendre la partie (${S.idx+1}/${S.deck.length})</button>`:""}
  <div class="links">${S.players.length?`<button data-a="board">Classement</button>`:""}<button data-a="reset">Remettre les scores à zéro</button></div>`;
}
function playView(){
  const e = S.deck[S.idx];
  const k = cardInfo(e);
  const isBonus = k.cat==="bonus";
  const reader = S.players.length ? S.players[S.readerIdx % S.players.length] : null;
  return `
  <div class="top">
    <button class="btn sm" data-a="home">← Menu</button>
    <div class="meta count">Carte ${S.idx+1} / ${S.deck.length}</div>
  </div>
  ${reader?`<p class="reader">C'est à <b>${esc(reader)}</b> de lire 🎤</p>`:""}
  <article class="qcard ${anim?"anim":""}" style="--c:${k.c}" id="qcard" aria-live="polite">
    ${e.dbl?`<div class="double">×2 GORGÉES</div>`:""}
    <div class="qcat">${k.emo} ${esc(k.nom)}</div>
    <div>
      ${isBonus?"":`<div class="qlead">Je n'ai jamais…</div>`}
      <div class="qtext">${esc(k.text)}</div>
    </div>
    <p class="hint">${isBonus?"Appliquez la règle, puis carte suivante.":"Ceux qui l'ont fait : vous buvez"+(e.dbl?" double":"")+" 🍹"}</p>
  </article>
  ${S.players.length && !isBonus?`<section class="card who">
    <h2>Qui l'a déjà fait ?</h2>
    <div class="chips">${S.players.map((p,i)=>`<button class="chip ${marked.has(i)?"on":""}" data-a="mark" data-i="${i}" aria-pressed="${marked.has(i)}">${esc(p)}</button>`).join("")}</div>
  </section>`:""}
  <div class="navrow">
    <button class="btn big" style="width:auto;padding-inline:20px" data-a="prev" ${S.idx>0?"":"disabled"} aria-label="Carte précédente">←</button>
    <button class="btn primary big" data-a="next">Suivante →</button>
  </div>
  ${S.players.length?`<div class="links"><button data-a="board">Classement</button></div>`:""}`;
}
function boardView(){
  const rows = S.players.map(p=>({p, s:S.score[p]||0})).sort((a,b)=>b.s-a.s);
  const medals=["🥇","🥈","🥉"];
  return `
  <div class="top"><button class="btn sm" data-a="back">← Retour</button><div class="meta">Aveux cumulés</div></div>
  <h1>Le <span>classement</span></h1>
  <p class="sub">Le plus d'aveux = la personne la plus… expérimentée 😏</p>
  <div class="board">${rows.map((r,i)=>`<div class="brow ${i===0&&r.s>0?"first":""}"><span class="rk">${medals[i]||i+1}</span><span>${esc(r.p)}</span><span class="sc">${r.s}</span></div>`).join("")}</div>`;
}

/* ---------- Actions ---------- */
let prevView="home";
function commitMarks(){
  const e=S.deck[S.idx]; if(!e) return;
  const pts = e.dbl?2:1;
  marked.forEach(i=>{ const p=S.players[i]; if(p) S.score[p]=(S.score[p]||0)+pts; });
  marked.clear();
}
function next(){
  commitMarks();
  S.readerIdx++;
  if(S.idx < S.deck.length-1){ S.idx++; }
  else { newDeck(); toast("Paquet terminé — on remélange ! 🔀"); }
  anim=true; save(); render(); anim=false; window.scrollTo({top:0});
}
document.addEventListener("click", ev=>{
  const b = ev.target.closest("[data-a]"); if(!b) return;
  const a=b.dataset.a;
  if(a==="adult"){ S.adult=true; }
  else if(a==="delp"){ const p=S.players.splice(+b.dataset.i,1)[0]; delete S.score[p]; }
  else if(a==="delc"){ S.custom.splice(+b.dataset.i,1); S.deck=[]; S.idx=-1; }
  else if(a==="preset"){ S.cats=PRESETS[b.dataset.k].cats.slice(); }
  else if(a==="cat"){ const k=b.dataset.k; S.cats = S.cats.includes(k)? S.cats.filter(c=>c!==k) : [...S.cats,k]; }
  else if(a==="start"){ newDeck(); S.readerIdx=0; marked.clear(); S.view="play"; anim=true; }
  else if(a==="resume"){ S.view="play"; }
  else if(a==="home"){ commitMarks(); S.view="home"; }
  else if(a==="next"){ return next(); }
  else if(a==="prev"){ marked.clear(); if(S.idx>0){S.idx--; S.readerIdx=Math.max(0,S.readerIdx-1);} }
  else if(a==="mark"){ const i=+b.dataset.i; marked.has(i)?marked.delete(i):marked.add(i); }
  else if(a==="board"){ commitMarksIfPlaying(); prevView=S.view; S.view="board"; }
  else if(a==="back"){ S.view=prevView==="board"?"home":prevView; }
  else if(a==="reset"){ if(confirm("Remettre tous les scores à zéro ?")){ S.score={}; toast("Scores remis à zéro"); } }
  save(); render(); anim=false;
});
function commitMarksIfPlaying(){ if(S.view==="play") commitMarks(); }
document.addEventListener("submit", ev=>{
  ev.preventDefault();
  const f=ev.target.dataset.f;
  if(f==="player"){
    const v=$("#pname").value.trim(); if(!v) return;
    if(S.players.includes(v)) return toast("Ce prénom est déjà là");
    S.players.push(v);
  } else if(f==="custom"){
    let v=$("#ctext").value.trim().replace(/^je n['’]ai jamais\s*(…|\.\.\.)?\s*/i,""); if(!v) return;
    S.custom.push(v); S.deck=[]; S.idx=-1; toast("Question ajoutée ✍️");
  }
  save(); render();
  const inp = f==="player"?$("#pname"):$("#ctext"); if(inp) inp.focus();
});
/* Swipe gauche = carte suivante */
let sx=null, sy=null;
document.addEventListener("touchstart", e=>{ if(e.target.closest("#qcard")){ sx=e.touches[0].clientX; sy=e.touches[0].clientY; } else sx=null; }, {passive:true});
document.addEventListener("touchend", e=>{
  if(sx===null) return;
  const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy; sx=null;
  if(dx<-60 && Math.abs(dy)<60) next();
}, {passive:true});
document.addEventListener("keydown", e=>{ if(S.view==="play" && (e.key==="ArrowRight"||e.key===" ") && e.target.tagName!=="INPUT"){ e.preventDefault(); next(); } });

if(S.view==="play" && !(S.deck[S.idx])) S.view="home";
render();
</script>
</body></html>
