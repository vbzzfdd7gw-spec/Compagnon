<style>
:root{
  --bg:#0c0b0f;--panel:#16141b;--panel2:#211e28;--line:#34303d;
  --fg:#f4f1f2;--muted:#a49daf;--red:#e0263c;--red-ink:#fff;--soft:#ff6b7c;
  --good:#5fcf8f;--warn:#f2b75b;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:inherit}
a{color:var(--soft)}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
label{display:grid;gap:5px;font-size:.82rem;color:var(--muted)}
.wrap{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 96px) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px}
header.top{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;flex:none}
h1{font-size:1.35rem;margin:0;line-height:1.1;letter-spacing:.01em}
h1 b{color:var(--red)}
h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:6px 0 0;font-weight:700}
h3{margin:0;font-size:1.05rem}
.sub{color:var(--muted);font-size:.88rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0;display:grid;gap:10px}
.list{display:grid;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 13px;font-weight:600;white-space:nowrap;text-decoration:none;color:var(--fg);font-size:.92rem}
.btn.primary{background:var(--red);border-color:var(--red);color:var(--red-ink)}
.btn.sm{padding:6px 10px;font-size:.84rem;border-radius:8px}
.btn.on{border-color:var(--red);color:var(--soft)}
.btn.danger{color:var(--soft)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.tag{display:inline-block;font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:2px 8px;font-weight:700;white-space:nowrap}
.tag.red{border-color:var(--red);color:var(--soft)}
.tag.good{border-color:color-mix(in srgb,var(--good) 60%,var(--line));color:var(--good)}
.tag.warn{border-color:color-mix(in srgb,var(--warn) 60%,var(--line));color:var(--warn)}
.empty{color:var(--muted);text-align:center;padding:22px 8px}
.hint{font-size:.82rem;color:var(--muted)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{padding:8px 4px;border-radius:9px;font-weight:700;font-size:.88rem;color:var(--muted);text-align:center}
.seg button.on{background:var(--fg);color:var(--bg)}

/* hero countdown */
.hero{background:linear-gradient(135deg,#2a0b12,#16141b 65%);border:1px solid color-mix(in srgb,var(--red) 45%,var(--line));border-radius:18px;padding:16px;display:grid;gap:8px}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.cd div{background:rgba(0,0,0,.35);border-radius:10px;padding:8px 2px}
.cd b{display:block;font-family:var(--f-mono);font-size:1.5rem;font-variant-numeric:tabular-nums}
.cd span{font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}

/* concerts */
.gig{display:grid;grid-template-columns:58px 1fr;gap:12px}
.date{background:var(--panel2);border-radius:12px;text-align:center;padding:7px 2px;align-self:start}
.date .d{font-size:1.45rem;font-weight:800;line-height:1}
.date .m{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--soft);font-weight:700}
.date .y{font-size:.68rem;color:var(--muted)}
.gig.past{opacity:.6}
.prices{display:grid;gap:4px;font-size:.9rem}
.prices div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding-bottom:3px}
.prices b{font-family:var(--f-mono);white-space:nowrap}
details>summary{cursor:pointer;color:var(--muted);font-size:.88rem;font-weight:600;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸ "}
details[open]>summary::before{content:"▾ "}

/* socials */
.mem{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:start}
.av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:1.1rem;color:#fff}
.links{display:flex;flex-wrap:wrap;gap:6px}
.links a{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--fg);text-decoration:none;font-size:.86rem;font-weight:600}
.links a i{font-style:normal;width:8px;height:8px;border-radius:50%;background:var(--c,var(--red))}

/* news */
.news{display:grid;grid-template-columns:auto 1fr;gap:10px}
.news .nd{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);white-space:nowrap;padding-top:2px}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs div{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
nav.tabs button{display:grid;justify-items:center;gap:2px;padding:6px 2px;border-radius:10px;color:var(--muted);font-size:.7rem;font-weight:700}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--soft);background:var(--panel)}

/* modal */
dialog{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:18px;padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 40px)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog form{padding:16px;display:grid;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.total{font-family:var(--f-mono);font-size:1.6rem;font-weight:800}
.warnbox{border:1px solid color-mix(in srgb,var(--warn) 50%,var(--line));background:color-mix(in srgb,var(--warn) 8%,var(--panel));border-radius:14px;padding:12px;font-size:.88rem;display:grid;gap:4px}
</style>

const slug = s => String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-');
function mergeLive(list){
  for(const e of (LIVE.events||[])){
    const offers=(e.offers||[]).map(o=>({l:o.l||'Billets',u:o.u}));
    const near=c=>Math.abs((pd(c.date)-pd(e.date))/864e5)<=4&&slug(c.city).slice(0,4)===slug(e.city).slice(0,4);
    const base=list.find(c=>c.date===e.date)||list.find(near);
    if(base){
      base.live=true; if(e.soldOut) base.soldOut=true;
      const have=new Set((base.tickets||[]).map(t=>t.u));
      base.tickets=[...(base.tickets||[]),...offers.filter(o=>!have.has(o.u))];
    }else{
      const id='auto-'+e.date+'-'+slug(e.city);
      if(S.hidden.includes(id)) continue;
      const ec=String(e.country||'').replace(/\*/g,'').trim();const [cn,fl]=COUNTRY[ec]||[ec,''];
      list.push({id,date:e.date,city:e.city||'?',country:cn,flag:fl,venue:e.venue||e.title||'—',tour:'Nouvelles dates',type:e.festival?'Festival':'Concert',prices:[],
        tickets:[...offers,...(e.url?[{l:'Bandsintown',u:e.url}]:[])],note:(e.title?e.title+'. ':'')+'Date ajoutée automatiquement depuis '+(LIVE.eventsSource||'l’agenda officiel')+'.',auto:true,live:true,soldOut:e.soldOut,...(S.edits[id]||{})});
    }
  }
  return list;
}

const MOIS=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const pd = s => {const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const fmtD = s => {const d=pd(s);return d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});};
const todayStr = () => {const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const isPast = c => c.date < todayStr();
const ago = iso => {const m=Math.round((Date.now()-new Date(iso))/6e4);return m<60?'il y a '+Math.max(1,m)+' min':m<1440?'il y a '+Math.round(m/60)+' h':'le '+new Date(iso).toLocaleDateString('fr-FR',{day:'numeric',month:'short'});};
const daysTo = s => Math.round((pd(s)-pd(todayStr()))/864e5);
const uid = () => 'u'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

  const [y,m,d]=el.dataset.date.split('-').map(Number);

     <div class="between"><div><h3>${esc(m.name)}</h3><div class="sub">${esc(m.role)}</div></div><button class="btn sm" data-edithandles="${m.id}">Modifier</button></div>
     <div class="links">${links.join('')}${extra.join('')}</div>${m.note&&!m.h.ig?`<div class="hint">${esc(m.note)}</div>`:''}</div></article>`;}).join('')}
   <article class="card"><h3>Les jumeaux Kaulitz</h3><div class="sub">Bill &amp; Tom en dehors du groupe</div><div class="links">${TWINS.map(x=>`<a href="${esc(x.u)}" target="_blank" rel="noopener" style="--c:${x.c}"><i></i>${esc(x.l)}</a>`).join('')}</div></article>
  </div>`;
}

function viewPlan(){
  const all=concerts(); const ids=Object.keys(S.plan).filter(id=>S.plan[id]&&S.plan[id].status);
  const mine=all.filter(c=>ids.includes(c.id));
  const go=mine.filter(c=>S.plan[c.id].status==='go');
  const sum=k=>go.reduce((a,c)=>a+(+S.plan[c.id][k]||0),0);
  const tot=sum('ticket')+sum('pack')+sum('travel');
  return `<div class="card"><h2 style="margin:0">Mon budget concerts</h2><div class="total">${eur(tot)}</div>
    <div class="prices"><div><span>Billets</span><b>${eur(sum('ticket'))}</b></div><div><span>Packs VIP</span><b>${eur(sum('pack'))}</b></div><div><span>Voyage &amp; hôtel</span><b>${eur(sum('travel'))}</b></div></div>
    <div class="hint">Compte uniquement les concerts marqués « J’y vais ».</div></div>
  ${mine.length?`<div class="list">${mine.map(c=>{const p=S.plan[c.id];return `<article class="card"><div class="between"><div><h3>${c.flag||''} ${esc(c.city)} — ${pd(c.date).getDate()} ${MOIS[pd(c.date).getMonth()]} ${c.date.slice(0,4)}</h3><div class="sub">${esc(c.venue)}</div></div><span class="tag ${p.status==='go'?'red':''}">${p.status==='go'?'J’y vais':'Favori'}</span></div>
    ${p.status==='go'?`<div class="prices"><div><span>Billet</span><b>${eur(+p.ticket||0)}</b></div><div><span>Pack</span><b>${eur(+p.pack||0)}</b></div><div><span>Voyage</span><b>${eur(+p.travel||0)}</b></div></div>`:''}
    ${p.note?`<div class="hint">📝 ${esc(p.note)}</div>`:''}
    <div class="row"><button class="btn sm" data-planedit="${c.id}">Modifier</button><button class="btn sm" data-open="${c.id}">Concert</button>${isPast(c)?'':`<span class="tag">J-${daysTo(c.date)}</span>`}</div></article>`;}).join('')}</div>`
   :'<div class="empty">Touche ♡ sur un concert pour l’ajouter à ton plan, puis « J’y vais » pour suivre ton budget.</div>'}
  <h2>Notifications sur ton téléphone</h2>
  <div class="card"><div class="sub">Reçois une alerte pour chaque <b>nouvelle date</b>, <b>ouverture de billetterie</b>, concert <b>complet</b> ou <b>annulé</b>, et pour les <b>nouvelles actus</b> (titres en français). Vérification 4 fois par jour, jamais la nuit.</div>
   <div class="prices"><div><span>1. Installe l’app gratuite <b>ntfy</b></span></div><div><span>2. Touche <b>+</b> et abonne-toi au sujet :</span></div></div>
   <div class="row"><code style="font-family:var(--f-mono);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;user-select:all">${NTFY_TOPIC}</code><button class="btn sm" id="copyTopic">Copier</button></div>
   <div class="row"><a class="btn sm primary" href="https://apps.apple.com/app/ntfy/id1625396347" target="_blank" rel="noopener">ntfy pour iPhone ↗</a><a class="btn sm primary" href="https://play.google.com/store/apps/details?id=io.heckel.ntfy" target="_blank" rel="noopener">ntfy pour Android ↗</a><a class="btn sm" href="https://ntfy.sh/${NTFY_TOPIC}" target="_blank" rel="noopener">Voir dans le navigateur ↗</a></div>
   <div class="hint">Laisse le serveur par défaut (ntfy.sh) et autorise les notifications quand l’app le demande.</div></div>
  <h2>Sauvegarde</h2><div class="row"><button class="btn sm" id="exp">Exporter mes données</button><label class="btn sm" style="display:inline-flex;color:var(--fg);font-size:.84rem">Importer<input type="file" id="imp" accept="application/json" hidden></label></div>`;
}

const VIEWS={home:viewHome,gigs:viewGigs,vip:viewVip,social:viewSocial,plan:viewPlan};
function render(){
  renderTabs();
  $('#view').innerHTML=`<div style="display:grid;gap:14px">${VIEWS[S.tab]()}</div>`;
  const n=nextConcert(); $('#topSub').textContent=n?`Prochain concert : ${n.city}, J-${daysTo(n.date)}`:'Actus, réseaux, concerts & VIP';
  tickCountdown();
}
setInterval(tickCountdown,1000);

/* ====================== Dialogues ====================== */
const dlg=$('#dlg'), F=$('#dlgForm');
function openDlg(html,onSubmit){
  F.innerHTML=html; dlg.showModal();
  F.onsubmit=e=>{const btn=e.submitter; if(btn&&btn.value==='cancel')return; if(onSubmit){const r=onSubmit(new FormData(F),btn&&btn.value);if(r===false){e.preventDefault();return;}} save(); render();};
}
const actions=(extra='')=>`<div class="row" style="justify-content:flex-end">${extra}<button class="btn" value="cancel" formnovalidate>Annuler</button><button class="btn primary" value="ok">Enregistrer</button></div>`;

function openConcert(id){
  const c=concerts().find(x=>x.id===id); if(!c) return;
  const p=S.plan[c.id]||{};
  F.innerHTML=`<div class="between"><div><h3>${c.flag||''} ${esc(c.city)}</h3><div class="sub">${esc(fmtD(c.date))}</div></div><button class="btn sm" value="cancel">✕</button></div>
   <div class="sub">📍 ${esc(c.venue)} — ${esc(c.country)}</div>
   <div class="row"><span class="tag">${esc(c.tour)}</span><span class="tag">${esc(c.type)}</span></div>
   ${c.prices&&c.prices.length?`<h2>Prix des places</h2>`:'<div class="hint">Prix pas encore relevés pour cette date : vérifie sur la billetterie.</div>'}
   ${gigDetails(c)}
   <h2>Réserver</h2>
   <div class="row">${(c.tickets||[]).map(t=>`<a class="btn sm primary" href="${esc(t.u)}" target="_blank" rel="noopener">🎟 ${esc(t.l)} ↗</a>`).join('')}<a class="btn sm" href="${ticketSearch(c)}" target="_blank" rel="noopener">Chercher d’autres billetteries ↗</a><a class="btn sm" href="${TREEHOUSE}" target="_blank" rel="noopener">Packs VIP ↗</a></div>
   <h2>Pratique</h2>
   <div class="row"><a class="btn sm" href="${mapUrl(c)}" target="_blank" rel="noopener">🗺 Itinéraire</a><button class="btn sm" value="ics">📅 Ajouter au calendrier</button><button class="btn sm" value="share">↗ Partager</button></div>
   <h2>Mon plan</h2>
   <div class="row"><button class="btn sm ${p.status==='fav'?'on':''}" value="fav">♥ Favori</button><button class="btn sm ${p.status==='go'?'on':''}" value="go">✔ J’y vais</button>${p.status?'<button class="btn sm" value="none">Retirer</button>':''}<button class="btn sm" value="plan">Budget &amp; notes</button></div>
   <div class="row" style="justify-content:space-between;border-top:1px solid var(--line);padding-top:10px"><button class="btn sm" value="edit">✎ Modifier ce concert</button><button class="btn sm danger" value="del">Supprimer</button></div>`;
  dlg.showModal();
  F.onsubmit=e=>{const v=e.submitter&&e.submitter.value;
    if(v==='ics'){e.preventDefault();downloadIcs(c);return;}
    if(v==='share'){e.preventDefault();shareGig(c);return;}
    if(v==='fav'||v==='go'){S.plan[c.id]={...(S.plan[c.id]||{}),status:v};}
    if(v==='none'){delete S.plan[c.id];}
    if(v==='plan'){setTimeout(()=>editPlan(c.id),0);}
    if(v==='edit'){setTimeout(()=>editConcert(c.id),0);}
    if(v==='del'){if(!confirm('Supprimer ce concert de la liste ?')){e.preventDefault();return;}
      if(S.extraConcerts.some(x=>x.id===c.id))S.extraConcerts=S.extraConcerts.filter(x=>x.id!==c.id);else S.hidden.push(c.id);delete S.plan[c.id];}
    save();render();};
}

function pricesToText(ps){return (ps||[]).map(x=>`${x.c} : ${x.p}`).join('\n');}
function textToPrices(t){return t.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const m=l.match(/^(.*?)[\s:=-]+([\d\s.,]+)\s*€?$/);return m?{c:m[1].trim()||'Tarif',p:parseFloat(m[2].replace(/\s/g,'').replace(',','.'))}:null;}).filter(x=>x&&!isNaN(x.p));}
function linksToText(ls){return (ls||[]).map(x=>`${x.l} | ${x.u}`).join('\n');}
function textToLinks(t){return t.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const [a,b]=l.includes('|')?l.split('|').map(s=>s.trim()):['Billetterie',l];return /^https?:\/\//.test(b)?{l:a||'Billetterie',u:b}:null;}).filter(Boolean);}

function editConcert(id){
  const c=id?concerts().find(x=>x.id===id):{date:todayStr(),city:'',country:'',flag:'',venue:'',tour:'Summer Encore 2027',type:'Concert',prices:[],tickets:[],note:''};
  openDlg(`<h3>${id?'Modifier le concert':'Ajouter un concert'}</h3>
   <div class="grid2"><label>Date<input type="date" name="date" required value="${esc(c.date)}"></label><label>Type<input name="type" value="${esc(c.type)}" placeholder="Concert, Festival…"></label></div>
   <div class="grid2"><label>Ville<input name="city" required value="${esc(c.city)}"></label><label>Pays<input name="country" value="${esc(c.country)}"></label></div>
   <label>Salle / lieu<input name="venue" value="${esc(c.venue)}"></label>
   <div class="grid2"><label>Tournée<input name="tour" value="${esc(c.tour)}"></label><label>Drapeau (emoji)<input name="flag" value="${esc(c.flag)}" placeholder="🇫🇷"></label></div>
   <label>Prix (une catégorie par ligne : « Fosse : 66,40 »)<textarea name="prices">${esc(pricesToText(c.prices))}</textarea></label>
   <label>Liens de réservation (« Nom | https://… » par ligne)<textarea name="tickets">${esc(linksToText(c.tickets))}</textarea></label>
   <label>Note<input name="note" value="${esc(c.note||'')}"></label>
   ${actions()}`,fd=>{
    const o={date:fd.get('date'),type:fd.get('type').trim()||'Concert',city:fd.get('city').trim(),country:fd.get('country').trim(),venue:fd.get('venue').trim()||'—',tour:fd.get('tour').trim()||'Autre',flag:fd.get('flag').trim(),prices:textToPrices(fd.get('prices')),tickets:textToLinks(fd.get('tickets')),note:fd.get('note').trim()};
    if(!id){S.extraConcerts.push({id:uid(),...o});}
    else if(S.extraConcerts.some(x=>x.id===id)){S.extraConcerts=S.extraConcerts.map(x=>x.id===id?{...x,...o}:x);}
    else S.edits[id]=o;
  });
}
function editPlan(id){
  const c=concerts().find(x=>x.id===id); const p=S.plan[id]||{status:'go'};
  openDlg(`<h3>Mon plan — ${esc(c.city)}</h3>
   <label>Statut<select name="status"><option value="go" ${p.status==='go'?'selected':''}>J’y vais</option><option value="fav" ${p.status==='fav'?'selected':''}>Favori</option></select></label>
   <div class="grid2"><label>Prix de mon billet (€)<input name="ticket" inputmode="decimal" value="${esc(p.ticket||'')}"></label><label>Pack VIP (€)<input name="pack" inputmode="decimal" value="${esc(p.pack||'')}"></label></div>
   <label>Voyage &amp; hôtel (€)<input name="travel" inputmode="decimal" value="${esc(p.travel||'')}"></label>
   <label>Notes (place, numéro de commande, train…)<textarea name="note">${esc(p.note||'')}</textarea></label>${actions()}`,fd=>{
    const n=k=>{const v=parseFloat(String(fd.get(k)).replace(',','.'));return isNaN(v)?'':v;};
    S.plan[id]={status:fd.get('status'),ticket:n('ticket'),pack:n('pack'),travel:n('travel'),note:fd.get('note').trim()};
  });
}
function addNews(){
  openDlg(`<h3>Ajouter une actu</h3><label>Date<input type="date" name="d" required value="${todayStr()}"></label><label>Titre<input name="t" required></label><label>Détails<textarea name="x"></textarea></label><label>Lien (facultatif)<input name="u" type="url" placeholder="https://"></label>${actions()}`,
   fd=>{S.extraNews.push({id:uid(),d:fd.get('d'),t:fd.get('t').trim(),x:fd.get('x').trim(),u:fd.get('u').trim()});});
}
function addPack(){
  openDlg(`<h3>Ajouter un pack VIP</h3><label>Nom<input name="name" required placeholder="Meet & Greet Berlin"></label><div class="grid2"><label>Vendeur<input name="seller"></label><label>Prix (€)<input name="price" inputmode="decimal"></label></div>
   <label>Inclus (une ligne par avantage)<textarea name="incl"></textarea></label><label>Lien<input name="url" type="url" placeholder="https://"></label><label>Statut / remarque<input name="status" placeholder="Disponible, complet…"></label>
   <label style="display:flex;gap:8px;align-items:center;color:var(--fg)"><input type="checkbox" name="m" style="width:auto"> Inclut une rencontre avec le groupe</label>${actions()}`,
   fd=>{const pr=parseFloat(String(fd.get('price')).replace(',','.'));S.extraPacks.push({id:uid(),name:fd.get('name').trim(),seller:fd.get('seller').trim(),price:isNaN(pr)?null:pr,incl:fd.get('incl').split('\n').map(s=>s.trim()).filter(Boolean),excl:[],url:fd.get('url').trim(),status:fd.get('status').trim(),m:!!fd.get('m')});});
}
function editHandles(id){
  const m=members().find(x=>x.id===id);
  openDlg(`<h3>Comptes de ${esc(m.name)}</h3><p class="hint">Indique seulement le pseudo, sans @ (laisser vide pour masquer).</p>
   ${Object.entries(PLAT).map(([k,pl])=>`<label>${pl.n}<input name="${k}" value="${esc(m.h[k]||'')}" autocapitalize="off" autocorrect="off" spellcheck="false"></label>`).join('')}${actions()}`,
   fd=>{const h={};Object.keys(PLAT).forEach(k=>{h[k]=String(fd.get(k)).trim().replace(/^@/,'');});S.handles[id]=h;});
}

/* ====================== Calendrier & partage ====================== */
function downloadIcs(c){
  const d=c.date.replace(/-/g,''); const nd=pd(c.date);nd.setDate(nd.getDate()+1);
  const d2=nd.getFullYear()+String(nd.getMonth()+1).padStart(2,'0')+String(nd.getDate()).padStart(2,'0');
  const e=s=>String(s).replace(/[,;\\]/g,m=>'\\'+m).replace(/\n/g,'\\n');
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//TH Fan Hub//FR','BEGIN:VEVENT','UID:'+c.id+'@th-fanhub','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z','DTSTART;VALUE=DATE:'+d,'DTEND;VALUE=DATE:'+d2,
    'SUMMARY:'+e('Tokio Hotel – '+c.city),'LOCATION:'+e(c.venue+', '+c.city+', '+c.country),'DESCRIPTION:'+e(c.tour+((c.tickets||[])[0]?'\n'+c.tickets[0].u:'')),'END:VEVENT','END:VCALENDAR'].join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([ics],{type:'text/calendar'}));a.download='tokio-hotel-'+c.city.toLowerCase().replace(/[^a-z]+/g,'-')+'-'+c.date+'.ics';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function shareGig(c){
  const txt=`Tokio Hotel à ${c.city} (${c.venue}) le ${fmtD(c.date)} 🎸`+((c.tickets||[])[0]?'\nBillets : '+c.tickets[0].u:'');
  if(navigator.share)navigator.share({title:'Tokio Hotel – '+c.city,text:txt}).catch(()=>{});
  else navigator.clipboard?.writeText(txt).then(()=>alert('Copié dans le presse-papiers !'),()=>{});
}

/* ====================== Événements ====================== */
document.addEventListener('click',e=>{
  const t=e.target.closest('button'); if(!t||t.closest('dialog')) return;
  const d=t.dataset;
  if(d.open){openConcert(d.open);}
  else if(d.fav){const p=S.plan[d.fav]||{};const nx=!p.status?'fav':p.status==='fav'?'go':null;if(nx)S.plan[d.fav]={...p,status:nx};else delete S.plan[d.fav];save();render();}
  else if(d.filter){S.filter=d.filter;save();render();}
  else if(d.edithandles){editHandles(d.edithandles);}
  else if(d.planedit){editPlan(d.planedit);}
  else if(d.delnews){S.extraNews=S.extraNews.filter(n=>n.id!==d.delnews);save();render();}
  else if(d.delpack){S.extraPacks=S.extraPacks.filter(n=>n.id!==d.delpack);save();render();}
  else if(t.id==='copyTopic'){navigator.clipboard?.writeText(NTFY_TOPIC).then(()=>{t.textContent='Copié ✓';},()=>{});}
  else if(t.id==='moreNews'){S.moreNews=!S.moreNews;save();render();}
  else if(t.id==='addGig')editConcert(null);
  else if(t.id==='addNews')addNews();
  else if(t.id==='addPack')addPack();
  else if(t.id==='exp'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='th-fanhub-sauvegarde.json';a.click();}
});
document.addEventListener('change',e=>{
  if(e.target.id!=='imp')return; const f=e.target.files[0]; if(!f)return;
  f.text().then(t=>{try{const o=JSON.parse(t);if(typeof o!=='object'||!o)throw 0;S={...S,...o};save();render();alert('Données importées.');}catch(err){alert('Fichier invalide.');}});
});
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close();});

render();
fetch('data/live.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(d=>{if(d&&typeof d==='object'){LIVE={news:[],events:[],...d};render();}}).catch(()=>{});
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script>
