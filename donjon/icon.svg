<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="fond" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#5a3518"/>
      <stop offset=".55" stop-color="#24150c"/>
      <stop offset="1" stop-color="#0d0806"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffb54a" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffb54a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orClair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4c8"/>
      <stop offset=".5" stop-color="#f5c75a"/>
      <stop offset="1" stop-color="#c98a2a"/>
    </linearGradient>
    <linearGradient id="orMoyen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9b04a"/>
      <stop offset="1" stop-color="#9c5f1a"/>
    </linearGradient>
    <linearGradient id="orSombre" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b87828"/>
      <stop offset="1" stop-color="#6e3d0e"/>
    </linearGradient>
    <linearGradient id="lame" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9aa6b4"/>
      <stop offset=".5" stop-color="#f2f6fa"/>
      <stop offset="1" stop-color="#7d8896"/>
    </linearGradient>
  </defs>

  <!-- Fond -->
  <rect width="512" height="512" rx="112" fill="url(#fond)"/>
  <circle cx="256" cy="250" r="210" fill="url(#halo)"/>

  <!-- Épées croisées derrière le dé -->
  <g transform="translate(256 256) scale(.86) rotate(-40) translate(-256 -256)">
    <rect x="241" y="52" width="30" height="352" rx="3" fill="url(#lame)"/>
    <rect x="254" y="60" width="4" height="330" fill="#6f7a88" opacity=".6"/>
    <polygon points="241,52 271,52 256,18" fill="#eef3f8"/>
    <rect x="196" y="400" width="120" height="18" rx="9" fill="url(#orMoyen)" stroke="#5a3008" stroke-width="3"/>
    <rect x="246" y="418" width="20" height="50" rx="6" fill="#5a3418" stroke="#2a1606" stroke-width="2"/>
    <circle cx="256" cy="476" r="15" fill="url(#orClair)" stroke="#5a3008" stroke-width="3"/>
  </g>
  <g transform="translate(256 256) scale(.86) rotate(40) translate(-256 -256)">
    <rect x="241" y="52" width="30" height="352" rx="3" fill="url(#lame)"/>
    <rect x="254" y="60" width="4" height="330" fill="#6f7a88" opacity=".6"/>
    <polygon points="241,52 271,52 256,18" fill="#eef3f8"/>
    <rect x="196" y="400" width="120" height="18" rx="9" fill="url(#orMoyen)" stroke="#5a3008" stroke-width="3"/>
    <rect x="246" y="418" width="20" height="50" rx="6" fill="#5a3418" stroke="#2a1606" stroke-width="2"/>
    <circle cx="256" cy="476" r="15" fill="url(#orClair)" stroke="#5a3008" stroke-width="3"/>
  </g>

  <!-- D20 doré (vue de face : hexagone et facettes) -->
  <g transform="translate(256 256) scale(.9)">
    <polygon points="0,-150 130,-75 130,75 0,150 -130,75 -130,-75" fill="#2a1406" transform="translate(0 10)" opacity=".55"/>
    <!-- facettes extérieures -->
    <polygon points="0,-150 130,-75 76,44" fill="url(#orMoyen)"/>
    <polygon points="0,-150 -130,-75 -76,44" fill="url(#orClair)"/>
    <polygon points="130,-75 130,75 76,44" fill="url(#orSombre)"/>
    <polygon points="-130,-75 -130,75 -76,44" fill="url(#orMoyen)"/>
    <polygon points="130,75 0,150 76,44" fill="url(#orSombre)"/>
    <polygon points="-130,75 0,150 -76,44" fill="url(#orMoyen)"/>
    <polygon points="-76,44 76,44 0,150" fill="url(#orSombre)"/>
    <!-- face avant -->
    <polygon points="0,-150 76,44 -76,44" fill="url(#orClair)"/>
    <!-- arêtes -->
    <g fill="none" stroke="#5a3008" stroke-width="5" stroke-linejoin="round">
      <polygon points="0,-150 130,-75 130,75 0,150 -130,75 -130,-75"/>
      <polyline points="-130,-75 -76,44 0,-150 76,44 130,-75"/>
      <polyline points="-130,75 -76,44 76,44 130,75"/>
      <polyline points="-76,44 0,150 76,44"/>
    </g>
    <!-- reflet -->
    <polygon points="0,-138 -22,-80 -6,-84" fill="#fffbe8" opacity=".7"/>
    <!-- 20 gravé -->
    <text x="0" y="29" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="88" fill="#fff6d0" opacity=".6">20</text>
    <text x="0" y="26" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="88" fill="#4a2204">20</text>
  </g>

  <!-- Liseré doré -->
  <rect x="10" y="10" width="492" height="492" rx="104" fill="none" stroke="#c9913a" stroke-width="6" opacity=".55"/>
</svg>
