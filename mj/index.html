<style>
:root{

}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body{background:radial-gradient(120% 60% at 50% -10%,#2a1f14 0%,var(--bg) 60%) fixed}

:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-right)) calc(92px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left))}
.vh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line)}
h1{font-family:var(--f-display);font-size:1.9rem;line-height:1.05;margin:0;color:var(--fg)}
h2{font-family:var(--f-display);font-size:1.05rem;letter-spacing:.06em;color:var(--gold);margin:0 0 10px}
p{margin:0}
.lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:500}
.sub{color:var(--muted);font-size:.95rem}

.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 4px 18px #0006}
.card+.card,.card+.btn,.stack>*+*{margin-top:12px}
.btn{display:inline-grid;place-items:center;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);font-weight:700;text-align:center;line-height:1.2}
.btn.primary{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}

.edseg{flex:none;width:150px}
.fscroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}

.en{display:block;font-style:italic;font-weight:400;font-size:.82rem;color:var(--muted)}
.meta{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;margin:0}
.meta dt{color:var(--muted);font-size:.88rem}

/* générateurs */
.gen-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.gen-b{display:grid;gap:2px;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel2)}

.pj button{width:32px;height:32px;font-weight:700;color:var(--gold)}

.mrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);width:100%}

.search svg{width:18px;height:18px;fill:none;stroke:var(--muted);stroke-width:2;flex:none}

.ov{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.ov[hidden]{display:none}
.ov-in{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(40px + env(safe-area-inset-bottom,0px))}

.vitals{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.vit{display:grid;justify-items:center;align-content:center;gap:1px;padding:9px 4px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);text-align:center}

.mv{display:flex;gap:6px}
.mv button{min-width:38px;padding:6px 4px;border-radius:8px;background:var(--panel);border:1px solid var(--line);font-weight:700;text-align:center}
.mv button.pf{border-color:var(--gold);color:var(--gold)}
.mst small{font-size:.66rem;color:var(--muted)}
.desc p{margin:0 0 8px;line-height:1.5}
.desc ul{margin:0 0 8px;padding-left:20px}
.dl,.spl{color:var(--gold);font-weight:700;text-decoration:underline dotted;text-underline-offset:3px}
.spl{font-weight:500}
/* carnet */
.note summary{list-style:none;cursor:pointer;display:grid;gap:2px}
.note summary::-webkit-details-marker{display:none}
.note pre{white-space:pre-wrap;font:inherit;margin:10px 0;line-height:1.5}
/* nav et toast */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);background:#0d0b09f2;border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left));backdrop-filter:blur(8px)}
.nav button{display:grid;justify-items:center;gap:2px;padding:6px 2px;font-size:.74rem;font-weight:700;color:var(--muted);border-radius:10px}
.nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--gold)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:40;width:min(92vw,440px);background:#2c241b;border:1px solid var(--gold);border-radius:14px;padding:10px 14px;box-shadow:0 8px 28px #000a;transition:.2s}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.t-row{display:flex;align-items:baseline;gap:10px}
.t-total{font-family:var(--f-display);font-size:2rem;color:var(--gold);line-height:1}
.t-detail{color:var(--muted);font-size:.9rem}
.t-flag{font-weight:700;margin-top:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:380px){.gen-act{grid-template-columns:1fr 1fr}.gen-act .btn:first-child{grid-column:1/-1}.vitals{grid-template-columns:repeat(2,1fr)}.edseg{width:128px}}
</style>

<script>
/* ---------- Base ---------- */
const KEY='compagnon-mj-v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/œ/g,'oe');
const uid=()=>Math.random().toString(36).slice(2,10);
function rnd(n){try{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n+1;}catch(e){return Math.floor(Math.random()*n)+1;}}
const fmt=n=>(n>=0?'+':'−')+Math.abs(n);
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r);}catch(e){}return null;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const S=Object.assign({tab:'gen',ed:'2024',party:[3,3,3,3],encs:[],notes:[],bq:'',bty:'',bcr:'',bsort:'n'},load()||{});
const ui={ov:null};

/* ---------- Données et règles ---------- */
let MON,MONI,MLIST,MI,MTYPES;const SPN=Object.assign({},DATA['2014'].sp,DATA['2024'].sp);
function useEd(){const D=DATA[S.ed]||DATA['2024'];MON=D.mon;MONI=Object.fromEntries(MON.map(m=>[m.id,m]));MLIST=D.mg;MI=Object.fromEntries(MLIST.map(m=>[m.id,m]));MTYPES=[...new Set(MON.map(mBase))].sort((a,b)=>a.localeCompare(b,'fr'));}
function mBase(m){return String(m.ty).replace(/\s*\(.*\)$/,'').replace(/^Nuée.*/i,'Nuée');}
const getMon=id=>MONI[id]||null;
const enc=()=>({ed:S.ed});
const party=()=>S.party&&S.party.length?S.party:[1,1,1,1];
const CR_XP={'0':10,'1/8':25,'1/4':50,'1/2':100,'1':200,'2':450,'3':700,'4':1100,'5':1800,'6':2300,'7':2900,'8':3900,'9':5000,'10':5900,'11':7200,'12':8400,'13':10000,'14':11500,'15':13000,'16':15000,'17':18000,'18':20000,'19':22000,'20':25000,'21':33000,'22':41000,'23':50000,'24':62000,'25':75000,'26':90000,'27':105000,'28':120000,'29':135000,'30':155000};
const XPT14=[[25,50,75,100],[50,100,150,200],[75,150,225,400],[125,250,375,500],[250,500,750,1100],[300,600,900,1400],[350,750,1100,1700],[450,900,1400,2100],[550,1100,1600,2400],[600,1200,1900,2800],[800,1600,2400,3600],[1000,2000,3000,4500],[1100,2200,3400,5100],[1250,2500,3800,5700],[1400,2800,4300,6400],[1600,3200,4800,7200],[2000,3900,5900,8800],[2100,4200,6300,9500],[2400,4900,7300,10900],[2800,5700,8500,12700]];
const XPT24=[[50,75,100],[100,150,200],[150,225,400],[250,375,500],[500,750,1100],[600,1000,1400],[750,1300,1700],[1000,1700,2100],[1300,2000,2600],[1600,2300,3100],[1900,2900,4100],[2200,3700,4700],[2600,4200,5400],[2900,4900,6200],[3300,5400,7800],[3800,6100,9800],[4500,7200,11700],[5000,8700,14200],[5500,10700,17200],[6400,13200,22000]];
const MULTS=[0.5,1,1.5,2,2.5,3,4,5];
const crNum=c=>String(c).includes('/')?1/+String(c).split('/')[1]:+c;
const encMonXp=id=>{const m=getMon(id);return m?(m.xp||CR_XP[m.cr]||0):0;};
const nf=n=>n.toLocaleString('fr-FR');
function encDiff(xps,ed,lv){lv=lv||party();const n=xps.length;const tot=xps.reduce((a,b)=>a+(b||0),0);const L=i=>Math.max(1,Math.min(20,i))-1;if(!n)return null;
  if(ed==='2014'){let mi=n===1?1:n===2?2:n<=6?3:n<=10?4:n<=14?5:6;if(lv.length<3)mi++;else if(lv.length>=6)mi--;const mult=MULTS[Math.max(0,Math.min(7,mi))];const adj=Math.round(tot*mult);
    const th=[0,1,2,3].map(k=>lv.reduce((a,l)=>a+XPT14[L(l)][k],0));const lab=adj<th[0]?['Insignifiante','ok']:adj<th[1]?['Facile','ok']:adj<th[2]?['Moyenne','mid']:adj<th[3]?['Difficile','hard']:['Mortelle','bad'];
    return {tot,adj,lab:lab[0],cls:lab[1],txt:`${nf(tot)} PX × ${String(mult).replace('.',',')} = ${nf(adj)} PX ajustés · seuils : facile ${nf(th[0])}, moyenne ${nf(th[1])}, difficile ${nf(th[2])}, mortelle ${nf(th[3])}`};}
  const th=[0,1,2].map(k=>lv.reduce((a,l)=>a+XPT24[L(l)][k],0));const lab=tot<=th[0]?['Faible','ok']:tot<=th[1]?['Modérée','mid']:tot<=th[2]?['Élevée','hard']:['Au-delà d’élevée','bad'];
  return {tot,adj:tot,lab:lab[0],cls:lab[1],txt:`${nf(tot)} PX · budgets : faible ${nf(th[0])}, modérée ${nf(th[1])}, élevée ${nf(th[2])}`};}
const diffColor=c=>c==='ok'?'var(--good)':c==='mid'?'var(--mid)':c==='hard'?'var(--hard)':'var(--bad)';
function diffBox(d,lv){if(!d)return '';lv=lv||party();return `<div class="diffb" style="border-color:${diffColor(d.cls)}"><div class="row"><b style="color:${diffColor(d.cls)}">${esc(d.lab)}</b><span class="hint">${lv.length} PJ · niv. ${[...new Set(lv)].sort((a,b)=>a-b).join('/')}</span></div><small class="hint">${esc(d.txt)}</small></div>`;}
const edBadge=e=>`<span class="mk">Règles ${e}</span>`;
const RARN={c:'Commun',u:'Peu commun',r:'Rare',vr:'Très rare',l:'Légendaire'};
const rarTag=m=>`<span class="mk">${RARN[m.rk]||esc(m.r)}</span>`;
const CRB=[['','Tous FP'],['a','FP 0 à 1'],['b','FP 2 à 4'],['c','FP 5 à 10'],['d','FP 11 à 16'],['e','FP 17+']];
const crBucket=c=>{const n=crNum(c);return n<=1?'a':n<=4?'b':n<=10?'c':n<=16?'d':'e';};

/* ---------- Dés ---------- */
let tt;
function showMsg(title,text){const el=$('#toast');el.innerHTML=`<div class="lbl">${esc(title)}</div><div>${esc(text)}</div>`;el.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('show'),3800);}
function showRoll(label,total,detail,flag){const el=$('#toast');el.innerHTML=`<div class="lbl">${esc(label)}</div><div class="t-row"><div class="t-total">${total}</div><div class="t-detail">${esc(detail)}</div></div>${flag?`<div class="t-flag">${esc(flag)}</div>`:''}`;el.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('show'),5000);const sr=$('#srlive');if(sr)sr.textContent=label+' : '+total;}
function rollD20(b,label){const r=rnd(20);showRoll(label,r+b,`d20 (${r}) ${fmt(b)}`,r===20?'20 naturel !':r===1?'1 naturel…':'');}
function rollF(f,label){const m=String(f).replace(/\s/g,'').replace('−','-').match(/^(\d*)d(\d+)([+-]\d+)?$/);if(!m)return;const n=+(m[1]||1),s=+m[2],k=+(m[3]||0);const R=[];for(let i=0;i<n;i++)R.push(rnd(s));const t=R.reduce((a,b)=>a+b,0)+k;showRoll(label,t,`${n}d${s} (${R.join(' + ')})${k?' '+fmt(k):''}`);}
function txt(s){const lines=String(s||'').split('\n');let html='',inList=false;
  const inl=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>')
    .replace(/(^|[^\w>])(\d*d(?:4|6|8|10|12|20|100))((?:\s?[+−-]\s?\d+)?)(?![\w])/g,(m0,pre,d,mod)=>{const f=(/^\d/.test(d)?d:'1'+d)+mod.replace(/\s/g,'').replace('−','-');return `${pre}<button class="dl" data-a="rollF" data-f="${f}">${d}${mod}</button>`;});
  for(const l of lines){if(l.startsWith('- ')){if(!inList){html+='<ul>';inList=true;}html+=`<li>${inl(l.slice(2))}</li>`;continue;}if(inList){html+='</ul>';inList=false;}html+=`<p>${inl(l)}</p>`;}
  if(inList)html+='</ul>';return html;}
</script>

<script>
/* ---------- Fiche de créature ---------- */
const STATS=['FOR','DEX','CON','INT','SAG','CHA'];const STATN={FOR:'Force',DEX:'Dextérité',CON:'Constitution',INT:'Intelligence',SAG:'Sagesse',CHA:'Charisme'};
function monEntry(m,e){const [n,d,sc]=e;let h=txt(d);h=h.replace(/^<p>/,`<p><b><i>${esc(n)}.</i></b> `);
  h=h.replace(/(<i>(?:Jet d(?:&#39;|')attaque|Attaque d)[^<]*?:<\/i>)\s*([+−-]\d+)/g,(x,a,b)=>`${a} <button class="dl" data-a="rollB" data-b="${b.replace('−','-')}" data-l="${esc(m.n)} · ${esc(String(n).replace(/\s*\(.*\)$/,''))}">${b}</button>`);
  if(sc)h+=sc.map(([u,list])=>`<p><i>${esc(u)} :</i> ${list.map(([id,note])=>{const s=SPN[id];return `<span class="spl">${esc(s?s[0]:id)}</span>${s&&s[1]?` <span class="hint">(${esc(s[1])})</span>`:''}${note?` (${esc(note)})`:''}`;}).join(', ')}</p>`).join('');
  return h;}
function monDetail(m){const mods=m.st.map(v=>Math.floor((v-10)/2));
  const stats=STATS.map((k,i)=>{const sv=m.sv&&m.sv[k];const svv=sv!=null?sv:mods[i];return `<div class="mst"><span class="k">${k} ${m.st[i]}</span><div class="mv"><button data-a="rollB" data-b="${mods[i]}" data-l="${esc(m.n)} · Test de ${STATN[k]}">${fmt(mods[i])}</button><button class="${sv!=null?'pf':''}" data-a="rollB" data-b="${svv}" data-l="${esc(m.n)} · Sauvegarde de ${STATN[k]}">${fmt(svv)}</button></div><small>test · sauvegarde</small></div>`;}).join('');
  const line=(t,v)=>v?`<dt>${t}</dt><dd>${v}</dd>`:'';
  const sk=m.sk?m.sk.map(([n,v])=>`<button class="spl" data-a="rollB" data-b="${v}" data-l="${esc(m.n)} · ${esc(n)}">${esc(n)} ${fmt(v)}</button>`).join(', '):'';
  const sec=(t,arr,intro)=>arr&&arr.length?`<section class="card desc"><h2>${t}</h2>${intro||''}${arr.map(e=>monEntry(m,e)).join('')}</section>`:'';
  const leg=m.L?`<p class="hint">3 actions légendaires${m.xl?' (4 dans son repaire)':''}, utilisables juste après le tour d’une autre créature ; elles se récupèrent au début de son tour.</p>`:'';
  const hdF=String(m.hd).replace(/\s+/g,'').replace('−','-');
  return `<div class="ov-in"><div class="ov-h"><div><span class="lbl">${esc(m.ty)} de taille ${esc(m.sz)}, ${esc(m.al)}</span><h1>${esc(m.n)}</h1><span class="sub">VO : ${esc(m.en||'')}</span></div><button class="btn sm" data-a="ovClose">Fermer</button></div>
  <div class="stack">
   <div class="vitals"><div class="vit"><span class="lbl">CA</span><b>${m.ac}</b>${m.acn?`<span class="lbl">${esc(m.acn)}</span>`:''}</div>
    <button class="vit" data-a="rollF" data-f="${esc(hdF)}" data-l="${esc(m.n)} · PV"><span class="lbl">PV</span><b>${m.hp}</b><span class="lbl">${esc(m.hd)}</span></button>
    <button class="vit" data-a="rollB" data-b="${mods[1]}" data-l="${esc(m.n)} · Initiative"><span class="lbl">Init.</span><b>${fmt(mods[1])}</b><span class="lbl">lancer</span></button>
    <div class="vit"><span class="lbl">FP</span><b>${esc(m.cr)}</b><span class="lbl">${nf(m.xp||CR_XP[m.cr]||0)} PX</span></div></div>
   <div class="mst-g">${stats}</div>
   <section class="card"><dl class="meta">${line('Vitesse',esc(m.sp))}${sk?line('Compétences',sk):''}${line('Vulnérabilités',esc(m.dv||''))}${line('Résistances',esc(m.dr||''))}${line('Immunités',esc([m.di,m.ci].filter(Boolean).join(' ; ')))}${line('Sens',esc(m.se))}${line('Langues',esc(m.la))}${line('Équipement',esc(m.gear||''))}${line('FP',`${esc(m.cr)} (${nf(m.xp||CR_XP[m.cr]||0)} PX${m.xl?', ou '+nf(m.xl)+' PX dans son repaire':''}) ; bonus de maîtrise ${fmt(m.pb)}`)}</dl></section>
   ${sec('Traits',m.T)}${sec('Actions',m.A)}${sec('Actions bonus',m.B)}${sec('Réactions',m.R)}${sec('Actions légendaires',m.L,leg)}
   <p class="hint">Les bonus et les dés soulignés se lancent d’un toucher.</p></div></div>`;}
function miDetail(m){return `<div class="ov-in"><div class="ov-h"><div><span class="lbl">${esc(m.ty||'Objet magique')}</span><h1>${esc(m.n)}</h1><span class="sub">VO : ${esc(m.en||'')} · ${esc(m.r||'')}</span></div><button class="btn sm" data-a="ovClose">Fermer</button></div><section class="card desc">${txt(m.d)}</section></div>`;}
function renderOv(){const el=$('#ov');if(!ui.ov){el.hidden=true;el.innerHTML='';document.body.style.overflow='';return;}
  let h='';if(ui.ov.type==='mon'){const m=getMon(ui.ov.id);if(m)h=monDetail(m);}else if(ui.ov.type==='mi'){const m=MI[ui.ov.id];if(m)h=miDetail(m);}
  if(!h){ui.ov=null;return renderOv();}if(ui.ov.fresh){el.scrollTop=0;ui.ov.fresh=0;}el.innerHTML=h;el.hidden=false;document.body.style.overflow='hidden';}

/* ---------- Vues ---------- */
const head=(t,sub)=>`<header class="vh"><div><span class="lbl">Compagnon du MJ</span><h1>${t}</h1>${sub?`<span class="sub">${sub}</span>`:''}</div><div class="seg edseg" aria-label="Édition des règles"><button class="${S.ed==='2014'?'on':''}" data-a="ed" data-e="2014">2014</button><button class="${S.ed==='2024'?'on':''}" data-a="ed" data-e="2024">2024</button></div></header>`;
function genOptsHtml(){const g=GEN();const k=g.k;const o=g.o[k]||{};const ch=(key,val,lab)=>`<button class="fc ${String(o[key]||'')===val?'on':''}" data-a="genOpt" data-key="${key}" data-v="${esc(val)}">${esc(lab)}</button>`;
  if(k==='pnj')return `<div class="fscroll">${ch('anc','','Toutes ascendances')}${NPC_ANC.map(a=>ch('anc',a.k,ucf(a.n[0]))).join('')}</div><div class="fscroll">${ch('g','','Homme ou femme')}${ch('g','m','Homme')}${ch('g','f','Femme')}</div>`;
  if(k==='taverne')return `<div class="fscroll">${ch('tier','','Tous standings')}${TAV_TIER.map(t=>ch('tier',t.k,ucf(t.n))).join('')}</div>`;
  if(k==='butin')return `<div class="fscroll">${ch('type','','Individuel')}${ch('type','tresor','Trésor de repaire')}</div><div class="fscroll">${LOOT_TIERS.map((t,i)=>ch('tier',i?t[0]:'',t[1])).join('')}</div>`;
  if(k==='meteo')return `<div class="fscroll">${MET_SEASONS.map((s,i)=>ch('sea',i?s[0]:'',s[1])).join('')}</div><div class="fscroll">${MET_CLIM.map((c,i)=>ch('cli',i?c[0]:'',c[1])).join('')}</div>`;
  return '';}
function monChip(id,q,lab){const m=getMon(id);if(!m)return '';return `<button class="gen-mon" data-a="monOpen" data-id="${m.id}"><span class="gen-q">${q>1?q+' ×':lab?'':'1 ×'}</span><span class="gen-mn"><b>${esc(m.n)}</b><em class="en">${esc(m.en||'')}</em></span><span class="gen-mx">${lab?`<span class="lbl">${esc(lab)}</span>`:''}<span class="mk">FP ${esc(m.cr)}</span></span></button>`;}
function miChip(id){const m=MI[id];return m?`<button class="gen-mon" data-a="miOpen" data-id="${m.id}"><span class="gen-q">✦</span><span class="gen-mn"><b>${esc(m.n)}</b><em class="en">${esc(m.en||'')}</em></span><span class="gen-mx">${rarTag(m)}</span></button>`:'';}
function genResHtml(r){if(!r)return '';const kn=(GEN_KINDS.find(x=>x[0]===r.k)||[,''])[1];
  return `<section class="card" id="genres"><span class="lbl">${esc(kn)}</span><h2 class="gen-t">${esc(r.t)}</h2>${r.s?`<p class="sub" style="margin-bottom:8px">${esc(r.s)}</p>`:''}
   ${(r.p||[]).map(x=>`<p class="gen-p">${esc(x)}</p>`).join('')}
   ${r.d&&r.d.length?`<dl class="meta">${r.d.map(([a,b])=>`<dt>${esc(a)}</dt><dd>${esc(b).replace(/\n/g,'<br>')}</dd>`).join('')}</dl>`:''}
   ${(r.mi||[]).length?`<div class="gen-l"><span class="lbl">Objets magiques</span>${r.mi.map(miChip).join('')}</div>`:''}
   ${(r.mons||[]).length?`<div class="gen-l">${r.mons.map(x=>monChip(x.id,x.q,x.lab)).join('')}</div>`:''}
   <div class="gen-act"><button class="btn primary" data-a="genRe">Relancer</button><button class="btn" data-a="genCopy">Copier</button><button class="btn" data-a="genKeep">Garder</button></div></section>`;}
function genView(){const g=GEN();
  return head('Générer','Un toucher, un résultat décrit')+`<section class="card"><div class="gen-g">${GEN_KINDS.map(([k,n,s])=>`<button class="gen-b ${g.cur&&g.cur.k===k?'on':''}" data-a="genGo" data-k="${k}"><b>${n}</b><small>${s}</small></button>`).join('')}</div>
   ${g.cur?`<div class="gen-o">${genOptsHtml()}</div>`:''}</section>
  ${g.cur?genResHtml(g.cur):'<p class="empty">Touche un générateur : le résultat s’affiche aussitôt, avec sa description.</p>'}
  ${g.hist.length>1?`<section class="card"><h2>Derniers tirages</h2><div class="party">${g.hist.map((r,i)=>`<button class="fc ${g.cur&&g.cur.id===r.id?'on':''}" data-a="genHist" data-i="${i}">${esc((GEN_KINDS.find(x=>x[0]===r.k)||[,''])[1])} · ${esc(r.t.length>26?r.t.slice(0,25)+'…':r.t)}</button>`).join('')}</div></section>`:''}`;}
function partyHtml(){const lv=party();return `<div class="party">${lv.map((l,i)=>`<span class="pj"><button data-a="ptL" data-i="${i}" data-d="-1" aria-label="Niveau moins">−</button><b>PJ ${i+1} · ${l}</b><button data-a="ptL" data-i="${i}" data-d="1" aria-label="Niveau plus">+</button></span>`).join('')}<button class="btn sm" data-a="ptAdd">+ PJ</button>${lv.length>1?'<button class="btn sm" data-a="ptDel">− PJ</button>':''}</div>`;}
function encResHtml(){const g=GEN();const e=g.enc;if(!e||e.ed!==S.ed)return '';const env=ENC_ENV.find(x=>x.k===e.env)||ENC_ENV[0];const lv=party();const d=encDiff(encXpOf(e.mons),e.ed,lv);
  return `<section class="card" id="encres"><span class="lbl">Rencontre ${esc(env.in)}</span>
   <div class="gen-l">${e.mons.map(r=>monChip(r.id,r.q)).join('')}</div>
   ${d?`<div style="margin:10px 0">${diffBox(d,lv)}</div>`:''}${e.approx?'<p class="hint" style="margin-bottom:8px">Aucune combinaison ne tombe pile dans la difficulté demandée avec ce milieu : voici la plus proche.</p>':''}
   <dl class="meta"><dt>Lieu</dt><dd>${esc(e.scene.terr)}</dd><dt>Indice</dt><dd>${esc(e.scene.sign)}</dd><dt>Situation</dt><dd>${esc(e.scene.act)}</dd><dt>Distance</dt><dd>${e.scene.dist} m au moment où l’un des camps repère l’autre</dd><dt>Négocier</dt><dd>${esc(e.scene.talk)}</dd></dl>
   <p class="hint" style="margin-top:8px">Touche une créature pour ouvrir sa fiche.</p>
   <div class="gen-act"><button class="btn primary" data-a="encGen">Relancer</button><button class="btn" data-a="encKeep">Garder</button><button class="btn" data-a="encLoot">Butin associé</button></div></section>`;}
function encView(){const g=GEN();const difs=encDifs(S.ed);const di=Math.min(g.dif,difs.length-1);const L=(S.encs||[]).filter(e=>e.ed===S.ed);
  return head('Rencontres','Aléatoires, selon le milieu et ton groupe')+`<section class="card">
   <span class="lbl">Milieu</span><div class="fscroll" style="margin:4px 0 10px">${ENC_ENV.map(x=>`<button class="fc ${g.env===x.k?'on':''}" data-a="encEnv" data-k="${x.k}">${esc(x.n)}</button>`).join('')}</div>
   <span class="lbl">Difficulté (règles ${S.ed})</span><div class="seg" style="margin:4px 0 10px">${difs.map((n,i)=>`<button class="${di===i?'on':''}" data-a="encDif" data-i="${i}">${n}</button>`).join('')}</div>
   <span class="lbl">Groupe</span><div style="margin:4px 0 12px">${partyHtml()}</div>
   <button class="btn primary big" data-a="encGen">Générer une rencontre</button></section>
  ${encResHtml()}
  <section class="card"><h2>Rencontres gardées</h2>${L.length?L.map(e=>{const d=encDiff(encXpOf(e.mons),e.ed);return `<details class="note" style="padding:8px 0;border-top:1px solid var(--line)"><summary><b>${esc(e.n)}</b><span class="hint">${e.mons.map(r=>{const m=getMon(r.id);return (r.q>1?r.q+' × ':'')+(m?m.n:'?');}).join(', ')}${d?` · <span style="color:${diffColor(d.cls)}">${esc(d.lab)}</span>`:''}</span></summary>
     <div class="gen-l">${e.mons.map(r=>monChip(r.id,r.q)).join('')}</div>${e.note?`<p class="hint" style="margin-top:8px">${esc(e.note)}</p>`:''}<div style="margin-top:8px"><button class="btn sm danger" data-a="encDel" data-id="${e.id}">${ui.del===e.id?'Confirmer la suppression':'Supprimer'}</button></div></details>`;}).join(''):'<p class="hint">Garde une rencontre générée pour la retrouver ici le jour de la séance.</p>'}</section>`;}
function bestView(){const q=norm(S.bq);let L=MON.filter(m=>(!S.bty||mBase(m)===S.bty)&&(!S.bcr||crBucket(m.cr)===S.bcr)&&(!q||norm(m.n).includes(q)||norm(m.en).includes(q)));
  L=L.slice().sort(S.bsort==='cr'?(a,b)=>crNum(a.cr)-crNum(b.cr)||a.n.localeCompare(b.n,'fr'):(a,b)=>a.n.localeCompare(b.n,'fr'));
  return head('Bestiaire',`${MON.length} créatures · noms VF et VO`)+`<label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><input id="bq" type="search" placeholder="Nom VF ou VO : ours-hibou, owlbear…" value="${esc(S.bq)}" autocomplete="off"></label>
   <div class="fscroll" style="margin-top:10px"><button class="fc ${!S.bty?'on':''}" data-a="bTy" data-c="">Tous types</button>${MTYPES.map(t=>`<button class="fc ${S.bty===t?'on':''}" data-a="bTy" data-c="${esc(t)}">${esc(t)}</button>`).join('')}</div>
   <div class="fscroll" style="margin-top:6px">${CRB.map(([k,n])=>`<button class="fc ${S.bcr===k?'on':''}" data-a="bCr" data-c="${k}">${n}</button>`).join('')}<button class="fc" data-a="bSort">Tri : ${S.bsort==='cr'?'FP':'nom'}</button></div>
   <div class="mlist" id="blist">${bestList(L)}</div>`;}
function bestList(L){return L.length?L.map(m=>`<button class="mrow" data-a="monOpen" data-id="${m.id}"><b>${esc(m.n)}<em class="en">${esc(m.en||'')}</em></b><span class="mk">FP ${esc(m.cr)}</span><small>${esc(m.ty)} de taille ${esc(m.sz)} · CA ${m.ac} · ${m.hp} PV</small></button>`).join(''):'<p class="empty">Aucune créature ne correspond.</p>';}
function notesView(){const N=(S.notes||[]).slice().sort((a,b)=>b.at-a.at);
  return head('Carnet','Ce que tu as gardé, sur cet appareil')+(N.length?N.map(n=>`<details class="card note"><summary><span class="lbl">${new Date(n.at).toLocaleDateString('fr-FR',{day:'numeric',month:'long'})}</span><b>${esc(n.t)}</b></summary><pre>${esc(n.x)}</pre><div class="row" style="justify-content:flex-start"><button class="btn sm" data-a="noteCopy" data-id="${n.id}">Copier</button><button class="btn sm danger" data-a="noteDel" data-id="${n.id}">${ui.del===n.id?'Confirmer':'Supprimer'}</button></div></details>`).join(''):'<p class="empty">Rien pour l’instant. Le bouton « Garder » d’un PNJ, d’une taverne, d’un butin, d’une rumeur ou d’une météo l’ajoute ici.</p>');}
function render(){useEd();const v=$('#view');
  v.innerHTML=S.tab==='enc'?encView():S.tab==='best'?bestView():S.tab==='notes'?notesView():genView();
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===S.tab));renderOv();}

/* ---------- Actions ---------- */
function copyTxt(t,title){const ok=()=>showMsg('Copié',title);try{(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(ok,()=>showMsg(title,t.slice(0,300)));}catch(e){showMsg(title,t.slice(0,300));}}
const scrollToId=id=>setTimeout(()=>{const el=document.getElementById(id);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});},30);
const A={
  tab:d=>{S.tab=d.t;ui.del=null;window.scrollTo(0,0);},
  ed:d=>{S.ed=d.e;},
  genGo:d=>{genRun(d.k);scrollToId('genres');},
  genRe:()=>{genRun();},
  genOpt:d=>{const g=GEN();const o=g.o[g.k]||(g.o[g.k]={});o[d.key]=d.v;genRun();},
  genHist:d=>{const g=GEN();const r=g.hist[+d.i];if(r){g.cur=r;g.k=r.k;}},
  genCopy:()=>{const r=GEN().cur;if(r)copyTxt(genText(r),r.t);return false;},
  genKeep:()=>{const r=GEN().cur;if(!r)return false;const kn=(GEN_KINDS.find(x=>x[0]===r.k)||[,''])[1];S.notes.push({id:uid(),t:`${kn} · ${r.t}`,x:genText(r),at:Date.now()});showMsg('Gardé dans le carnet',r.t);},
  encEnv:d=>{GEN().env=d.k;},
  encDif:d=>{GEN().dif=+d.i;},
  encGen:()=>{if(!encGenerate())showMsg('Rencontre aléatoire','Aucune créature de ce milieu dans ce bestiaire.');else scrollToId('encres');},
  encKeep:()=>{const e=GEN().enc;if(!e)return;const env=ENC_ENV.find(x=>x.k===e.env)||ENC_ENV[0];const m=getMon(e.mons[0].id);const n=`${m?m.n:'Rencontre'} ${env.in}`;
    S.encs.push({id:uid(),n,ed:e.ed,mons:e.mons.map(r=>({id:r.id,q:r.q})),note:[e.scene.terr,e.scene.act,'Indice : '+e.scene.sign,'Négocier : '+e.scene.talk].join(' · ')});showMsg('Rencontre gardée',n);},
  encDel:d=>{if(ui.del!==d.id){ui.del=d.id;return;}S.encs=S.encs.filter(e=>e.id!==d.id);ui.del=null;},
  encLoot:()=>{const g=GEN();const e=g.enc;if(!e)return;const o=g.o.butin||(g.o.butin={});o.tier=e.tier==='t1'?'':e.tier;o.type=e.mons.reduce((a,r)=>a+r.q,0)>3?'tresor':'';genRun('butin');S.tab='gen';scrollToId('genres');},
  ptL:d=>{const lv=party().slice();lv[+d.i]=Math.max(1,Math.min(20,lv[+d.i]+ +d.d));S.party=lv;},
  ptAdd:()=>{const lv=party().slice();lv.push(lv[lv.length-1]||1);S.party=lv.slice(0,10);},
  ptDel:()=>{const lv=party().slice();if(lv.length>1)lv.pop();S.party=lv;},
  bTy:d=>{S.bty=d.c;},bCr:d=>{S.bcr=d.c;},bSort:()=>{S.bsort=S.bsort==='cr'?'n':'cr';},
  monOpen:d=>{ui.ov={type:'mon',id:d.id,fresh:1};},
  miOpen:d=>{ui.ov={type:'mi',id:d.id,fresh:1};},
  ovClose:()=>{ui.ov=null;},
  rollB:d=>{rollD20(+d.b,d.l||'Jet');return false;},
  rollF:d=>{const lab=d.l||((ui.ov&&ui.ov.type==='mon'&&getMon(ui.ov.id))?getMon(ui.ov.id).n+' · '+d.f:d.f);rollF(d.f,lab);return false;},
  noteCopy:d=>{const n=S.notes.find(x=>x.id===d.id);if(n)copyTxt(n.t+'\n'+n.x,n.t);return false;},
  noteDel:d=>{if(ui.del!==d.id){ui.del=d.id;return;}S.notes=S.notes.filter(x=>x.id!==d.id);ui.del=null;}};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t||t.disabled)return;const fn=A[t.dataset.a];if(!fn)return;e.preventDefault();
  if(!/^(encDel|noteDel)$/.test(t.dataset.a))ui.del=null;const r=fn(t.dataset,t);save();if(r!==false)render();});
document.addEventListener('input',e=>{if(e.target.id==='bq'){S.bq=e.target.value;save();const q=norm(S.bq);
  const L=MON.filter(m=>(!S.bty||mBase(m)===S.bty)&&(!S.bcr||crBucket(m.cr)===S.bcr)&&(!q||norm(m.n).includes(q)||norm(m.en).includes(q))).sort(S.bsort==='cr'?(a,b)=>crNum(a.cr)-crNum(b.cr)||a.n.localeCompare(b.n,'fr'):(a,b)=>a.n.localeCompare(b.n,'fr'));$('#blist').innerHTML=bestList(L);}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.ov){ui.ov=null;renderOv();}});
render();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body></html>
