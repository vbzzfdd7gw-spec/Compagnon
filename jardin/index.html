<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gardiens">
<meta name="theme-color" content="#1d3527">
</head><body>
<title>Gardiens du Jardin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Plein écran : le jardin occupe tout l'écran, les menus flottent dessus (HUD en haut, plateau de défenseurs en bas, fiche du défenseur à droite). */
:root{
  --shed:#1d3527; --shed-2:#24412f; --shed-3:#2f5038; --line:#3d6648;
  --glass:rgba(20,40,28,.88); --glass-line:rgba(255,255,255,.13);
  --ink:#f2f0dc; --muted:#a6bfa3; --sun:#ffcf3a; --sun-ink:#3a2a00; --sun-edge:#c99a12;
  --leaf:#7bd25a; --berry:#ef5a4f; --sap:#9be15d;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px); --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:#173022}
body{color:var(--ink);font-family:var(--body);font-size:14px;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
#game{position:fixed;inset:0;overflow:hidden;background:linear-gradient(180deg,#7cc4f2 0%,#b6e1fb 45%,#e4f4fb 70%,#cfe9c2 100%)}
#banner{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;font-family:var(--display);font-weight:800;line-height:1;text-shadow:0 4px 0 rgba(25,45,20,.6),0 10px 30px rgba(0,0,0,.35)}
#banner b{display:block;font-size:min(64px,11vw);color:#fff7d6}
#banner span{display:block;font-size:min(28px,6vw);color:#ffd54f;margin-top:6px}
#cv{position:absolute;display:block;touch-action:none}

/* HUD */
#hud{position:absolute;inset:0;pointer-events:none}
#hud>*{pointer-events:auto}
.hud-l{position:absolute;top:calc(10px + var(--st));left:max(10px,var(--sl));display:flex;flex-direction:column;gap:6px;align-items:flex-start;max-width:calc(100% - 190px)}
.pills{display:flex;gap:7px;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:7px;background:var(--glass);border:1.5px solid var(--glass-line);border-radius:99px;padding:4px 13px 4px 6px;box-shadow:0 4px 14px rgba(0,0,0,.25);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.pill b{font-family:var(--display);font-size:21px;line-height:1.15;font-variant-numeric:tabular-nums}
.pill .k{font-size:10.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.pill.pollen b{color:var(--sun)}
.ico{width:24px;height:24px;flex:none}
.mini{width:46px;height:5px;border-radius:3px;background:#0f1f15;overflow:hidden}
.mini i{display:block;height:100%;width:100%;background:var(--leaf);transition:width .2s}
.next{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.next .lbl{font-size:11px;font-weight:800;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.chip{font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--glass);border:1px solid var(--glass-line);color:var(--ink)}
.chip.boss{color:#ffc2b8;border-color:#b0483e;background:rgba(70,25,22,.9)}
.chip.air{color:#c6e0ff;border-color:#4b6d99}
.hud-r{position:absolute;top:calc(10px + var(--st));right:max(10px,var(--sr));display:flex;gap:7px}
.round{min-width:44px;height:44px;padding:0 10px;border-radius:99px;border:1.5px solid var(--glass-line);background:var(--glass);font-family:var(--display);font-weight:800;font-size:17px;box-shadow:0 4px 14px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center}
.round svg{width:20px;height:20px}

/* Plateau des défenseurs */
#tray{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(10px + var(--sb));display:flex;align-items:stretch;gap:8px;padding:7px;background:var(--glass);border:1.5px solid var(--glass-line);border-radius:18px;max-width:calc(100% - 20px - var(--sl) - var(--sr));box-shadow:0 8px 24px rgba(0,0,0,.3);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.fold{width:22px;border:0;border-radius:10px;background:rgba(255,255,255,.06);color:var(--muted);font-weight:800;padding:0}
.shop{display:flex;gap:6px;min-width:0}
.card{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:0;width:70px;padding:3px 2px 5px;background:rgba(10,25,16,.55);border:1.5px solid var(--line);border-radius:12px}
.card canvas{width:46px;height:46px}
.card .nm{font-weight:800;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;line-height:1.2}
.card .pr{font-family:var(--display);font-size:14.5px;font-weight:700;color:var(--sun);font-variant-numeric:tabular-nums;line-height:1.1}
.card .key{position:absolute;top:3px;left:6px;font-size:10px;color:var(--muted);font-weight:800}
.card.on{border-color:var(--sun);background:var(--shed-3);box-shadow:0 0 0 3px rgba(255,207,58,.25)}
.card.poor{opacity:.42}
#tray.folded .shop{display:none}
.wz{display:flex;flex-direction:column;justify-content:center;gap:5px;width:164px}
.primary{width:100%;padding:10px 12px;border:0;border-radius:12px;background:var(--sun);color:var(--sun-ink);font-family:var(--display);font-size:17px;font-weight:800;line-height:1.1;box-shadow:0 3px 0 var(--sun-edge)}
.primary:active{transform:translateY(2px);box-shadow:0 1px 0 var(--sun-edge)}
.primary:disabled{opacity:.5;cursor:default;transform:none}
.chk{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--muted);font-weight:800}
.chk input{accent-color:var(--sun);width:15px;height:15px;margin:0}
.zoom{position:absolute;left:max(10px,var(--sl));bottom:calc(14px + var(--sb));display:flex;flex-direction:column;gap:7px}
.zoom .round{font-size:24px;line-height:1}
.zoom .round:disabled{opacity:.4}
@media (max-width:1060px) and (min-height:521px){.zoom{bottom:auto;top:50%;transform:translateY(-50%)}}
#hint{position:absolute;left:50%;transform:translateX(-50%);top:calc(64px + var(--st));max-width:min(560px,calc(100% - 24px));padding:8px 14px;border-radius:12px;background:rgba(15,30,20,.92);border:1px solid var(--glass-line);font-size:13px;font-weight:700;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.3);pointer-events:none}

/* Fiche du défenseur */
.panel{position:absolute;right:max(10px,var(--sr));top:calc(62px + var(--st));width:300px;max-height:calc(100% - 170px - var(--st) - var(--sb));overflow-y:auto;background:var(--glass);border:1.5px solid var(--glass-line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.35);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.sel-top{display:flex;gap:10px;align-items:center}
.sel-top canvas{width:76px;height:76px;flex:none;background:radial-gradient(circle at 50% 70%,#3d6a45,#24412f 70%);border-radius:12px}
.sel-id{min-width:0;flex:1}
.sel-id h3{margin:0;font-family:var(--display);font-size:19px;line-height:1.1;font-weight:800;text-wrap:balance}
.sel-id .sub{font-size:12px;color:var(--muted);margin-top:3px;font-weight:700}
.x{align-self:flex-start;border:0;background:none;color:var(--muted);font-size:24px;line-height:1;padding:0 2px}
.sap{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.sap .bar{flex:1;height:9px;background:#0f1f15;border-radius:5px;overflow:hidden;border:1px solid #2c4a35}
.sap .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5fae3a,var(--sap));border-radius:5px}
.sap .bar i.full{background:linear-gradient(90deg,#ffcf3a,#fff09a);animation:glow 1s ease-in-out infinite alternate}
@keyframes glow{to{filter:brightness(1.25)}}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;font-size:12.5px}
.stats div{display:flex;justify-content:space-between;gap:6px;border-bottom:1px dashed #2f503a;padding-bottom:2px}
.stats span{color:var(--muted)}
.stats b{font-variant-numeric:tabular-nums}
.evo{display:flex;flex-direction:column;gap:7px}
.evo .ttl{font-family:var(--display);font-size:15px;font-weight:700}
.evo-btn{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:7px 9px;border-radius:12px;border:1.5px solid var(--sun-edge);background:#3b3a1c;min-width:0}
.evo-btn canvas{width:50px;height:50px;flex:none}
.evo-btn .t{min-width:0;flex:1;font-size:12.5px;line-height:1.3}
.evo-btn .t b{display:block;font-family:var(--display);font-size:15px;color:var(--sun)}
.evo-btn .t em{font-style:normal;color:var(--muted)}
.evo-btn .c{font-family:var(--display);font-size:16px;font-weight:800;color:var(--sun);font-variant-numeric:tabular-nums}
.evo-btn:disabled{opacity:.5;cursor:default;border-color:var(--line);background:var(--shed-2)}
.evo-btn:not(:disabled):hover{background:#4a481f}
.ultimate{font-family:var(--display);font-size:15px;color:var(--sun);text-align:center;padding:6px;border:1.5px dashed var(--sun-edge);border-radius:10px}
.why{font-size:11.5px;color:var(--muted)}
.strip{display:flex;flex-direction:column;gap:4px}
.lane{display:flex;align-items:center;gap:4px}
.lane>span{width:64px;flex:none;font-size:10.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;line-height:1.1}
.strip canvas{width:40px;height:40px;border-radius:8px;background:#1a3023;border:1.5px solid transparent}
.strip canvas.lock{opacity:.3}
.strip canvas.done{opacity:.8}
.strip canvas.cur{border-color:var(--sun);background:#2f5038}
.row2{display:flex;gap:8px;align-items:center}
.row2 .mv,.row2 .danger{flex:1}
.mv{padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:var(--shed-3);font-weight:800;font-size:12.5px}
.confirm{position:absolute;display:flex;gap:6px;transform:translateX(-50%);z-index:3}
.confirm .ok{padding:9px 14px;border:0;border-radius:12px;background:var(--sun);color:var(--sun-ink);font-family:var(--display);font-weight:800;font-size:15px;box-shadow:0 3px 0 var(--sun-edge),0 6px 16px rgba(0,0,0,.3);white-space:nowrap}
.confirm .ok:disabled{background:#6b3b36;color:#ffd2cc;box-shadow:0 6px 16px rgba(0,0,0,.3)}
.confirm .no{width:40px;border-radius:12px;border:1.5px solid var(--glass-line);background:var(--glass);font-size:18px;font-weight:800}
.row2 label{flex:1;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:800}
.row2 select{flex:1;min-width:0;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--shed-2)}
.danger{padding:7px 10px;border-radius:10px;border:1px solid #7a3530;background:#3a1f1c;color:#ffc4bc;font-weight:800;font-size:12.5px}

/* Écran d'accueil */
.screen{position:absolute;inset:0}
#home{display:flex;align-items:center;padding:calc(20px + var(--st)) max(20px,var(--sr)) calc(20px + var(--sb)) max(28px,calc(var(--sl) + 20px));background:linear-gradient(90deg,rgba(12,28,17,.92) 0%,rgba(12,28,17,.7) 38%,rgba(12,28,17,.1) 72%,rgba(12,28,17,0))}
.home-in{display:flex;flex-direction:column;gap:16px;width:min(420px,100%);max-height:100%;overflow-y:auto;padding:4px}
.logo{margin:0;font-family:var(--display);font-weight:800;line-height:.82;color:var(--sun);font-size:min(96px,13vw,17vh);letter-spacing:-.01em;text-shadow:0 4px 0 #8a6a12,0 12px 30px rgba(0,0,0,.45)}
.logo span{display:block;font-size:.5em;line-height:1.05;color:#fff4cf;text-shadow:0 3px 0 #2b4a2f,0 8px 20px rgba(0,0,0,.4);margin-top:.18em}
.tag{margin:0;font-size:15px;line-height:1.45;color:#dfe8d3;max-width:36ch}
.seg{display:flex;padding:4px;gap:4px;background:rgba(0,0,0,.3);border:1px solid var(--glass-line);border-radius:14px}
.seg button{flex:1;padding:8px 6px;border:0;border-radius:10px;background:none;font-weight:800;font-size:13.5px;color:var(--muted)}
.seg button[aria-checked="true"]{background:var(--shed-3);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--sun)}
.menu{display:flex;flex-direction:column;gap:9px}
.primary.big{padding:14px 18px;font-size:24px;border-radius:16px;box-shadow:0 4px 0 var(--sun-edge)}
.ghost{padding:11px 16px;border-radius:14px;border:1.5px solid var(--glass-line);background:rgba(20,40,28,.75);font-weight:800;font-size:15px;text-align:left}
.ghost:hover{border-color:var(--sun)}
.best{font-size:12.5px;color:var(--muted);font-weight:700;margin:0}
.best b{color:var(--sun)}
.rot{font-size:12.5px;color:#ffe08a;margin:0;font-weight:700}

/* Fenêtres (pause, fin, encyclopédie) */
#ov{display:flex;align-items:center;justify-content:center;background:rgba(10,22,14,.62);padding:calc(14px + var(--st)) max(14px,var(--sr)) calc(14px + var(--sb)) max(14px,var(--sl))}
#ov .box{background:var(--shed-2);border:1.5px solid var(--line);border-radius:18px;padding:20px 22px;max-width:440px;width:100%;box-shadow:0 18px 40px rgba(0,0,0,.45);max-height:100%;overflow:auto}
#ov .box.wide{max-width:980px}
#ov h2{font-family:var(--display);font-size:30px;line-height:1;color:var(--sun);font-weight:800;margin:0 0 10px;text-wrap:balance}
#ov p{margin:0 0 10px;line-height:1.5;font-size:14px}
#ov ul{margin:0 0 14px;padding-left:18px;line-height:1.55;font-size:13.5px;color:var(--muted)}
#ov ul b,#ov p b{color:var(--ink)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.btns .primary{flex:1 1 160px;width:auto}
.btns .ghost{flex:1 1 140px;text-align:center}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px;margin:4px 0 6px}
.gcard{background:var(--shed);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.gcard header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.gcard h3{margin:0;font-family:var(--display);font-size:19px;font-weight:800}
.gcard header span{font-family:var(--display);color:var(--sun);font-weight:700;font-size:14px}
.gcard p{font-size:12.5px!important;color:var(--muted);margin:2px 0 6px!important}
.gcard .lane{align-items:flex-start;margin-top:4px}
.gcard .lane>span{padding-top:16px}
.gcard figure{margin:0;width:62px;display:flex;flex-direction:column;align-items:center;gap:1px}
.gcard figure canvas{width:46px;height:46px;background:#1a3023;border-radius:9px}
.gcard figcaption{font-size:9.5px;line-height:1.15;text-align:center;color:var(--ink);font-weight:700}

@media (max-width:760px),(max-height:520px){
  .card{width:54px}.card .nm{display:none}.card canvas{width:40px;height:40px}
  .wz{width:118px}.primary{font-size:14.5px;padding:8px}
  .pill b{font-size:17px}.pill .k{display:none}.ico{width:20px;height:20px}.round{min-width:38px;height:38px}
}
@media (max-height:520px){
  .next{display:none}
  .panel{top:calc(56px + var(--st));width:276px;max-height:calc(100% - 162px - var(--st) - var(--sb));padding:10px;gap:8px}
  #hint{top:calc(54px + var(--st))}
}
@media (max-width:620px) and (min-height:521px){
  .panel{left:max(10px,var(--sl));right:max(10px,var(--sr));width:auto;top:auto;bottom:calc(96px + var(--sb));max-height:42%}
  #home{background:linear-gradient(180deg,rgba(12,28,17,.9),rgba(12,28,17,.75) 60%,rgba(12,28,17,.5))}
}
@media (max-width:540px) and (min-height:521px){#tray{flex-wrap:wrap;justify-content:center;gap:6px}.fold{display:none}#tray.folded .shop{display:flex}.wz{width:100%;flex-direction:row;align-items:center;order:-1}.wz .primary{flex:1}.panel{bottom:calc(150px + var(--sb))}.card{width:50px}.shop{gap:4px}}
@media (max-width:380px){.card{width:44px}.card canvas{width:34px;height:34px}}
@media (prefers-reduced-motion:reduce){.sap .bar i.full{animation:none}}
</style>

<div id="game">
  <canvas id="cv" aria-label="Le jardin et l'Arbre-Mère"></canvas>

  <div id="hud" hidden>
    <div class="hud-l">
      <div class="pills">
        <div class="pill pollen" title="Pollen"><svg class="ico" viewBox="0 0 24 24"><g fill="#ffcf3a" stroke="#2b2a1f" stroke-width="1.3"><circle cx="12" cy="5.5" r="4"/><circle cx="18.2" cy="10" r="4"/><circle cx="15.8" cy="17.3" r="4"/><circle cx="8.2" cy="17.3" r="4"/><circle cx="5.8" cy="10" r="4"/></g><circle cx="12" cy="12" r="3.6" fill="#e8892c" stroke="#2b2a1f" stroke-width="1.3"/></svg><span class="k">Pollen</span><b id="hPollen">0</b></div>
        <div class="pill" title="Vie de l'Arbre-Mère"><svg class="ico" viewBox="0 0 24 24"><g stroke="#2b2a1f" stroke-width="1.3"><rect x="10.3" y="13" width="3.4" height="9" rx="1" fill="#7a5230"/><circle cx="7.5" cy="11" r="5" fill="#3f9b45"/><circle cx="16.5" cy="11" r="5" fill="#3f9b45"/><circle cx="12" cy="7" r="5.5" fill="#5abe55"/></g></svg><span class="k">Arbre</span><b id="hHp">100</b><span class="mini"><i id="hHpBar"></i></span></div>
        <div class="pill" title="Vague"><span class="k" style="display:inline">Vague</span><b id="hWave">0/25</b></div>
      </div>
      <div class="next"><span class="lbl" id="nextTtl"></span><span id="nextWave" class="next"></span></div>
    </div>
    <div class="hud-r">
      <button id="bSpeed" class="round" aria-label="Changer la vitesse">×1</button>
      <button id="bFull" class="round" aria-label="Plein écran"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button id="bPause" class="round" aria-label="Menu pause"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg></button>
    </div>
  </div>

  <div id="zoom" class="zoom" hidden>
    <button id="bZin" class="round" aria-label="Zoomer">+</button>
    <button id="bZout" class="round" aria-label="Dézoomer">−</button>
    <button id="bZ0" class="round" aria-label="Voir tout le jardin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="4" y="6" width="16" height="12" rx="2"/><path d="M9 12h6"/></svg></button>
  </div>
  <div id="tray" hidden>
    <button id="bFold" class="fold" aria-label="Replier les défenseurs">‹</button>
    <div id="shop" class="shop"></div>
    <div class="wz">
      <button id="bWave" class="primary">Lancer la vague 1</button>
      <label class="chk"><input type="checkbox" id="cAuto"> Enchaîner</label>
    </div>
  </div>
  <div id="confirm" class="confirm" hidden><button id="bOk" class="ok">Planter ici</button><button id="bNo" class="no" aria-label="Annuler">✕</button></div>
  <p id="hint" hidden></p>
  <div id="banner" hidden><b id="bnT"></b><span id="bnS"></span></div>
  <section id="sel" class="panel" hidden></section>

  <div id="home" class="screen">
    <div class="home-in">
      <h1 class="logo">Gardiens<span>du Jardin</span></h1>
      <p class="tag">Les nuisibles marchent sur l'Arbre-Mère. Plante des fleurs, installe des petites bêtes et fais-les grandir jusqu'à leur forme ultime.</p>
      <div class="seg" role="radiogroup" aria-label="Difficulté" id="seg">
        <button role="radio" data-d="facile">Facile</button>
        <button role="radio" data-d="normal">Normal</button>

  <div id="ov" class="screen" hidden></div>
</div>

<script src="three.min.js"></script>
<script>
(()=>{
'use strict';
const W=1000,H=640,TAU=Math.PI*2,OL='#2b2a1f';
const cv=document.getElementById('cv');
const wrap=document.getElementById('wrap'),ov=document.getElementById('ov');
let DPR=Math.min(2,window.devicePixelRatio||1),RS=1;

/* ---------- Chemin ---------- */
const PATH=[[-40,110],[220,110],[220,510],[470,510],[470,170],[720,170],[720,440],[850,440]];
const PW=46,TREE={x:912,y:432};
const SEG=[];let PLEN=0;
for(let i=0;i<PATH.length-1;i++){const[x1,y1]=PATH[i],[x2,y2]=PATH[i+1],l=Math.hypot(x2-x1,y2-y1);SEG.push({x1,y1,x2,y2,l,s:PLEN,a:Math.atan2(y2-y1,x2-x1)});PLEN+=l;}
function posAt(d){for(const s of SEG){if(d<=s.s+s.l){const k=(d-s.s)/s.l;return{x:s.x1+(s.x2-s.x1)*k,y:s.y1+(s.y2-s.y1)*k,a:s.a};}}const s=SEG[SEG.length-1];return{x:s.x2,y:s.y2,a:s.a};}
function distSeg(px,py,s){const dx=s.x2-s.x1,dy=s.y2-s.y1;let k=((px-s.x1)*dx+(py-s.y1)*dy)/(s.l*s.l);k=Math.max(0,Math.min(1,k));return Math.hypot(px-(s.x1+dx*k),py-(s.y1+dy*k));}

/* ---------- Défenseurs ---------- */
const XPN=[40,140,400,1000,2400];
const DEFS={
 chardon:{name:'Chardon',kind:'shoot',cost:100,air:true,evo:[80,170,320,650,1300],
  desc:'Tire des épines sur tout ce qui passe.',
  base:[{n:'Pousse de chardon',dmg:6,rate:1.2,range:110},{n:'Jeune chardon',dmg:8,rate:1.5,range:120},{n:'Chardon fleuri',dmg:11,rate:1.8,range:130}],
  A:{n:'Rafale',d:'Plusieurs têtes, tirs en éventail',st:[{n:'Chardon double',dmg:12,rate:2.4,range:135,multi:2},{n:'Chardon buissonnant',dmg:15,rate:3,range:140,multi:3},{n:'Roi des chardons',dmg:20,rate:4,range:150,multi:5}]},
  B:{n:'Perce-armure',d:'Épines d’acier qui transpercent',st:[{n:'Chardon d’acier',dmg:30,rate:1.2,range:170,pierce:3,ap:1},{n:'Lance-épines',dmg:60,rate:1.1,range:200,pierce:5,ap:1},{n:'Chardon colosse',dmg:120,rate:1,range:240,pierce:10,ap:1}]}},
 coccinelle:{name:'Coccinelle',kind:'shoot',cost:150,air:true,evo:[110,220,400,800,1600],
  desc:'Fond sur les ennemis. Dévore les pucerons (×3).',
  base:[{n:'Larve de coccinelle',dmg:10,rate:0.9,range:130,count:1},{n:'Coccinelle',dmg:14,rate:1,range:140,count:1},{n:'Coccinelle à sept points',dmg:20,rate:1.1,range:150,count:1}],
  A:{n:'Essaim',d:'Une nuée de coccinelles qui attaquent ensemble',st:[{n:'Petit essaim',dmg:16,rate:1.2,range:155,count:2},{n:'Nuée rouge',dmg:20,rate:1.4,range:165,count:3},{n:'Tempête de coccinelles',dmg:28,rate:1.7,range:180,count:5}]},
  B:{n:'Titan',d:'Une seule coccinelle, énorme, qui écrase en zone',st:[{n:'Grosse coccinelle',dmg:50,rate:0.8,range:150,splash:40},{n:'Coccinelle cuirassée',dmg:100,rate:0.8,range:160,splash:55},{n:'Coccinelle titan',dmg:200,rate:0.85,range:175,splash:75}]}},
 champignon:{name:'Champignon',kind:'pulse',cost:120,air:false,evo:[90,180,340,700,1400],
  desc:'Libère des spores empoisonnées autour de lui.',
  base:[{n:'Spores',dmg:4,rate:0.8,range:70,poison:3},{n:'Petit champignon',dmg:6,rate:0.9,range:80,poison:5},{n:'Champignon tacheté',dmg:9,rate:1,range:90,poison:8}],
  A:{n:'Amanite',d:'Un poison qui ronge même les carapaces',st:[{n:'Amanite',dmg:10,rate:1,range:95,poison:18},{n:'Amanite royale',dmg:14,rate:1.1,range:105,poison:35},{n:'Amanite mortelle',dmg:22,rate:1.2,range:115,poison:70}]},
  B:{n:'Vesse-de-loup',d:'Des nuages qui ralentissent et endorment',st:[{n:'Vesse-de-loup',dmg:12,rate:0.9,range:110,slow:0.55,poison:6},{n:'Vesse soporifique',dmg:18,rate:1,range:125,slow:0.45,stun:0.15,poison:8},{n:'Vesse géante',dmg:30,rate:1.1,range:145,slow:0.35,stun:0.25,poison:12}]}},
 ruche:{name:'Abeilles',kind:'shoot',cost:200,air:true,evo:[140,260,480,950,1900],
  desc:'Des abeilles à longue portée.',
  base:[{n:'Abeille butineuse',dmg:8,rate:1.5,range:160},{n:'Petite ruche',dmg:10,rate:2,range:170},{n:'Ruche de paille',dmg:13,rate:2.5,range:180}],
  A:{n:'Miel',d:'Le miel colle et ralentit en zone',st:[{n:'Ruche à miel',dmg:15,rate:2.5,range:185,slow:0.6,splash:25},{n:'Ruche dorée',dmg:20,rate:2.7,range:195,slow:0.5,splash:40},{n:'Palais de miel',dmg:28,rate:3,range:210,slow:0.35,splash:55}]},
  B:{n:'Dard',d:'Les dards rebondissent d’ennemi en ennemi',st:[{n:'Ruche guerrière',dmg:22,rate:2.8,range:190,chain:2},{n:'Garde royale',dmg:34,rate:3,range:200,chain:3},{n:'Reine guerrière',dmg:52,rate:3.5,range:220,chain:5}]}},
 tournesol:{name:'Tournesol',kind:'farm',cost:125,air:true,evo:[100,200,380,750,1500],
  desc:'Produit du pollen à la fin de chaque vague.',
  base:[{n:'Graine de tournesol',income:15},{n:'Tournesol',income:30},{n:'Grand tournesol',income:45}],
  A:{n:'Récolte',d:'Beaucoup plus de pollen à chaque vague',st:[{n:'Tournesol double',income:75},{n:'Bouquet de tournesols',income:115},{n:'Champ doré',income:170}]},
  B:{n:'Rayon solaire',d:'Concentre le soleil en un rayon brûlant',st:[{n:'Tournesol ardent',income:35,beam:22,range:150},{n:'Tournesol solaire',income:40,beam:50,range:170},{n:'Soleil vivant',income:50,beam:120,range:200}]}},
 araignee:{name:'Araignée',kind:'shoot',cost:140,air:true,evo:[100,200,380,760,1500],
  desc:'Lance de la soie qui ralentit les ennemis.',
  base:[{n:'Petite araignée',dmg:5,rate:1,range:115,slow:0.6,sDur:1.2},{n:'Araignée tisseuse',dmg:7,rate:1.1,range:125,slow:0.55,sDur:1.4},{n:'Épeire',dmg:10,rate:1.2,range:135,slow:0.5,sDur:1.6}]},
};
DEFS.araignee.A={n:'Toile',d:'Des toiles géantes qui engluent en zone',st:[{n:'Grande toile',dmg:12,rate:1.2,range:145,slow:0.4,sDur:2,splash:40},{n:'Toile d’argent',dmg:16,rate:1.3,range:155,slow:0.32,sDur:2.4,splash:55},{n:'Tisseuse ancestrale',dmg:22,rate:1.4,range:170,slow:0.25,sDur:3,splash:75}]};
DEFS.araignee.B={n:'Mygale',d:'Des morsures venimeuses très puissantes',st:[{n:'Tarentule',dmg:35,rate:1.2,range:130,poison:10,slow:0.8,sDur:0.6},{n:'Mygale',dmg:70,rate:1.3,range:140,poison:22,slow:0.8,sDur:0.6},{n:'Mygale reine',dmg:140,rate:1.4,range:150,poison:45,slow:0.8,sDur:0.6}]};
const ORDER=['chardon','coccinelle','champignon','araignee','ruche','tournesol'];
function statsOf(type,stage,branch){const D=DEFS[type];return stage<3?D.base[stage]:D[branch].st[stage-3];}
const stats=t=>statsOf(t.type,t.stage,t.branch);

/* ---------- Nuisibles ---------- */
const EN={
 puceron:{n:'Pucerons',hp:14,sp:72,r:7,rew:3,dmg:1},
 limace:{n:'Limaces',hp:60,sp:30,r:11,rew:7,dmg:2},
 sauterelle:{n:'Sauterelles',hp:28,sp:115,r:9,rew:5,dmg:1},
 scarabee:{n:'Scarabées',hp:80,sp:42,r:11,rew:10,dmg:3,armor:4},
 corbeau:{n:'Corbeaux',hp:45,sp:68,r:12,rew:8,dmg:2,fly:1},
 limaceGeante:{n:'Limace géante',hp:900,sp:20,r:24,rew:120,dmg:25,boss:1},
 doryphore:{n:'Doryphore empereur',hp:1400,sp:26,r:24,rew:200,dmg:40,armor:6,boss:1},
};
const LAST_WAVE=25;
const hpMult=n=>1+0.11*(n-1)+0.007*(n-1)*(n-1);
function makeWave(n){
  const q=[],add=(type,count,gap,start)=>{for(let i=0;i<count;i++)q.push({type,t:start+i*gap});};
  add('puceron',5+Math.floor(n*1.6),Math.max(0.22,0.7-n*0.02),0);
  if(n>=2)add('limace',Math.floor(n*0.8),1.4,2);
  if(n>=4)add('sauterelle',Math.floor((n-2)*0.9),0.8,4);
  if(n>=6)add('scarabee',Math.floor((n-4)*0.6),1.6,6);
  if(n>=8&&n%2===0)add('corbeau',Math.floor((n-6)*0.8),1.1,3);
  if(n>=9&&n%2===1)add('corbeau',Math.floor((n-7)*0.4),1.5,8);
  if(n%10===0)add('limaceGeante',n/10,4,10);
  if(n>=15&&n%5===0)add('doryphore',n===25?3:1,6,14);
  if(n>LAST_WAVE)add('limaceGeante',Math.floor((n-LAST_WAVE)/2)+1,5,12);
  return q.sort((a,b)=>a.t-b.t);
}

/* ---------- État ---------- */
const $=id=>document.getElementById(id);
function load(k,d){try{const v=localStorage.getItem('gj_'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}}
function save(k,v){try{localStorage.setItem('gj_'+k,JSON.stringify(v));}catch(e){}}
const DIFF={facile:{n:'Facile',hp:0.75,pollen:450,tree:150},normal:{n:'Normal',hp:1,pollen:350,tree:100},difficile:{n:'Difficile',hp:1.3,pollen:300,tree:80}};
let diff=load('diff','normal');if(!DIFF[diff])diff='normal';
let S,started=false,AT=0;
function newGame(){
  const D0=DIFF[diff];
  S={pollen:D0.pollen,hp:D0.tree,maxHp:D0.tree,hpK:D0.hp,wave:0,running:false,queue:[],wt:0,towers:[],enemies:[],proj:[],fx:[],
     sel:null,place:null,hover:null,ptr:null,speed:1,paused:false,auto:false,autoT:0,over:false,won:false,nid:1,banner:null,treeHit:0};
  document.getElementById('cAuto').checked=false;
}
newGame();

const ey=e=>e.y;
const eh=e=>e.fly?34:(e.boss?20:e.r*0.6+2);
function hurt(e,amt,src,ap,quiet){
  if(e.hp<=0)return;
  const real=ap?amt:Math.max(amt*0.25,amt-e.armor);
  e.hp-=real;e.lastSrc=src;
  if(src){src.xp+=real;src.dealt+=real;}
  if(!quiet)e.flash=0.08;
}
function slowE(e,f,dur){if(e.boss)f=1-(1-f)*0.5;if(e.slowT<=0||f<e.slowF)e.slowF=f;e.slowT=Math.max(e.slowT,dur);}
function poisonE(e,v,src){if(e.poisonT<=0)e.poison=0;e.poison=Math.max(e.poison,v);e.poisonT=3;e.poisonSrc=src;}

function spawn(type){
  const b=EN[type],m=hpMult(S.wave)*(S.hpK||1),p=posAt(0);
  S.enemies.push({type,...b,hp:b.hp*m,maxHp:b.hp*m,armor:b.armor?b.armor+Math.floor(S.wave/8):0,sp:b.sp*(0.95+Math.random()*0.1),
    d:0,x:p.x,y:p.y,a:p.a,slowT:0,slowF:1,poisonT:0,poison:0,stunT:0,anim:Math.random()*10,fly:!!b.fly,flash:0});
}
function startWave(){
  if(S.running||S.over)return;
  S.wave++;if(S.demo&&S.wave>12)S.wave=6;S.queue=makeWave(S.wave);S.wt=0;S.running=true;
  const boss=S.queue.some(q=>EN[q.type].boss);
  if(!S.demo)S.banner={txt:'Vague '+S.wave,sub:boss?'Un monstre approche !':'',t:0};
  refreshNext();
}
function endWave(){
  if(S.demo){S.running=false;S.autoT=1;return;}
  S.running=false;
  const bonus=60+S.wave*10;S.pollen+=bonus;
  for(const t of S.towers){const st=stats(t);if(st.income){S.pollen+=st.income;txt(t.x,t.y,'+'+st.income,'#ffe066',16,70);for(let i=0;i<8;i++)part(t.x,t.y,'#ffd23f',2.5,90,undefined,50);}}
  const best=load('best',{});if(S.wave>(best[diff]||0)){best[diff]=S.wave;save('best',best);}
  S.banner={txt:'Vague repoussée',sub:'+'+bonus+' pollen',t:0};
  if(S.wave>=LAST_WAVE&&!S.won){S.won=true;S.paused=true;showVictory();}
  S.autoT=2;refreshNext();
}
function kill(e){
  S.pollen+=e.rew;
  if(e.lastSrc)e.lastSrc.kills++;
  txt(e.x,e.y,'+'+e.rew,'#ffe066',e.boss?18:12,eh(e)+e.r+10);
  const col={puceron:'#8bd450',limace:'#c47a3a',sauterelle:'#6db33f',scarabee:'#3d57a0',corbeau:'#333',limaceGeante:'#8e5bb8',doryphore:'#f2c94c'}[e.type];
  for(let i=0;i<(e.boss?30:8);i++)part(e.x,e.y,col,e.boss?4:2.5,e.boss?160:90,undefined,eh(e));
}

/* ---------- Effets ---------- */
function part(x,y,col,sz,sp,g,h){const a=Math.random()*TAU,v=sp*(0.2+Math.random()*0.45);S.fx.push({k:'p',x,y,h:h??8,vx:Math.cos(a)*v,vz:Math.sin(a)*v,vh:(g!=null&&g<=0)?sp*0.25:sp*(0.35+Math.random()*0.6),t:0,d:0.5+Math.random()*0.4,col,sz,g:g??260});}
function leafP(x,y,h){const a=Math.random()*TAU,v=30+Math.random()*60;S.fx.push({k:'leaf',x,y,h:h??20,vx:Math.cos(a)*v,vz:Math.sin(a)*v,vh:40+Math.random()*90,g:110,t:0,d:1+Math.random()*0.5,rot:Math.random()*TAU,vr:(Math.random()-0.5)*10,col:Math.random()<0.5?'#7bd25a':'#a8e063'});}
function ring(x,y,r0,r1,col,d,w){S.fx.push({k:'ring',x,y,r0,r1,col,t:0,d:d||0.35,w:w||3});}
function txt(x,y,s,col,sz,h){S.fx.push({k:'txt',x,y,h:h??30,s,col,sz:sz||13,t:0,d:0.9});}
function lineFx(x1,y1,x2,y2,col,w,h1,h2){S.fx.push({k:'ln',x1,y1,x2,y2,h1:h1??8,h2:h2??8,col,w:w||3,t:0,d:0.18});}

/* ---------- Placement & actions ---------- */
function canPlace(x,y,ign){
  if(x<20||x>W-20||y<30||y>H-12)return false;
  for(const s of SEG)if(distSeg(x,y,s)<PW/2+15)return false;
  if(Math.hypot(x-TREE.x,y-TREE.y+30)<88)return false;
  for(const t of S.towers)if(t!==ign&&Math.hypot(x-t.x,y-t.y)<36)return false;
  return true;
}
function place(type,x,y){
  const D=DEFS[type];
  if(S.pollen<D.cost||!canPlace(x,y))return null;
  S.pollen-=D.cost;
  const t={id:S.nid++,type,x,y,stage:0,branch:null,xp:0,cd:0,angle:Math.PI/2,lean:0,anim:0,pop:0.8,invested:D.cost,dealt:0,kills:0,mode:'premier'};
  S.towers.push(t);
  for(let i=0;i<10;i++)part(x,y,'#9e7343',2.5,80,undefined,3);
  return t;
}
function canEvolve(t){if(t.stage>=5)return{xp:false,pay:false};return{xp:t.xp>=XPN[t.stage],pay:S.pollen>=DEFS[t.type].evo[t.stage]};}
function evolve(t,br){
  if(t.stage>=5)return;
  const need=XPN[t.stage],cost=DEFS[t.type].evo[t.stage];
  if(t.xp<need||S.pollen<cost)return;
  if(t.stage===2){if(br!=='A'&&br!=='B')return;t.branch=br;}
  S.pollen-=cost;t.invested+=cost;t.xp-=need;t.stage++;t.pop=1;
  const h=muzzle(t);
  ring(t.x,t.y,6,60,'#ffe066',0.5,4);
  for(let i=0;i<14;i++)leafP(t.x,t.y,h*S3*0.7);
  for(let i=0;i<14;i++)part(t.x,t.y,'#fff3a0',2.2,150,40,h*S3*0.7);
  txt(t.x,t.y,stats(t).n,'#fff7c2',15,h*S3+30);
}
function sell(t){
  const r=Math.floor(t.invested*0.7);S.pollen+=r;
  S.towers=S.towers.filter(o=>o!==t);
  for(let i=0;i<12;i++)leafP(t.x,t.y,15);
  txt(t.x,t.y,'+'+r,'#ffe066',14,40);
  if(S.sel===t)S.sel=null;
}

/* ---------- Ciblage ---------- */
function inRange(t,st,air){const r=st.range||0,out=[];for(const e of S.enemies){if(e.hp<=0||(e.fly&&!air))continue;const dx=e.x-t.x,dy=ey(e)-t.y;if(dx*dx+dy*dy<=(r+e.r)*(r+e.r))out.push(e);}return out;}
function score(t,e){switch(t.mode){case'dernier':return -e.d;case'fort':return e.hp;case'proche':return -Math.hypot(e.x-t.x,e.y-t.y);default:return e.d;}}
function best(t,list){let b=null,bs=-Infinity;for(const e of list){const s=score(t,e);if(s>bs){bs=s;b=e;}}return b;}
function nearest(x,y,r,air){let b=null,bd=r;for(const e of S.enemies){if(e.hp<=0||(e.fly&&!air))continue;const d=Math.hypot(e.x-x,ey(e)-y);if(d<bd){bd=d;b=e;}}return b;}

/* ---------- Mise à jour ---------- */
function update(dt){
  S.treeHit=Math.max(0,S.treeHit-dt);
  if(S.running){S.wt+=dt;while(S.queue.length&&S.queue[0].t<=S.wt)spawn(S.queue.shift().type);}
  else if(S.auto&&S.wave>0&&!S.over){S.autoT-=dt;if(S.autoT<=0)startWave();}
  for(const e of S.enemies)updEnemy(e,dt);
  for(const t of S.towers)updTower(t,dt);
  for(const p of S.proj)updProj(p,dt);
  S.proj=S.proj.filter(p=>!p.dead);
  S.enemies=S.enemies.filter(e=>{if(e.hp<=0){kill(e);return false;}return !e.done;});
  for(const f of S.fx){f.t+=dt;if(f.k==='p'||f.k==='leaf'){f.x+=f.vx*dt;f.y+=f.vz*dt;f.h+=f.vh*dt;f.vh-=(f.g??120)*dt;if(f.h<0){f.h=0;f.vh*=-0.3;f.vx*=0.6;f.vz*=0.6;}if(f.k==='leaf')f.rot+=f.vr*dt;}else if(f.k==='txt')f.h+=26*dt;}
  S.fx=S.fx.filter(f=>f.t<f.d);
  if(S.banner){S.banner.t+=dt;if(S.banner.t>2.4)S.banner=null;}
  if(S.running&&!S.queue.length&&!S.enemies.length)endWave();
}
function updEnemy(e,dt){
  e.flash=Math.max(0,e.flash-dt);
  if(e.stunT>0)e.stunT-=dt;
  else{const f=e.slowT>0?e.slowF:1;e.d+=e.sp*f*dt;e.anim+=dt*f;}
  if(e.slowT>0)e.slowT-=dt;
  if(e.poisonT>0){e.poisonT-=dt;hurt(e,e.poison*dt,e.poisonSrc,true,true);}
  const p=posAt(e.d);e.x=p.x;e.y=p.y;
  let da=p.a-e.a;while(da>Math.PI)da-=TAU;while(da<-Math.PI)da+=TAU;e.a+=da*Math.min(1,dt*10);
  if(e.d>=PLEN&&e.hp>0){
    if(S.demo){e.done=true;return;}
    e.done=true;S.hp-=e.dmg;S.treeHit=0.4;
    for(let i=0;i<6;i++)leafP(TREE.x+(Math.random()-0.5)*80,TREE.y+(Math.random()-0.5)*40,120);
    txt(TREE.x,TREE.y,'−'+e.dmg,'#ff8a80',18,190);
    if(S.hp<=0){S.hp=0;gameOver();}
  }
}
function muzzle(t){
  const s=t.stage;
  switch(t.type){
    case'chardon':return headH(t);
    case'tournesol':return sunH(t);
    case'ruche':return s===0?24:(15+s*3)*0.6;

}

function ui(){
  const bn=$('banner');
  if(S.banner){const k=S.banner.t;bn.style.opacity=k<0.3?k/0.3:k>1.9?Math.max(0,(2.4-k)/0.5):1;setText('bnT',S.banner.txt);setText('bnS',S.banner.sub||'');bn.hidden=false;}else bn.hidden=true;
  setText('hPollen',String(Math.floor(S.pollen)));
  setText('hHp',String(Math.ceil(S.hp)));
  $('hHpBar').style.width=(S.hp/S.maxHp*100)+'%';
  setText('hWave',S.wave+'/'+LAST_WAVE);
  setText('bWave',S.running?`Vague ${S.wave}…`:S.auto&&S.wave>0?`Vague ${S.wave+1} dans ${Math.max(0,Math.ceil(S.autoT))} s`:`Lancer la vague ${S.wave+1}`);
  $('bWave').disabled=S.running||S.over;
  setText('bSpeed','×'+S.speed);
  $('bZin').disabled=CAM.z>=3;$('bZout').disabled=CAM.z<=1;$('bZ0').disabled=CAM.z<=1;
  for(const b of shopEl.children){const k=b.dataset.k;b.classList.toggle('poor',S.pollen<DEFS[k].cost);b.classList.toggle('on',S.place===k);}
  const cf=$('confirm');
  if(S.pend&&placing()){
    const gw=gameEl.clientWidth,gh=gameEl.clientHeight,bs=toScreen(S.pend.x,0,S.pend.y),ts=toScreen(S.pend.x,70,S.pend.y),gx=bs.x;
    const ok=ghostOk(S.pend);let top=bs.y+14;if(top>gh-170)top=ts.y-52;
    cf.style.left=Math.max(110,Math.min(gw-110,gx))+'px';cf.style.top=Math.max(60,top)+'px';
    setText('bOk',!ok?(S.place&&S.pollen<DEFS[S.place].cost?'Pas assez de pollen':'Pas ici'):S.moving?'Placer ici':`Planter ici · ${DEFS[S.place].cost}`);
    $('bOk').disabled=!ok;cf.hidden=false;
  }else cf.hidden=true;
  if(S.sel&&!S.towers.includes(S.sel))S.sel=null;
  buildSel();
  if(S.sel){
    const t=S.sel,need=t.stage<5?XPN[t.stage]:1,k=t.stage<5?Math.min(1,t.xp/need):1,bar=$('sapBar');
    if(bar){bar.style.width=(k*100)+'%';bar.classList.toggle('full',k>=1);}
    const tx=$('sapTxt');if(tx)tx.textContent=t.stage<5?`${Math.floor(Math.min(t.xp,need))}/${need}`:'max';
    const sd=$('sDealt');if(sd)sd.textContent=Math.floor(t.dealt);
    const sk=$('sKills');if(sk)sk.textContent=t.kills;
  }
}

/* ---------- Écrans ---------- */
function overlay(html,btns,wide){
  ov.innerHTML=`<div class="box${wide?' wide':''}">${html}<div class="btns">${btns.map((b,i)=>`<button class="${i===0?'primary':'ghost'}" data-i="${i}">${b[0]}</button>`).join('')}</div></div>`;
  ov.hidden=false;
  ov.querySelectorAll('.btns button').forEach(b=>b.addEventListener('click',()=>btns[+b.dataset.i][1]()));
  ov.querySelectorAll('canvas[data-p]').forEach(paint);
  const f=ov.querySelector('.btns button');if(f)f.focus({preventScroll:true});
}
const closeOv=()=>{ov.hidden=true;ov.innerHTML='';};
const HELP=`<h2>Comment jouer</h2>
  <p>Pucerons, limaces, scarabées et corbeaux remontent le chemin pour dévorer l'Arbre-Mère.</p>
  <ul><li><b>Plante</b> un défenseur : choisis-le en bas, touche le jardin, fais glisser la plante pour l'ajuster, puis touche <b>Planter ici</b>. À la souris, un clic suffit.</li>
  <li>Un défenseur mal placé ? Touche-le, puis <b>Déplacer</b> : c'est gratuit.</li>
  <li>En combattant, il se remplit de <b>sève</b>.</li>
  <li>Jauge pleine : touche-le et fais-le <b>évoluer</b> contre du pollen. Il change de forme à chaque stade, six en tout.</li>
  <li>Au stade 3, choisis sa <b>voie</b> : deux formes adultes très différentes.</li>
  <li>Les <b>tournesols</b> rapportent du pollen à chaque vague. Les <b>corbeaux</b> volent : le champignon ne les touche pas.</li>
  <li><b>Zoom</b> : pince avec deux doigts ou utilise la molette, puis fais glisser pour te déplacer. Les boutons + et − marchent aussi.</li>
  <li>Clavier : <b>1–6</b> pour planter, <b>Espace</b> pour lancer la vague, <b>Échap</b> pour la pause.</li></ul>`;
function showHelp(back){overlay(HELP,[['Compris',back||closeOv]]);}
function showGallery(back){
  const fig=(k,s,b)=>`<figure><canvas data-sz="46" data-p="${k},${s},${b||''}"></canvas><figcaption>${statsOf(k,s,b).n}</figcaption></figure>`;
  const html=`<h2>Les défenseurs</h2><p>Chaque défenseur grandit en trois stades, puis tu choisis l'une de ses deux voies adultes.</p><div class="gal">${ORDER.map(k=>{const D=DEFS[k];return `<article class="gcard"><header><h3>${D.name}</h3><span>${D.cost} pollen</span></header><p>${D.desc}</p>
    <div class="lane"><span>Jeunesse</span>${fig(k,0)}${fig(k,1)}${fig(k,2)}</div>
    <div class="lane"><span>${D.A.n}</span>${fig(k,3,'A')}${fig(k,4,'A')}${fig(k,5,'A')}</div>
    <div class="lane"><span>${D.B.n}</span>${fig(k,3,'B')}${fig(k,4,'B')}${fig(k,5,'B')}</div></article>`;}).join('')}</div>`;
  overlay(html,[['Fermer',back||closeOv]],true);
}
function openPause(){
  if(!started||S.over||S.won&&S.paused)return;
  S.paused=true;cancelPlace();
  overlay(`<h2>Pause</h2><p>Vague <b>${S.wave}</b> sur ${LAST_WAVE} · ${DIFF[diff].n} · Arbre-Mère : <b>${Math.ceil(S.hp)}</b> PV</p>`,
    [['Reprendre',resume],['Les défenseurs',()=>showGallery(openPauseAgain)],['Comment jouer',()=>showHelp(openPauseAgain)],['Recommencer',restart],['Menu principal',toHome]]);
}
function openPauseAgain(){S.paused=false;openPause();}
function resume(){closeOv();S.paused=false;}
function gameOver(){
  S.over=true;S.running=false;
  setTimeout(()=>overlay(`<h2>L'Arbre-Mère est tombé</h2><p>Ton jardin a tenu <b>${S.wave-1}</b> vague${S.wave-1>1?'s':''} sur ${LAST_WAVE} en mode ${DIFF[diff].n.toLowerCase()}.</p>`,[['Rejouer',restart],['Menu principal',toHome]]),700);
}
function showVictory(){
  overlay(`<h2>Le jardin est sauvé</h2><p>Les ${LAST_WAVE} vagues sont repoussées et l'Arbre-Mère tient debout avec <b>${Math.ceil(S.hp)}</b> points de vie.</p><p>Tu peux continuer en mode infini : les vagues deviennent de plus en plus dures.</p>`,
    [['Continuer',()=>{closeOv();S.paused=false;}],['Nouvelle partie',restart],['Menu principal',toHome]]);
}
function setPlayUI(on){$('confirm').hidden=true;hudEl.hidden=!on;trayEl.hidden=!on;$('zoom').hidden=!on;homeEl.hidden=on;if(!on){selEl.hidden=true;hint('');}}
function play(){
  enterFS();
  newGame();resetCam();started=true;lastUI={};selKey='';closeOv();setPlayUI(true);refreshNext();
  hint('Choisis un défenseur en bas, puis touche le jardin. Pince ou utilise + et − pour zoomer.',5500);
}
function restart(){play();}
function toHome(){started=false;closeOv();setPlayUI(false);startDemo();showBest();}
function startDemo(){
  newGame();resetCam();S.demo=true;S.pollen=1e9;S.auto=true;S.wave=5;S.autoT=0.6;
  const L=[['chardon',150,170,4,'A'],['coccinelle',300,300,5,'B'],['champignon',280,450,4,'A'],['araignee',400,250,5,'A'],['ruche',560,320,5,'A'],['tournesol',600,100,5,'B'],
    ['chardon',160,320,5,'B'],['coccinelle',800,320,5,'A'],['araignee',640,520,5,'B'],['ruche',380,580,4,'B'],['tournesol',560,450,4,'A'],['champignon',800,560,5,'B']];
  for(const[k,x,y,s,b]of L){const t=place(k,x,y);if(t){t.stage=s;t.branch=b;t.pop=0;}}
  S.fx=[];
}
function showBest(){const b=load('best',{}),v=b[diff]||0;$('best').innerHTML=v?`Record en mode ${DIFF[diff].n.toLowerCase()} : <b>vague ${v}</b>${v>=LAST_WAVE?' (jardin sauvé)':''}`:`Pas encore de record en mode ${DIFF[diff].n.toLowerCase()}.`;}
function setDiff(d){diff=d;save('diff',d);document.querySelectorAll('#seg button').forEach(b=>b.setAttribute('aria-checked',b.dataset.d===d?'true':'false'));showBest();}
document.querySelectorAll('#seg button').forEach(b=>b.addEventListener('click',()=>setDiff(b.dataset.d)));
$('bPlay').addEventListener('click',play);
$('bGal').addEventListener('click',()=>showGallery());
$('bHelp').addEventListener('click',()=>showHelp());
function enterFS(){try{if(!document.fullscreenElement&&gameEl.requestFullscreen){const p=gameEl.requestFullscreen({navigationUI:'hide'});if(p&&p.then)p.then(()=>{try{const o=screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape');if(o&&o.catch)o.catch(()=>{});}catch(e){}}).catch(()=>{});}}catch(e){}}
function toggleFS(){try{if(document.fullscreenElement){document.exitFullscreen();}else enterFS();}catch(e){}}

/* ---------- Boucle ---------- */
let last=performance.now();
function frame(now){
  const raw=Math.min(0.05,(now-last)/1000);last=now;AT+=raw;
  if((started||S.demo)&&!S.paused&&!S.over)for(let i=0;i<S.speed;i++)update(raw);
  else{for(const f of S.fx)f.t+=raw;S.fx=S.fx.filter(f=>f.t<f.d);}
  render();if(started)ui();
  requestAnimationFrame(frame);
}
fit();refreshShopPreviews();setDiff(diff);startDemo();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{refreshShopPreviews();selKey='';});
requestAnimationFrame(frame);
window.__jardin={get S(){return S;},update,place,evolve,startWave,stats,DEFS,XPN,play,toHome};
})();
</script>
</body></html>
